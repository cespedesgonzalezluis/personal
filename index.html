<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Portal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0eff8;--card:#fff;--border:#e2e0f0;
  --text:#0F004F;--muted:#1B0088;--accent:#634dd2;
  --cyan:#00b89e;--green:#22c55e;--green-dk:#059669;
  --red:#ED1650;--amber:#f59e0b;
  --shadow:0 2px 12px rgba(0,0,0,.06);
  --shadow-lg:0 8px 30px rgba(74,44,168,.15);
  --radius:16px;--gap:16px;--sidebar:224px;
}
html,body{height:100%}
body{font-family:'Sofia Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#c4c0e0;border-radius:999px}

/* LAYOUT */
.app{display:flex;flex:1;min-height:100vh}
.sidebar{width:var(--sidebar);background:#0F004F;display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:200;transition:transform .25s ease}
.sidebar-logo{padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
.sidebar-logo-title{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.2px;line-height:1.1}
.sidebar-nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:700;color:rgba(255,255,255,.55);cursor:pointer;border:none;background:transparent;font-family:'Sofia Sans',sans-serif;text-align:left;width:100%;transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.nav-item.active{background:linear-gradient(135deg,rgba(0,184,158,.22),rgba(0,184,158,.10));color:#00e5c8;border:1px solid rgba(0,184,158,.22)}
.nav-icon{width:17px;height:17px;flex-shrink:0}
.nav-soon{font-size:9px;font-weight:800;background:rgba(255,255,255,.08);color:rgba(255,255,255,.35);padding:2px 7px;border-radius:20px;margin-left:auto}
.sidebar-month{padding:14px 12px;border-top:1px solid rgba(255,255,255,.08)}
.sidebar-month-label{font-size:9px;font-weight:800;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
.sidebar-month select{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:8px 10px;font-family:'Sofia Sans',sans-serif;font-size:13px;font-weight:700;color:rgba(255,255,255,.85);cursor:pointer;outline:none;appearance:none}
.sidebar-month select option{background:#1B0088;color:#fff}
.sidebar-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;font-weight:600;color:rgba(255,255,255,.25);line-height:1.5}
.sidebar-footer span{display:block;color:rgba(255,255,255,.45);font-weight:700}
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-width:0}
.content{padding:24px;flex:1}
.hamburger{display:none;position:fixed;top:14px;left:14px;z-index:300;flex-direction:column;gap:5px;background:#fff;border:1px solid var(--border);border-radius:10px;cursor:pointer;padding:8px 10px;box-shadow:var(--shadow)}
.hamburger span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,0,79,.5);z-index:150}

/* HERO */
.hero{background:linear-gradient(135deg,#0F004F 0%,#1B0088 45%,#2d1a6e 100%);border-radius:20px;padding:28px 32px 30px;position:relative;overflow:hidden;margin-bottom:24px;box-shadow:0 16px 40px rgba(15,10,46,.15)}
.orb{position:absolute;border-radius:50%;pointer-events:none}
.orb-1{top:-60px;right:-60px;width:260px;height:260px;background:radial-gradient(circle,rgba(168,85,247,.3) 0%,transparent 70%)}
.orb-2{bottom:-40px;left:35%;width:180px;height:180px;background:radial-gradient(circle,rgba(0,229,200,.12) 0%,transparent 70%)}
.hero-inner{position:relative;z-index:1}
.hero-eyebrow{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.14em;margin-bottom:6px}
.hero-title{font-size:34px;font-weight:800;color:#fff;line-height:1.05;margin-bottom:4px;letter-spacing:-.5px}
.hero-title span{background:linear-gradient(90deg,#00e5c8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:13px;color:rgba(255,255,255,.35);font-weight:500;margin-top:6px}

/* KPI */
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap);margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:box-shadow .2s,transform .2s}
.kpi-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--kpi-stripe,#1B0088)}
.kpi-label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.kpi-val{font-size:20px;font-weight:800;color:var(--text);line-height:1;margin-bottom:6px}
.kpi-delta{font-size:11px;font-weight:700;display:flex;align-items:center;gap:3px}
.delta-up{color:var(--green-dk)}
.delta-down{color:var(--red)}
.delta-flat{color:var(--muted);opacity:.5;font-weight:600}

/* SECTION LABEL */
.sec-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.card-title{font-size:14px;font-weight:800;color:var(--text)}
.grid-main{display:grid;grid-template-columns:3fr 7fr;gap:var(--gap)}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:800;white-space:nowrap}
.badge-navy{background:rgba(27,0,136,.09);color:#1B0088}
.badge-green{background:rgba(22,101,52,.10);color:#166534}
.badge-red{background:rgba(237,22,80,.10);color:#ED1650}
.badge-amber{background:rgba(245,158,11,.12);color:#92400e}
.badge-purple{background:rgba(112,0,171,.09);color:#7000AB}
.badge-teal{background:rgba(0,184,158,.10);color:#007a72}
.badge-gray{background:rgba(156,163,175,.12);color:#6b7280}
.badge-orange{background:rgba(249,115,22,.10);color:#c2410c}

/* PERIOD TOGGLE */
.period-toggle{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px;gap:3px}
.period-btn{border:none;background:transparent;color:var(--muted);font-family:'Sofia Sans',sans-serif;font-size:12px;font-weight:700;padding:5px 14px;border-radius:6px;cursor:pointer;transition:all .15s}
.period-btn.active{background:#1B0088;color:#fff;box-shadow:0 2px 6px rgba(27,0,136,.3)}

/* TABLE */
.tbl-scroll{overflow-y:auto;max-height:340px;scrollbar-width:thin;scrollbar-color:#c4c0e0 transparent}
table{width:100%;border-collapse:separate;border-spacing:0}
thead th{padding:10px 12px;font-size:11px;font-weight:800;color:var(--accent);text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:1}
thead th:last-child{text-align:right}
tbody td{padding:10px 12px;font-size:13px;color:var(--text);border-bottom:1px solid rgba(0,0,0,.04);vertical-align:middle}
tbody td:last-child{text-align:right;font-weight:800}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(99,77,210,.025)}

/* DIST BAR */
.dist-bar{display:flex;height:44px;border-radius:10px;overflow:hidden;gap:2px;margin-bottom:14px}
.dist-seg{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;padding:0 8px;min-width:32px;transition:filter .15s;cursor:default;overflow:hidden}
.dist-seg:hover{filter:brightness(1.1)}
.dist-seg-name{font-size:9px;font-weight:800;white-space:nowrap}
.dist-seg-val{font-size:8px;font-weight:700;opacity:.8}
.bar-row{margin-bottom:11px}
.bar-row:last-child{margin-bottom:0}
.bar-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.bar-name{font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px}
.bar-right{display:flex;gap:8px;align-items:center}
.bar-pct{font-size:11px;color:var(--muted);font-weight:600}
.bar-amt{font-size:12px;font-weight:800;color:var(--text)}
.bar-track{height:5px;background:rgba(27,0,136,.07);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1)}

/* LOADING / ERROR */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px;gap:14px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:#1B0088;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.error-box{background:rgba(237,22,80,.07);border:1px solid rgba(237,22,80,.2);border-radius:12px;padding:20px;text-align:center;font-size:13px;color:var(--red);font-weight:600}

/* TOOLTIP DARK */
.chart-tooltip{position:fixed;z-index:9999;pointer-events:none;background:#1a1040;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 14px;min-width:160px;font-family:'Sofia Sans',sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
.ct-header{font-size:12px;font-weight:800;color:#fff;margin-bottom:8px}
.ct-divider{height:1px;background:rgba(255,255,255,.1);margin-bottom:8px}
.ct-row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:4px}
.ct-row:last-child{margin-bottom:0}
.ct-label{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.55)}
.ct-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.ct-val{font-size:12px;font-weight:800;color:#fff}

/* TC TABLE */
.tc-th{padding:8px 8px;color:var(--muted);font-weight:600;white-space:nowrap;font-size:12px}
.tc-td{padding:9px 8px;font-size:12px}

/* RESPONSIVE */
@media(max-width:1100px){.kpi-strip{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){
  :root{--sidebar:0px}
  .sidebar{transform:translateX(-224px);width:224px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:flex}
  .overlay.active{display:block}
  .kpi-strip{grid-template-columns:repeat(2,1fr)}
  .grid-main{grid-template-columns:1fr}
}
@media(max-width:560px){.content{padding:16px}.hero{padding:22px 18px}.hero-title{font-size:28px}.kpi-strip{grid-template-columns:1fr 1fr}}
@media(max-width:380px){.kpi-strip{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="chart-tooltip" id="chartTooltip">
  <div class="ct-header" id="ct-header"></div>
  <div class="ct-divider"></div>
  <div id="ct-rows"></div>
</div>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<button class="hamburger" id="hamburger" onclick="openSidebar()">
  <span></span><span></span><span></span>
</button>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-title">Mi Portal</div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" onclick="setTab('mensual',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Mensual
      </button>
      <button class="nav-item" onclick="setTab('tc',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Tarjeta Crédito
      </button>
      <button class="nav-item" onclick="setTab('creditos',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        Créditos
        <span class="nav-soon">Pronto</span>
      </button>
      <button class="nav-item" onclick="setTab('mama',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        Mamá
        <span class="nav-soon">Pronto</span>
      </button>
    </nav>
    <div class="sidebar-month">
      <div class="sidebar-month-label">Período</div>
      <select id="month-select" onchange="onMonthChange()">
        <option>Cargando…</option>
      </select>
    </div>
    <div class="sidebar-footer">
      Última actualización<br>
      <span id="sidebar-ts">—</span>
    </div>
  </aside>

  <div class="main">
    <div class="content" id="page-content">
      <div class="loading-state">
        <div class="spinner"></div>
        <div class="loading-text">Conectando con Google Sheets…</div>
      </div>
    </div>
  </div>
</div>

<script>
/* CONFIG */
const SID  = '1nkQ4lsPoGXXzic_GLgkXR9qHlfcEe4j4q6XxheR2U3I';
const BASE = `https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:json`;
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const GASTO_TIPOS = ['ahorro','casa','mamá','mama','transporte','deuda','tarjeta credito'];

/* STATE */
let rawData = [], tcData = [], months = [], selMonth = '', evoRange = 12, charts = {};

/* TOOLTIP MOUSE TRACKING — listener único persistente */
const tip = document.getElementById('chartTooltip');
document.addEventListener('mousemove', e => {
  if (tip.style.display !== 'block') return;
  const w = tip.offsetWidth, x0 = e.clientX + 16;
  tip.style.left = (x0 + w > window.innerWidth - 8 ? e.clientX - w - 16 : x0) + 'px';
  tip.style.top  = (e.clientY - tip.offsetHeight / 2) + 'px';
}, { passive: true });

/* UTILS */
function parseMonto(v) {
  if (v == null) return 0;
  if (typeof v === 'number') return v;
  const n = parseFloat(String(v).replace(/[$.\s]/g,'').replace(',','.'));
  return isNaN(n) ? 0 : n;
}

function parseMesCell(cell) {
  if (!cell) return '';
  const v = cell.v, f = cell.f || '';
  if (!v && v !== 0) return '';
  const sv = String(v);
  if (sv.startsWith('Date(')) {
    const p = sv.replace('Date(','').replace(')','').split(',').map(Number);
    const m = MESES[p[1]];
    return m ? `${m}-${p[0]}` : '';
  }
  if (f && /[a-záéíóúüñ]+-\d{4}/i.test(f)) return f.toLowerCase();
  if (/[a-záéíóúüñ]+-\d{4}/i.test(sv)) return sv.toLowerCase();
  return sv;
}

function monthKey(m) {
  const [mes, año] = String(m).split('-');
  return parseInt(año || 0) * 12 + Math.max(0, MESES.indexOf(mes?.toLowerCase()));
}

function nextMonth(m) {
  const [mes, año] = String(m || '').split('-');
  const mi = MESES.indexOf((mes || '').toLowerCase());
  if (mi === -1 || !año) return '';
  return `${MESES[(mi+1)%12]}-${mi===11?parseInt(año)+1:parseInt(año)}`;
}

function capFirst(s) { return s ? s[0].toUpperCase() + s.slice(1) : ''; }

function fmtM(n, short = false) {
  const abs = Math.abs(n);
  if (short) {
    if (abs >= 1e6) return `$${(abs/1e6).toFixed(1)}M`;
    if (abs >= 1e3) return `$${Math.round(abs/1e3).toLocaleString('es-CL')}K`;
  }
  return `$${Math.round(abs).toLocaleString('es-CL')}`;
}

function deltaKpi(a, b, invert = false) {
  if (!b) return '<span class="delta-flat">—</span>';
  const diff = a - b;
  if (Math.abs(diff) < 1) return '<span class="delta-flat">≈ igual</span>';
  const good = invert ? diff < 0 : diff > 0;
  return `<span class="${good?'delta-up':'delta-down'}">${diff>0?'↑':'↓'} $${Math.round(Math.abs(diff)).toLocaleString('es-CL')} vs ant.</span>`;
}

function fmtFecha(str) {
  if (!str) return '—';
  if (str.startsWith('Date(')) {
    const p = str.replace('Date(','').replace(')','').split(',').map(Number);
    return new Date(p[0], p[1], p[2]).toLocaleDateString('es-CL', {day:'numeric',month:'short',year:'numeric'});
  }
  const d = new Date(str);
  return isNaN(d) ? str : d.toLocaleDateString('es-CL', {day:'numeric',month:'short',year:'numeric'});
}

function fmtMesCorto(mes) {
  if (!mes) return '—';
  const [m, y] = mes.split('-');
  const map = {enero:'ene',febrero:'feb',marzo:'mar',abril:'abr',mayo:'may',junio:'jun',julio:'jul',agosto:'ago',septiembre:'sep',octubre:'oct',noviembre:'nov',diciembre:'dic'};
  return `${map[m]||m} ${y}`;
}

/* FETCH */
async function fetchSheet(sheet) {
  const r = await fetch(`${BASE}&sheet=${encodeURIComponent(sheet)}`);
  if (!r.ok) throw new Error(`HTTP ${r.status} al cargar hoja "${sheet}"`);
  const txt = await r.text();
  const json = JSON.parse(txt.replace(/^[^{]+/,'').replace(/[^}]+$/,''));
  return json.table.rows || [];
}

async function loadData() {
  try {
    const [rowsMensual, rowsTC] = await Promise.all([
      fetchSheet('mensual'),
      fetchSheet('Tarjeta Credito')
    ]);

    rawData = rowsMensual.map(r => ({
      detalle: String(r.c[0]?.v || ''),
      tipo:    String(r.c[1]?.v || '').toLowerCase().trim(),
      mes:     parseMesCell(r.c[2]),
      monto:   parseMonto(r.c[3]?.v)
    })).filter(r => r.mes && r.monto);

    tcData = rowsTC.map(r => ({
      movimiento: String(r.c[0]?.v || ''),
      fecha:      String(r.c[1]?.v || ''),
      total:      parseMonto(r.c[2]?.v),
      cuotas:     Number(r.c[3]?.v || 1),
      cuotaNum:   Number(r.c[4]?.v || 1),
      mes:        parseMesCell(r.c[5]),
      valorCuota: parseMonto(r.c[6]?.v),
      estado:     String(r.c[7]?.v || '').toLowerCase().trim()
    })).filter(r => r.movimiento && r.mes);

    months = [...new Set(rawData.map(r => r.mes))].sort((a,b) => monthKey(a) - monthKey(b));
    selMonth = nextMonth(months[months.length - 1]);

    const displayMonths = [...months, selMonth];
    const sel = document.getElementById('month-select');
    sel.innerHTML = displayMonths.map(m =>
      `<option value="${m}"${m===selMonth?' selected':''}>${capFirst(m)}</option>`
    ).join('');

    const now = new Date();
    document.getElementById('sidebar-ts').textContent =
      now.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'}) +
      ' · ' + now.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});

    renderPage();
  } catch(e) {
    document.getElementById('page-content').innerHTML =
      `<div class="error-box">Error al cargar datos.<br><small style="opacity:.7">${e.message}</small></div>`;
    console.error(e);
  }
}

/* SUMS */
function sumsFor(mes) {
  const searchMes = months.includes(mes) ? mes : months[months.length - 1];
  const rows = rawData.filter(r => r.mes === searchMes);
  const sum = types => rows.filter(r => types.includes(r.tipo)).reduce((a,r) => a+r.monto, 0);
  return {
    ing:   sum(['ingreso']),
    gasto: sum(['ahorro','casa','mamá','mama','transporte','deuda']),
    tc:    sum(['tarjeta credito']),
    ahorro:sum(['ahorro']),
    hip:   rows.filter(r => r.tipo==='deuda' && r.detalle.toLowerCase().includes('hipotecario')).reduce((a,r)=>a+r.monto,0),
    cons:  rows.filter(r => r.tipo==='deuda' && r.detalle.toLowerCase().includes('consumo')).reduce((a,r)=>a+r.monto,0),
    rows
  };
}

function gastoRows(mes) {
  const searchMes = months.includes(mes) ? mes : months[months.length - 1];
  return rawData.filter(r => r.mes === searchMes && GASTO_TIPOS.includes(r.tipo));
}

/* MONTH CHANGE */

<div class="hero">

    <div class="kpi-val">${fmtM(s.tc)}</div>
    <div class="kpi-delta">${deltaKpi(s.tc,prev?.tc,true)}</div>
  </div>
  <div class="kpi-card" style="--kpi-stripe:#7000AB">
    <div class="kpi-label">Crédito Consumo</div>
    <div class="kpi-val">${fmtM(s.cons)}</div>
    <div class="kpi-delta"><span class="delta-flat">cuota fija</span></div>

  <div class="kpi-card" style="--kpi-stripe:#1B0088">

</div>

<div class="sec-label">Evolutivo mensual</div>
<div class="card" style="margin-bottom:24px">

    <span style="display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted)"><span style="width:12px;height:3px;background:#ED1650;display:inline-block;border-radius:2px"></span>Gasto</span>

/* EVOLUTIVO CHART */
function setEvoRange(n, btn) {
  evoRange = n;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderEvoChart();
}

function renderEvoChart() {
  const slice    = evoRange === 0 ? months : months.slice(-evoRange);
  const labels   = slice.map(m => { const [mes,año]=m.split('-'); return `${capFirst(mes).slice(0,3)} ${String(año).slice(2)}`; });
  const ingresos = slice.map(m => sumsFor(m).ing);
  const gastos   = slice.map(m => sumsFor(m).gasto);
  const tcs      = slice.map(m => sumsFor(m).tc);

  const externalTooltip = ctx => {
    const t = ctx.tooltip;
    if (t.opacity === 0) { tip.style.display='none'; return; }
    const i = t.dataPoints[0].dataIndex;
    document.getElementById('ct-header').textContent = labels[i];
    document.getElementById('ct-rows').innerHTML = [
      {color:'#059669',label:'Ingreso',val:fmtM(ingresos[i])},
      {color:'#ED1650',label:'Gasto',  val:fmtM(gastos[i])},
      {color:'#f59e0b',label:'TC',     val:fmtM(tcs[i])},
    ].map(r=>`<div class="ct-row"><div class="ct-label"><span class="ct-dot" style="background:${r.color}"></span>${r.label}</div><div class="ct-val">${r.val}</div></div>`).join('');
    tip.style.display='block';
  };

  if (charts.evo) charts.evo.destroy();
  const ds = (label,data,color,dash) => ({
    label, data, borderColor:color, borderWidth:dash?2:2.5,
    ...(dash?{borderDash:dash}:{}),
    pointRadius:4, pointHoverRadius:7,
    pointBackgroundColor:color, pointBorderColor:'#fff',
    pointBorderWidth:dash?1.5:2, fill:false, tension:.35
  });
  charts.evo = new Chart(document.getElementById('chartEvo'), {
    type:'line',
    data:{ labels, datasets:[
      ds('Ingreso',ingresos,'#059669'),
      ds('Gasto',gastos,'#ED1650'),
      ds('Tarjeta Crédito',tcs,'#f59e0b',[6,4])
    ]},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{enabled:false,external:externalTooltip}},
      scales:{
        x:{grid:{display:false},ticks:{font:{family:"'Sofia Sans',sans-serif",size:10},color:'#634dd2',maxTicksLimit:evoRange===0?20:evoRange,maxRotation:0}},
        y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{family:"'Sofia Sans',sans-serif",size:10},color:'#634dd2',callback:v=>fmtM(v,true)}}
      }
    }
  });
}

/* DETALLE TABLE */
function renderDetalle(prevMes) {
  const prevRows = prevMes ? rawData.filter(r => r.mes===prevMes && GASTO_TIPOS.includes(r.tipo)) : [];
  const rows = gastoRows(selMonth).sort((a,b) => a.detalle.localeCompare(b.detalle,'es'));

  document.getElementById('tbody-detalle').innerHTML = rows.map(row => {
    const prv = prevRows.find(p => p.detalle===row.detalle);
    let badge = '<span style="color:#9CA3AF;font-size:11px;font-weight:700">—</span>';
    if (prv?.monto > 0) {
      const diff = row.monto - prv.monto;
      badge = Math.abs(diff)<1
        ? `<span class="badge badge-gray" style="font-size:10px;padding:2px 8px">≈ igual</span>`
        : `<span class="badge ${diff>0?'badge-red':'badge-green'}" style="font-size:10px;padding:2px 8px">${diff>0?'↑':'↓'} $${Math.round(Math.abs(diff)).toLocaleString('es-CL')}</span>`;
    }
    return `<tr><td style="font-size:13px">${row.detalle}</td><td style="text-align:center">${badge}</td><td>${fmtM(row.monto)}</td></tr>`;
  }).join('') || `<tr><td colspan="3" style="color:#9CA3AF;font-size:12px;padding:20px 0">Sin registros</td></tr>`;
}

/* DISTRIBUCIÓN */
function renderDist() {
  const rows = gastoRows(selMonth).filter(r => r.tipo !== 'tarjeta credito');
  const ing  = sumsFor(selMonth).ing;

  const catDef = [
    {key:'ahorro', label:'Ahorro',      color:'#059669', match:r=>r.tipo==='ahorro'},
    {key:'hip',    label:'Hipotecario', color:'#1B0088', match:r=>r.tipo==='deuda'&&r.detalle.toLowerCase().includes('hipotecario')},
    {key:'cons',   label:'Consumo',     color:'#7000AB', match:r=>r.tipo==='deuda'&&r.detalle.toLowerCase().includes('consumo')},
    {key:'casa',   label:'Casa',        color:'#4257E8', match:r=>r.tipo==='casa'},
    {key:'mama',   label:'Mamá',        color:'#ED1650', match:r=>r.tipo==='mamá'||r.tipo==='mama'},
    {key:'trans',  label:'Transporte',  color:'#00b89e', match:r=>r.tipo==='transporte'},
    {key:'deuda',  label:'Deuda',       color:'#634dd2', match:r=>r.tipo==='deuda'},
    {key:'otros',  label:'Otros',       color:'#c4c0e0', match:()=>false}
  ];

  const bkt = Object.fromEntries(catDef.map(c=>[c.key,0]));
  rows.forEach(r => {
    const cat = catDef.find(c => c.key!=='otros' && c.match(r));
    bkt[cat ? cat.key : 'otros'] += r.monto;
  });

  const sorted = catDef.map(c=>({...c,amt:bkt[c.key]})).filter(c=>c.amt>0).sort((a,b)=>b.amt-a.amt);
  const pctOfIng = c => ing > 0 ? (c.amt/ing*100) : 0;
  const maxAmt = sorted[0]?.amt || 1;

  document.getElementById('dist-bar-wrap').innerHTML = `<div class="dist-bar">${
    sorted.map(c => {
      const pct = pctOfIng(c).toFixed(1)+'%';
      return `<div class="dist-seg" style="background:${c.color};flex:${c.amt}" title="${c.label}: ${fmtM(c.amt,true)} (${pct} del ingreso)"><div class="dist-seg-name">${c.label}</div><div class="dist-seg-val">${pct}</div></div>`;
    }).join('')
  }</div>`;

  document.getElementById('dist-bars').innerHTML = sorted.map(c => `
    <div class="bar-row">
      <div class="bar-meta">
        <div class="bar-name"><span style="width:8px;height:8px;border-radius:2px;background:${c.color};display:inline-block;flex-shrink:0"></span>${c.label}</div>
        <div class="bar-right"><span class="bar-pct">${pctOfIng(c).toFixed(1)}%</span><span class="bar-amt">${fmtM(c.amt,true)}</span></div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${(c.amt/maxAmt*100).toFixed(1)}%;background:${c.color}"></div></div>
    </div>`).join('');
}

/* TARJETA CRÉDITO */
function renderTC() {
  tip.style.display = 'none';
  const pending = tcData.filter(r => r.estado==='pendiente');
  const mesesPend = [...new Set(pending.map(r=>r.mes))].sort((a,b)=>monthKey(a)-monthKey(b));
  const mesActual = mesesPend[0] || '';
  const mesFin    = mesesPend[mesesPend.length-1] || '—';
  const cuotaMesActual = pending.filter(r=>r.mes===mesActual).reduce((a,r)=>a+r.valorCuota,0);
  const movsActivos = [...new Set(pending.map(r=>r.movimiento))].length;

  const proyMap = {};
  pending.forEach(r => { proyMap[r.mes] = (proyMap[r.mes]||0) + r.valorCuota; });
  const proyMeses = Object.entries(proyMap).sort((a,b)=>monthKey(a[0])-monthKey(b[0]));

  const movsMap = {};
  tcData.forEach(r => {
    const k = r.movimiento+'|'+r.fecha;
    if (!movsMap[k]) movsMap[k] = {movimiento:r.movimiento,fecha:r.fecha,total:r.total,cuotas:r.cuotas,valorCuota:r.valorCuota,pagadas:0,pendientesCount:0,pendientesMonto:0,mesFin:''};
    const m = movsMap[k];
    if (r.estado==='pagado') m.pagadas++;
    if (r.estado==='pendiente') {
      m.pendientesCount++;
      m.pendientesMonto += r.valorCuota;
      if (!m.mesFin || monthKey(r.mes)>monthKey(m.mesFin)) m.mesFin = r.mes;
    }
  });

  const movsPend = Object.values(movsMap)
    .filter(m=>m.pendientesCount>0)
    .sort((a,b) => { const df=new Date(a.fecha)-new Date(b.fecha); return df!==0?df:a.movimiento.localeCompare(b.movimiento,'es'); });

  // Total consistente con la tabla (suma de pendientesMonto por movimiento)
  const deudaTotal = movsPend.reduce((a,m) => a+m.pendientesMonto, 0);

  const thStyle = 'class="tc-th"';
  const tdStyle = 'class="tc-td"';

  document.getElementById('page-content').innerHTML = `

<!-- HERO — igual al de mensual -->
<div class="hero">
  <div class="orb orb-1"></div><div class="orb orb-2"></div>
  <div class="hero-inner">
    <div class="hero-eyebrow">Tarjeta Crédito</div>
    <div class="hero-title">${fmtM(deudaTotal)} <span>pendiente</span></div>
  </div>
</div>

<div class="card" style="margin-bottom:var(--gap)">
  <div class="card-header">
    <div class="card-title">Proyección Mensual</div>
    <div style="font-size:11px;color:var(--muted);font-weight:600">${proyMeses.length} meses</div>
  </div>
  <div style="position:relative;height:280px"><canvas id="tc-chart"></canvas></div>
</div>

<div class="card">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <div class="card-title">Movimientos Pendientes</div>
    <div style="font-size:11px;color:var(--muted)">${movsPend.length} movimientos</div>
  </div>
  <div style="overflow-x:auto">
    <table style="border-collapse:collapse;font-size:12px">
      <thead>
        <tr style="border-bottom:2px solid var(--border)">
          <th ${thStyle} style="text-align:left">Movimiento</th>
          <th ${thStyle} style="text-align:center">Fecha</th>
          <th ${thStyle} style="text-align:right">$ Total</th>
          <th ${thStyle} style="text-align:right">$ Pagado</th>
          <th ${thStyle} style="text-align:right">$ Pendiente</th>
          <th ${thStyle} style="text-align:right">$ Cuota</th>
          <th ${thStyle} style="text-align:center">Cuotas</th>
          <th ${thStyle} style="text-align:center">Mes Fin</th>
        </tr>
      </thead>
      <tbody>
        ${movsPend.map((m,i) => {
          const pagadoMonto = m.total - m.pendientesMonto;
          const urgColor = m.pendientesCount===1 ? '#ED1650' : m.pendientesCount<=3 ? '#f59e0b' : '#059669';
          const isProx = m.mesFin===mesActual;
          return `<tr style="border-bottom:1px solid var(--border);background:${isProx?'rgba(0,184,158,.06)':i%2===0?'transparent':'rgba(0,0,0,.015)'}">
            <td ${tdStyle} style="font-weight:600;color:var(--text);max-width:220px">${m.movimiento}</td>
            <td ${tdStyle} style="text-align:center;color:var(--muted);white-space:nowrap">${fmtFecha(m.fecha)}</td>
            <td ${tdStyle} style="text-align:right;color:var(--muted)">$${Math.round(m.total).toLocaleString('es-CL')}</td>
            <td ${tdStyle} style="text-align:right;color:#059669">$${Math.round(pagadoMonto).toLocaleString('es-CL')}</td>
            <td ${tdStyle} style="text-align:right;color:#ED1650;font-weight:700">$${Math.round(m.pendientesMonto).toLocaleString('es-CL')}</td>
            <td ${tdStyle} style="text-align:right;color:var(--muted)">$${Math.round(m.valorCuota).toLocaleString('es-CL')}</td>
            <td ${tdStyle} style="text-align:center"><span style="background:${urgColor};color:#fff;border-radius:12px;padding:2px 9px;font-size:10px;font-weight:700;white-space:nowrap">${m.pagadas}/${m.cuotas}</span></td>
            <td ${tdStyle} style="text-align:center;color:${isProx?'#00b89e':'var(--muted)'};font-weight:${isProx?700:400};white-space:nowrap">${fmtMesCorto(m.mesFin)}</td>
          </tr>`;
        }).join('')}
      </tbody>
      <tfoot>
        <tr style="border-top:2px solid var(--border);background:rgba(0,0,0,.02)">
          <td colspan="4" style="padding:10px 10px;font-weight:700;color:var(--text)">Total Pendiente</td>
          <td style="padding:10px 8px;text-align:right;font-weight:800;color:#ED1650;font-size:13px">$${Math.round(deudaTotal).toLocaleString('es-CL')}</td>
          <td style="padding:10px 8px;text-align:right;font-weight:800;color:var(--muted);font-size:13px">$${Math.round(movsPend.reduce((a,m)=>a+m.valorCuota,0)).toLocaleString('es-CL')}</td>
          <td colspan="2"></td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>`;

  requestAnimationFrame(() => {
    const ctx = document.getElementById('tc-chart');
    if (!ctx) return;
    if (charts.tc) { charts.tc.destroy(); delete charts.tc; }

    // Gradientes por barra
    const chartCtx = ctx.getContext('2d');
    const makeGrad = (colorTop, colorBot) => {
      const g = chartCtx.createLinearGradient(0, 0, 0, 280);
      g.addColorStop(0, colorTop);
      g.addColorStop(1, colorBot);
      return g;
    };
    const bgColors  = proyMeses.map(([mes]) => mes===mesActual ? makeGrad('#00e5c8','#00b89e') : makeGrad('rgba(99,77,210,.85)','rgba(66,44,168,.5)'));
    const hoverBg   = proyMeses.map(([mes]) => mes===mesActual ? '#00e5c8' : 'rgba(99,77,210,1)');

    charts.tc = new Chart(ctx, {
      type:'bar',
      data:{
        labels: proyMeses.map(([mes]) => capFirst(mes.replace('-',' ').replace(' 20'," '"))),
        datasets:[{
          label:'Cuotas',
          data: proyMeses.map(([,v])=>v),
          backgroundColor: bgColors,
          hoverBackgroundColor: hoverBg,
          borderWidth:0,
          borderRadius:8,
          borderSkipped:false
        }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        animation:{ duration:600, easing:'easeOutQuart' },
        plugins:{
          legend:{display:false},
          tooltip:{
            enabled:false,
            external(context) {
              const t = context.tooltip;
              if (t.opacity===0) { tip.style.display='none'; return; }
              const i = t.dataPoints[0].dataIndex;
              const [mes] = proyMeses[i];
              document.getElementById('ct-header').textContent = capFirst(mes.replace('-',' '));
              document.getElementById('ct-rows').innerHTML = `
                <div class="ct-row">
                  <div class="ct-label"><span class="ct-dot" style="background:${mes===mesActual?'#00b89e':'#634dd2'}"></span>Cuotas</div>
                  <div class="ct-val">${fmtM(proyMeses[i][1], true)}</div>
                </div>`;
              tip.style.display='block';
            }
          }
        },
        scales:{
          x:{
            grid:{display:false},
            border:{display:false},
            ticks:{
              font:{family:"'Sofia Sans',sans-serif",size:11,weight:'700'},
              color:'#9CA3AF',
              maxRotation:45
            }
          },
          y:{
            grid:{color:'rgba(27,0,136,.05)',drawTicks:false},
            border:{display:false},
            ticks:{
              font:{family:"'Sofia Sans',sans-serif",size:11},
              color:'#9CA3AF',
              padding:8,
              callback: v => {
                if (v >= 1e6) return '$' + (v/1e6).toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' M';
                if (v >= 1e3) return '$' + Math.round(v/1e3).toLocaleString('es-CL') + ' K';
                return '$' + v;
              }
            }
          }
        }
      }
    });
  });
}

/* SIDEBAR MOBILE */
function openSidebar()  { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('active'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('active'); }
function setTab(tab, btn) {
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  closeSidebar();
  if (tab==='tc') renderTC();
  else if (tab==='mensual') renderPage();
  else {
    // Tabs "Pronto" — ocultar tooltip y mostrar placeholder
    tip.style.display = 'none';
    document.getElementById('page-content').innerHTML =
      `<div class="loading-state"><div class="loading-text">Próximamente…</div></div>`;
  }
}

loadData();
