<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Portal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0eff8;--card:#fff;--border:#e2e0f0;--text:#0F004F;--muted:#6b6a8a;
  --accent:#634dd2;--navy:#1B0088;--green:#059669;--red:#ED1650;--teal:#00b89e;
  --shadow:0 1px 4px rgba(15,0,79,.06),0 4px 16px rgba(15,0,79,.04);
  --shadow-md:0 4px 20px rgba(74,44,168,.12);
  --radius:14px;--gap:16px;--sidebar:220px;--font:'Sofia Sans',sans-serif;
}
html,body{height:100%;font-family:var(--font)}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#c4c0e0;border-radius:999px}
.app{display:flex;flex:1;min-height:100vh}
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-width:0}
.content{padding:24px 28px;flex:1}

/* SIDEBAR */
.sidebar{width:var(--sidebar);background:#0F004F;display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:200;transition:transform .25s ease;border-right:1px solid rgba(255,255,255,.06);}
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px;}
.logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#00e5c8,#a855f7);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-mark svg{width:16px;height:16px;stroke:#fff}
.sidebar-logo-title{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.2px;line-height:1.1}
.sidebar-logo-sub{font-size:10px;font-weight:600;color:rgba(255,255,255,.3);margin-top:1px}
.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav-section{font-size:9px;font-weight:800;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:.14em;padding:10px 8px 4px;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:13px;font-weight:700;color:rgba(255,255,255,.5);cursor:pointer;border:none;background:transparent;font-family:var(--font);text-align:left;width:100%;transition:all .15s;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8)}
.nav-item.active{background:linear-gradient(135deg,rgba(0,184,158,.2),rgba(0,184,158,.08));color:#00e5c8;}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;background:#00e5c8;border-radius:2px;}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active .nav-icon{opacity:1}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:10px;font-weight:600;color:rgba(255,255,255,.2);line-height:1.6;}
.sidebar-footer span{display:block;color:rgba(255,255,255,.4);font-weight:700;font-size:11px}

/* HAMBURGER */
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:300;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--border);border-radius:9px;cursor:pointer;padding:8px 9px;box-shadow:var(--shadow);}
.hamburger span{display:block;width:18px;height:2px;background:var(--text);border-radius:2px}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,0,79,.45);z-index:150;backdrop-filter:blur(2px)}

/* HERO */
.hero{background:linear-gradient(135deg,#0F004F 0%,#1a0080 50%,#2d1a6e 100%);border-radius:18px;padding:26px 30px 28px;position:relative;overflow:hidden;margin-bottom:20px;box-shadow:0 12px 40px rgba(15,0,79,.18);}
.orb{position:absolute;border-radius:50%;pointer-events:none}
.orb-1{top:-50px;right:-50px;width:240px;height:240px;background:radial-gradient(circle,rgba(168,85,247,.25) 0%,transparent 70%)}
.orb-2{bottom:-30px;left:38%;width:160px;height:160px;background:radial-gradient(circle,rgba(0,229,200,.1) 0%,transparent 70%)}
.hero-inner{position:relative;z-index:1}
.hero-eyebrow{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.16em;margin-bottom:5px}
.hero-title{font-size:30px;font-weight:800;color:#fff;line-height:1.08;letter-spacing:-.4px}
.hero-title span{background:linear-gradient(90deg,#00e5c8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:12px;color:rgba(255,255,255,.3);font-weight:500;margin-top:5px}

/* KPI */
.kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-bottom:20px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s;}
.kpi-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.kpi-label{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.kpi-val{font-size:21px;font-weight:800;color:var(--text);line-height:1;margin-bottom:5px}
.kpi-delta{font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px;min-height:16px}
.delta-up{color:var(--green)}.delta-down{color:var(--red)}

/* SECTION / CARD */
.sec-label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:13px;font-weight:800;color:var(--text)}
.grid-main{display:grid;grid-template-columns:3.3fr 6.7fr;gap:var(--gap)}
.mama-grid{display:grid;grid-template-columns:6fr 2.8fr;gap:var(--gap)}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:800;white-space:nowrap}
.badge-navy{background:rgba(27,0,136,.08);color:#1B0088}
.badge-green{background:rgba(5,150,105,.1);color:#065f46}
.badge-red{background:rgba(237,22,80,.08);color:#ED1650}
.badge-teal{background:rgba(0,184,158,.1);color:#007a72}
.badge-gray{background:rgba(156,163,175,.1);color:#6b7280}

/* PERIOD TOGGLE */
.period-toggle{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:2px;gap:2px}
.period-btn{border:none;background:transparent;color:var(--muted);font-family:var(--font);font-size:11px;font-weight:700;padding:4px 12px;border-radius:5px;cursor:pointer;transition:all .15s;}
.period-btn.active{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(27,0,136,.25)}

/* CUSTOM FILTER DROPDOWN */
.filter-row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.filter-group{display:flex;flex-direction:column;gap:5px;position:relative}
.filter-label{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.filter-trigger{
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  background:var(--card);border:1.5px solid var(--border);border-radius:10px;
  padding:9px 14px;cursor:pointer;min-width:220px;
  transition:border-color .15s,box-shadow .15s;
  user-select:none;
}
.filter-trigger:hover{border-color:var(--accent)}
.filter-trigger.open{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,77,210,.1)}
.filter-trigger-left{display:flex;flex-direction:column;gap:2px}
.filter-trigger-val{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.filter-trigger-amt{font-size:10px;font-weight:700;color:var(--muted)}
.filter-trigger-val.placeholder{color:var(--muted);font-weight:600}
.filter-chevron{width:16px;height:16px;flex-shrink:0;color:var(--muted);transition:transform .2s}
.filter-trigger.open .filter-chevron{transform:rotate(180deg)}
.filter-dropdown{
  position:absolute;top:calc(100% + 6px);left:0;z-index:100;
  background:var(--card);border:1.5px solid var(--border);border-radius:12px;
  box-shadow:0 8px 32px rgba(15,0,79,.12);
  min-width:100%;max-height:260px;overflow-y:auto;
  display:none;scrollbar-width:thin;scrollbar-color:#c4c0e0 transparent;
}
.filter-dropdown.open{display:block}
.filter-option{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 14px;cursor:pointer;transition:background .1s;
  border-bottom:1px solid rgba(0,0,0,.04);
}
.filter-option:last-child{border-bottom:none}
.filter-option:hover{background:rgba(99,77,210,.04)}
.filter-option.selected{background:rgba(99,77,210,.06)}
.filter-option-name{font-size:12px;font-weight:600;color:var(--text)}
.filter-option-amt{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
.filter-option.selected .filter-option-name{color:var(--accent);font-weight:700}
.filter-option.selected .filter-option-amt{color:var(--accent)}
.filter-option-check{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.filter-option.selected .filter-option-check{background:var(--accent);border-color:var(--accent)}
.filter-option.selected .filter-option-check::after{content:'';width:7px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block}
.filter-clear{display:flex;align-items:center;gap:6px;padding:7px 14px;cursor:pointer;border-top:1px solid var(--border);background:rgba(237,22,80,.03)}
.filter-clear:hover{background:rgba(237,22,80,.07)}
.filter-clear-txt{font-size:11px;font-weight:700;color:var(--red)}
.filter-active-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(99,77,210,.08);border:1px solid rgba(99,77,210,.2);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;margin-left:4px}
.filter-active-badge:hover{background:rgba(237,22,80,.08);border-color:rgba(237,22,80,.2);color:var(--red)}

/* TABLE */
.tbl-scroll{overflow-y:auto;max-height:340px;scrollbar-width:thin;scrollbar-color:#c4c0e0 transparent}
table{width:100%;border-collapse:separate;border-spacing:0}
thead th{padding:9px 12px;font-size:10px;font-weight:800;color:var(--accent);text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:1;letter-spacing:.04em;}
thead th:last-child{text-align:right}
tbody td{padding:9px 12px;font-size:12px;color:var(--text);border-bottom:1px solid rgba(0,0,0,.035);vertical-align:middle}
tbody td:last-child{text-align:right;font-weight:800}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(99,77,210,.02)}
.tc-th{padding:8px;color:var(--muted);font-weight:700;white-space:nowrap;font-size:11px}
.tc-td{padding:9px 8px;font-size:12px}

/* DIST BARS */
.dist-bar{display:flex;height:40px;border-radius:9px;overflow:hidden;gap:2px;margin-bottom:12px}
.dist-seg{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;padding:0 8px;min-width:fit-content;transition:filter .15s;cursor:default}
.dist-seg:hover{filter:brightness(1.1)}
.dist-seg-name,.dist-seg-val{font-size:8px;white-space:nowrap}
.dist-seg-val{font-weight:700;opacity:.75}
.bar-row{margin-bottom:10px}.bar-row:last-child{margin-bottom:0}
.bar-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.bar-name{font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px}
.bar-right{display:flex;gap:8px;align-items:center}
.bar-pct{font-size:10px;color:var(--muted);font-weight:600}
.bar-amt{font-size:12px;font-weight:800;color:var(--text)}
.bar-track{height:4px;background:rgba(27,0,136,.06);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1)}

/* LEGEND / MISC */
.chart-legend{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.legend-dot{width:12px;height:3px;display:inline-block;border-radius:2px;flex-shrink:0}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px;gap:12px}
.spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.error-box{background:rgba(237,22,80,.06);border:1px solid rgba(237,22,80,.18);border-radius:12px;padding:20px;text-align:center;font-size:13px;color:var(--red);font-weight:600}
.debug-box{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.25);border-radius:10px;padding:12px 16px;font-size:12px;color:#92400e;font-weight:600;margin-bottom:14px;line-height:1.7}
.debug-box code{background:rgba(245,158,11,.15);padding:1px 5px;border-radius:4px;font-size:11px;font-family:monospace;font-weight:700}

/* TOOLTIP */
.chart-tooltip{position:fixed;z-index:9999;pointer-events:none;background:#150a40;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;min-width:180px;font-family:var(--font);box-shadow:0 8px 32px rgba(0,0,0,.35);display:none}
.ct-header{font-size:11px;font-weight:800;color:#fff;margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.ct-divider{height:1px;background:rgba(255,255,255,.08);margin-bottom:7px}
.ct-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:4px}
.ct-row:last-child{margin-bottom:0}
.ct-label{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.5)}
.ct-dot{width:6px;height:6px;border-radius:2px;flex-shrink:0}
.ct-val{font-size:12px;font-weight:800;color:#fff}

@media(max-width:900px){
  :root{--sidebar:0px}
  .sidebar{transform:translateX(-224px);width:224px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}.hamburger{display:flex}.overlay.active{display:block}
  .kpi-strip{grid-template-columns:repeat(2,1fr)}
  .grid-main,.mama-grid{grid-template-columns:1fr}
  .filter-row{flex-direction:column}
  .filter-trigger{min-width:100%}
}
@media(max-width:560px){.content{padding:14px 16px}.hero{padding:20px 18px}.hero-title{font-size:26px}.kpi-strip{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="chart-tooltip" id="chartTooltip">
  <div class="ct-header" id="ct-header"></div>
  <div class="ct-divider"></div>
  <div id="ct-rows"></div>
</div>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<button class="hamburger" id="hamburger" onclick="openSidebar()"><span></span><span></span><span></span></button>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <div>
        <div class="sidebar-logo-title">Mi Portal</div>
        <div class="sidebar-logo-sub">Finanzas Personales</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Reportes</div>
      <button class="nav-item active" onclick="setTab('mensual',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Mensual
      </button>
      <button class="nav-item" onclick="setTab('tc',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Tarjeta Crédito
      </button>
      <button class="nav-item" onclick="setTab('creditos',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        Créditos
      </button>
      <div class="nav-section">Familia</div>
      <button class="nav-item" onclick="setTab('mama',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        Mamá
      </button>
    </nav>
    <select id="month-select" style="display:none"></select>
    <div class="sidebar-footer">Última actualización<br><span id="sidebar-ts">—</span></div>
  </aside>
  <div class="main">
    <div class="content" id="page-content">
      <div class="loading-state"><div class="spinner"></div><div class="loading-text">Conectando con Google Sheets…</div></div>
    </div>
  </div>
</div>
<script>
// ── CONFIG ──
const SID  = '1nkQ4lsPoGXXzic_GLgkXR9qHlfcEe4j4q6XxheR2U3I';
const BASE = `https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:json`;
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const GASTO_TIPOS = ['ahorro','casa','mamá','mama','transporte','deuda','tarjeta credito'];
const ESTADO_PENDIENTE = new Set(['pendiente','por pagar','pending','activo','no pagado','debe','p']);

// ── STATE ──
let rawData=[], tcData=[], credData=[], mamaData=[];
let months=[], selMonth='', evoRange=12, mamaEvoRange=12;
let charts={}, tcFiltroMes='', tcFiltroMov='';
let ahorroCredito=0, inicioAhorro='';

// ── TOOLTIP ──
const tip = document.getElementById('chartTooltip');
document.addEventListener('mousemove', e => {
  if(tip.style.display!=='block') return;
  const w=tip.offsetWidth, x0=e.clientX+16;
  tip.style.left=(x0+w>window.innerWidth-8?e.clientX-w-16:x0)+'px';
  tip.style.top=(e.clientY-tip.offsetHeight/2)+'px';
},{passive:true});
// Close dropdowns on outside click
document.addEventListener('click', e => {
  if(!e.target.closest('.filter-group')) closeAllDropdowns();
});
function showTooltip(header,rows){
  document.getElementById('ct-header').textContent=header;
  document.getElementById('ct-rows').innerHTML=rows.map(r=>`<div class="ct-row"><div class="ct-label"><span class="ct-dot" style="background:${r.color}"></span>${r.label}</div><div class="ct-val">${r.val}</div></div>`).join('');
  tip.style.display='block';
}
function hideTooltip(){tip.style.display='none';}
function makeExternalTooltip(getHeader,getRows){
  return ctx=>{
    if(ctx.tooltip.opacity===0){hideTooltip();return;}
    const i=ctx.tooltip.dataPoints[0].dataIndex;
    showTooltip(getHeader(i),getRows(i));
  };
}

// ── UTILS ──
const capFirst = s => s?s[0].toUpperCase()+s.slice(1):'';
const parseMonto = v => {
  if(v==null) return 0;
  if(typeof v==='number') return v;
  const n=parseFloat(String(v).replace(/[$.\s]/g,'').replace(',','.'));
  return isNaN(n)?0:n;
};
function parseMesCell(cell){
  if(!cell) return '';
  const{v,f=''}=cell;
  if(!v&&v!==0) return '';
  const sv=String(v);
  if(sv.startsWith('Date(')){
    const p=sv.replace('Date(','').replace(')','').split(',').map(Number);
    const m=MESES[p[1]]; return m?`${m}-${p[0]}`:'';
  }
  if(f&&/[a-záéíóúüñ]+-\d{4}/i.test(f)) return f.toLowerCase();
  if(/[a-záéíóúüñ]+-\d{4}/i.test(sv)) return sv.toLowerCase();
  return sv;
}
function parseMesMama(cell){
  if(!cell) return '';
  const base=parseMesCell(cell);
  if(base) return base;
  const sv=String(cell.v||'');
  const iso=sv.match(/^(\d{4})-(\d{1,2})-\d{1,2}$/);
  if(iso){const m=MESES[parseInt(iso[2],10)-1];return m?`${m}-${iso[1]}`:''}
  return '';
}
const monthKey = m => {
  const[mes,año]=String(m).split('-');
  return parseInt(año||0)*12+Math.max(0,MESES.indexOf(mes?.toLowerCase()));
};
function parseFechaNum(str){
  if(!str) return 0;
  if(str.startsWith('Date(')){
    const p=str.replace('Date(','').replace(')','').split(',').map(Number);
    return new Date(p[0],p[1],p[2]).getTime();
  }
  return new Date(str).getTime()||0;
}
// Formato $ con separador de miles CLP — siempre sin sufijo
function fmtM(n,short=false){
  const abs=Math.abs(n);
  if(short){
    if(abs>=1e6) return`$${(abs/1e6).toFixed(1)}M`;
    if(abs>=1e3) return`$${Math.round(abs/1e3).toLocaleString('es-CL')}K`;
  }
  return`$${Math.round(abs).toLocaleString('es-CL')}`;
}
// Formato simple miles, sin $ — para valores dentro de barras
function fmtNum(n){
  return Math.round(Math.abs(n)).toLocaleString('es-CL');
}
// Delta KPI: icono + monto con color, sin texto "vs ant."
function deltaKpi(a,b,inv=false){
  if(!b) return '';
  const d=a-b;
  if(Math.abs(d)<1) return '';
  const good=inv?d<0:d>0;
  return`<span class="${good?'delta-up':'delta-down'}">${d>0?'↑':'↓'} $${Math.round(Math.abs(d)).toLocaleString('es-CL')}</span>`;
}
function fmtFecha(str){
  if(!str) return '—';
  if(str.startsWith('Date(')){
    const p=str.replace('Date(','').replace(')','').split(',').map(Number);
    return new Date(p[0],p[1],p[2]).toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'});
  }
  const d=new Date(str);
  return isNaN(d)?str:d.toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'});
}
function fmtMesLabel(mes){
  if(!mes) return '—';
  const[m,y]=mes.split('-');
  return`${capFirst(m)} ${y}`;
}
function fmtMesCorto(mes){
  if(!mes) return '—';
  const[m,y]=mes.split('-');
  const map={enero:'ene',febrero:'feb',marzo:'mar',abril:'abr',mayo:'may',junio:'jun',julio:'jul',agosto:'ago',septiembre:'sep',octubre:'oct',noviembre:'nov',diciembre:'dic'};
  return`${map[m]||m} ${y}`;
}

function stdLineOptions(tooltipFn,maxTicks=12){

// [2] Etiquetas barras TC: formato $25.000 sin M
const BAR_LABELS_PLUGIN={id:'barLabels',afterDatasetsDraw(chart){
  const{ctx,data}=chart;
  ctx.save();
  data.datasets[0].data.forEach((val,i)=>{
    if(!val) return;
    const bar=chart.getDatasetMeta(0).data[i];
    ctx.font=`700 10px ${SF}`;
    ctx.fillStyle='rgba(0,0,0,.55)';
    ctx.textAlign='center';
    ctx.textBaseline='bottom';
    // [2] fmtM sin short = formato completo $25.000
    ctx.fillText(fmtM(val), bar.x, bar.y-3);
  });
  ctx.restore();
}};

// Valores dentro de barras Mamá
const MAMA_BAR_LABELS_PLUGIN={id:'mamaBarLabels',afterDatasetsDraw(chart){
  const{ctx,scales:{y}}=chart;
  ctx.save();
  chart.data.datasets.forEach((ds,di)=>{
    if(ds.type==='line') return;
    const meta=chart.getDatasetMeta(di);
    ds.data.forEach((val,i)=>{
      if(!val) return;
      const bar=meta.data[i];
      const barH=Math.abs(y.getPixelForValue(0)-bar.y);
      if(barH<18) return;
      ctx.font=`700 9px ${SF}`;
      ctx.fillStyle='rgba(255,255,255,.9)';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      const midY=val>0?(bar.y+(y.getPixelForValue(0)-bar.y)/2):(bar.y-(bar.y-y.getPixelForValue(0))/2);
      ctx.fillText(fmtNum(Math.abs(val)), bar.x, midY);
    });
  });
  ctx.restore();
}};

function closeAllDropdowns(){
  document.querySelectorAll('.filter-dropdown.open').forEach(d=>{
    d.classList.remove('open');
    d.previousElementSibling?.classList.remove('open');
  });
}
function toggleDropdown(id){
  const dd=document.getElementById(id);
  const trigger=dd.previousElementSibling;
  const wasOpen=dd.classList.contains('open');
  closeAllDropdowns();
  if(!wasOpen){dd.classList.add('open');trigger.classList.add('open');}
}
function buildDropdown(id,options,currentVal,placeholder,onSelect){
  const selected=options.find(o=>o.value===currentVal);
  const triggerContent=selected
    ?`<div class="filter-trigger-left"><div class="filter-trigger-val">${selected.label}</div><div class="filter-trigger-amt">${selected.amt}</div></div>`
    :`<div class="filter-trigger-left"><div class="filter-trigger-val placeholder">${placeholder}</div></div>`;
  const chevron=`<svg class="filter-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;
  const optionsHtml=options.map(o=>`
    <div class="filter-option${o.value===currentVal?' selected':''}" onclick="(${onSelect})(${JSON.stringify(o.value)});closeAllDropdowns()">
      <div class="filter-option-name">${o.label}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="filter-option-amt">${o.amt}</div>
        <div class="filter-option-check"></div>
      </div>
    </div>`).join('');
  const clearHtml=currentVal
    ?`<div class="filter-clear" onclick="(${onSelect})('');closeAllDropdowns()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span class="filter-clear-txt">Limpiar selección</span></div>`:'';
  return`<div class="filter-trigger${currentVal?' open':''}" onclick="event.stopPropagation();toggleDropdown('${id}')">${triggerContent}${chevron}</div>
    <div class="filter-dropdown" id="${id}">${optionsHtml}${clearHtml}</div>`;
}

// ── DATA ──
async function fetchSheet(sheet){
  const r=await fetch(`${BASE}&sheet=${encodeURIComponent(sheet)}`);
  if(!r.ok) throw new Error(`HTTP ${r.status} al cargar "${sheet}"`);
  const txt=await r.text();
  return JSON.parse(txt.replace(/^[^{]+/,'').replace(/[^}]+$/,'')).table.rows||[];
}
async function loadData(){
  try{
    const[rowsMensual,rowsTC,rowsCred,rowsMama,rowsOtros]=await Promise.all([
      fetchSheet('mensual'),fetchSheet('Tarjeta Credito'),fetchSheet('Creditos'),fetchSheet('Mama'),fetchSheet('Otros')
    ]);
    rawData=rowsMensual.map(r=>({
      detalle:String(r.c[0]?.v||''),tipo:String(r.c[1]?.v||'').toLowerCase().trim(),
      mes:parseMesCell(r.c[2]),monto:parseMonto(r.c[3]?.v)
    })).filter(r=>r.mes&&r.monto);
    tcData=rowsTC.map(r=>{
      const total=parseMonto(r.c[2]?.v),cuotas=Number(r.c[3]?.v)||0;
      const rawValor=parseMonto(r.c[6]?.v);
      return{movimiento:String(r.c[0]?.v||''),fecha:String(r.c[1]?.v||''),total,cuotas,
        mes:parseMesCell(r.c[5]),valorCuota:rawValor>0?rawValor:(total>0?total/cuotas:0),
        estado:String(r.c[7]?.v||'').toLowerCase().trim()};
    }).filter(r=>r.movimiento&&r.mes);
    credData=rowsCred.map(r=>({
      detalle:String(r.c[0]?.v||''),fecha:String(r.c[1]?.v||''),cuotas:Number(r.c[2]?.v)||0,
      mes:parseMesCell(r.c[3]),cuotaNum:Number(r.c[4]?.v)||0,
      valorCuota:parseMonto(r.c[5]?.v),estado:String(r.c[6]?.v||'').toLowerCase().trim()
    })).filter(r=>r.detalle&&r.mes);
    mamaData=rowsMama.map(r=>({
      mes:parseMesMama(r.c[0]),tipo:String(r.c[1]?.v||'').toLowerCase().trim(),
      detalle:String(r.c[2]?.v||'').trim(),monto:parseMonto(r.c[3]?.v)
    })).filter(r=>r.mes&&r.detalle);
    // Leer Ahorro Credito (S1) e Inicio (S2) desde hoja Otros — columna S = índice 18
    if(rowsOtros.length>=2){
      ahorroCredito=parseMonto(rowsOtros[0]?.c[18]?.v)||0;
      const rawFecha=rowsOtros[1]?.c[18]?.v;
      if(rawFecha){
        let d;
        if(String(rawFecha).startsWith('Date(')){
          const p=String(rawFecha).replace('Date(','').replace(')','').split(',').map(Number);
          d=new Date(p[0],p[1],p[2]);
        } else {
          d=new Date(rawFecha);
        }
        if(!isNaN(d)) inicioAhorro=d.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});
        else inicioAhorro=String(rawFecha);
      }
    }
    months=[...new Set(rawData.map(r=>r.mes))].sort((a,b)=>monthKey(a)-monthKey(b));
    selMonth=months[months.length-1];
    document.getElementById('month-select').innerHTML=months.map(m=>`<option value="${m}"${m===selMonth?' selected':''}>${fmtMesLabel(m)}</option>`).join('');
    const now=new Date();
    document.getElementById('sidebar-ts').textContent=now.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'})+' · '+now.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
    renderPage();
  }catch(e){
    document.getElementById('page-content').innerHTML=`<div class="error-box">Error al cargar datos.<br><small style="opacity:.7">${e.message}</small></div>`;
  }
}

// ── DATA HELPERS ──
function sumsFor(mes){
  const m=months.includes(mes)?mes:months[months.length-1];
  const rows=rawData.filter(r=>r.mes===m);
  const sum=types=>rows.filter(r=>types.includes(r.tipo)).reduce((a,r)=>a+r.monto,0);
  return{ing:sum(['ingreso']),gasto:sum(['ahorro','casa','mamá','mama','transporte','deuda']),tc:sum(['tarjeta credito'])};
}
function gastoRows(mes){
  const m=months.includes(mes)?mes:months[months.length-1];
  return rawData.filter(r=>r.mes===m&&GASTO_TIPOS.includes(r.tipo));
}
const CAT_DEF=[
  {key:'ahorro',  label:'Ahorro',      color:'#059669',match:r=>r.tipo==='ahorro'},
  {key:'hip',     label:'Hipotecario', color:'#1B0088',match:r=>r.tipo==='deuda'&&r.detalle.toLowerCase().includes('hipotecario')},
  {key:'cons',    label:'Consumo',     color:'#7000AB',match:r=>r.tipo==='deuda'&&r.detalle.toLowerCase().includes('consumo')},
  {key:'casa',    label:'Casa',        color:'#4257E8',match:r=>r.tipo==='casa'},
  {key:'mama',    label:'Mamá',        color:'#ED1650',match:r=>r.tipo==='mamá'||r.tipo==='mama'},
  {key:'trans',   label:'Transporte',  color:'#00b89e',match:r=>r.tipo==='transporte'},
  {key:'deuda',   label:'Deuda',       color:'#634dd2',match:r=>r.tipo==='deuda'},
  {key:'otros',   label:'Otros',       color:'#c4c0e0',match:()=>false},
];
function getCatAmounts(mes){
  const rows=gastoRows(mes).filter(r=>r.tipo!=='tarjeta credito');
  const bkt=Object.fromEntries(CAT_DEF.map(c=>[c.key,0]));
  rows.forEach(r=>{const cat=CAT_DEF.find(c=>c.key!=='otros'&&c.match(r));bkt[cat?cat.key:'otros']+=r.monto;});
  return bkt;
}

function renderEvoChart(){
  const slice=evoRange===0?months:months.slice(-evoRange);
  const labels=slice.map(m=>{const[mes,año]=m.split('-');return[mes.slice(0,3).toUpperCase(),año];});
  const labelsFmt=slice.map(m=>fmtMesLabel(m));
  const ingresos=slice.map(m=>sumsFor(m).ing);
  const gastos=slice.map(m=>sumsFor(m).gasto);
  const tcs=slice.map(m=>sumsFor(m).tc);
  function varHtml(curr,prev,inv=false){
    if(prev==null||prev===0) return '';
    const d=curr-prev;if(Math.abs(d)<1) return '';
    const good=inv?d<0:d>0;
    return` <span style="color:${good?'#22c55e':'#f87171'};font-size:10px;font-weight:700">${d>0?'↑':'↓'} ${fmtM(Math.abs(d),true)}</span>`;
  }
  const tooltipFn=makeExternalTooltip(i=>labelsFmt[i],i=>{
    const p=i>0?i-1:null;
    return[
      {color:'#059669',label:'Ingreso',val:fmtM(ingresos[i])+varHtml(ingresos[i],p!==null?ingresos[p]:null)},
      {color:'#ED1650',label:'Gasto',val:fmtM(gastos[i])+varHtml(gastos[i],p!==null?gastos[p]:null,true)},
      {color:'#f59e0b',label:'TC',val:fmtM(tcs[i])+varHtml(tcs[i],p!==null?tcs[p]:null,true)},
    ];
  });
  if(charts.evo) charts.evo.destroy();
  charts.evo=new Chart(document.getElementById('chartEvo'),{type:'line',data:{labels,datasets:[lineDataset('Ingreso',ingresos,'#059669'),lineDataset('Gasto',gastos,'#ED1650'),lineDataset('TC',tcs,'#f59e0b')]},options:stdLineOptions(tooltipFn,evoRange===0?20:evoRange)});
}

// [1] Evolutivo de distribución: stacked area en % + valor CLP en tooltip
function renderDistEvo(){
  const slice=evoRange===0?months:months.slice(-evoRange);
  const labels=slice.map(m=>{const[mes,año]=m.split('-');return[mes.slice(0,3).toUpperCase(),año];});
  const labelsFmt=slice.map(m=>fmtMesLabel(m));
  const activeCats=CAT_DEF.filter(c=>c.key!=='otros');
  // % por categoría por mes
  const pctData=activeCats.map(cat=>({
    ...cat,
    pcts:slice.map(m=>{
      const ing=sumsFor(m).ing;
      if(!ing) return 0;
      return Math.round(getCatAmounts(m)[cat.key]/ing*1000)/10;
    }),
    amts:slice.map(m=>getCatAmounts(m)[cat.key]||0)
  }));
  const datasets=pctData.map(cat=>({
    label:cat.label,data:cat.pcts,
    borderColor:cat.color,backgroundColor:cat.color+'55',
    borderWidth:1.5,pointRadius:2,pointHoverRadius:5,
    pointBackgroundColor:cat.color,pointBorderColor:'#fff',pointBorderWidth:1.5,
    fill:true,tension:.4,stack:'area',
  }));
  // [1] Tooltip: % + valor en $
  const tooltipFn=makeExternalTooltip(
    i=>labelsFmt[i],
    i=>pctData.filter(c=>c.pcts[i]>0).map(c=>({
      color:c.color,
      label:c.label,
      // [1] porcentaje + valor CLP sin sufijo
      val:`${c.pcts[i].toFixed(1)}%  ${fmtM(c.amts[i])}`
    }))
  );
  if(charts.dist) charts.dist.destroy();
  charts.dist=new Chart(document.getElementById('chartDist'),{
    type:'line',data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{enabled:false,external:tooltipFn}},
      scales:{
        x:{grid:{display:false},ticks:{font:{family:SF,size:10},color:'#9CA3AF',maxTicksLimit:evoRange===0?20:evoRange,maxRotation:0}},
        y:{stacked:true,grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{family:SF,size:10},color:'#9CA3AF',callback:v=>`${v}%`},min:0,max:100}
      }
    }
  });
}

function renderDetalle(prevMes){
  const rows=rawData.filter(r=>r.mes===selMonth).sort((a,b)=>{const t=a.tipo.localeCompare(b.tipo,'es');return t!==0?t:a.detalle.localeCompare(b.detalle,'es');});
  const prevRows=prevMes?rawData.filter(r=>r.mes===prevMes):[];
  document.getElementById('tbody-detalle').innerHTML=rows.map(row=>{
    const prv=prevRows.find(p=>p.detalle===row.detalle);
    let badge='<span style="color:#9CA3AF;font-size:11px;font-weight:700">—</span>';
    if(prv?.monto>0){
      const d=row.monto-prv.monto;
      if(Math.abs(d)<1){badge=`<span class="badge badge-gray" style="font-size:10px;padding:2px 7px">≈ igual</span>`;}
      else{const esIngreso=row.tipo==='ingreso';const good=esIngreso?(d>0):(d<0);badge=`<span class="badge ${good?'badge-green':'badge-red'}" style="font-size:10px;padding:2px 7px">${d>0?'↑':'↓'} $${Math.round(Math.abs(d)).toLocaleString('es-CL')}</span>`;}
    }
    const montoHtml=row.monto?fmtM(row.monto):`<span style="color:#9CA3AF;font-size:12px;font-weight:600">—</span>`;
    return`<tr><td style="font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap">${capFirst(row.tipo)}</td><td style="font-size:12px">${row.detalle}</td><td style="text-align:center">${badge}</td><td>${montoHtml}</td></tr>`;
  }).join('')||`<tr><td colspan="4" style="color:#9CA3AF;font-size:12px;padding:20px 0">Sin registros</td></tr>`;
}

function renderDist(){
  const rows=gastoRows(selMonth).filter(r=>r.tipo!=='tarjeta credito');
  const ing=sumsFor(selMonth).ing;
  const bkt=Object.fromEntries(CAT_DEF.map(c=>[c.key,0]));
  rows.forEach(r=>{const cat=CAT_DEF.find(c=>c.key!=='otros'&&c.match(r));bkt[cat?cat.key:'otros']+=r.monto;});
  const sorted=CAT_DEF.map(c=>({...c,amt:bkt[c.key]})).filter(c=>c.amt>0).sort((a,b)=>b.amt-a.amt);
  const totalGastos=sorted.reduce((a,c)=>a+c.amt,0);
  const disponible=ing-totalGastos;
  const dispColor=disponible>=0?'#16a34a':'#ED1650';
  const dispLabel=disponible>=0?'Disponible':'Déficit';
  const allSegs=[...sorted,{key:'disp',label:dispLabel,color:dispColor,amt:Math.abs(disponible)}];
  const pct=amt=>ing>0?(amt/ing*100):0;
  const maxAmt=Math.max(...allSegs.map(c=>c.amt),1);
  document.getElementById('dist-bar-wrap').innerHTML=`<div class="dist-bar">${allSegs.map(c=>`<div class="dist-seg" style="background:${c.color};flex:${c.amt}" title="${c.label}: ${fmtM(c.amt,true)} (${pct(c.amt).toFixed(1)}% ingreso)"><div class="dist-seg-name">${c.label}</div><div class="dist-seg-val">${pct(c.amt).toFixed(1)}%</div></div>`).join('')}</div>`;
  document.getElementById('dist-bars').innerHTML=[
    ...sorted.map(c=>`<div class="bar-row"><div class="bar-meta"><div class="bar-name"><span style="width:7px;height:7px;border-radius:2px;background:${c.color};display:inline-block;flex-shrink:0"></span>${c.label}</div><div class="bar-right"><span class="bar-pct">${pct(c.amt).toFixed(1)}%</span><span class="bar-amt">${fmtM(c.amt,true)}</span></div></div><div class="bar-track"><div class="bar-fill" style="width:${(c.amt/maxAmt*100).toFixed(1)}%;background:${c.color}"></div></div></div>`),
    `<div class="bar-row" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)"><div class="bar-meta"><div class="bar-name"><span style="width:7px;height:7px;border-radius:2px;background:${dispColor};display:inline-block;flex-shrink:0"></span><strong style="color:${dispColor}">${dispLabel}</strong></div><div class="bar-right"><span class="bar-pct">${pct(Math.abs(disponible)).toFixed(1)}%</span><span class="bar-amt" style="color:${dispColor}">${disponible<0?'-':''}${fmtM(Math.abs(disponible),true)}</span></div></div><div class="bar-track"><div class="bar-fill" style="width:${(Math.abs(disponible)/maxAmt*100).toFixed(1)}%;background:${dispColor}"></div></div></div>`
  ].join('');
}

// ── PAGE: TARJETA CRÉDITO ──
function renderTC(){
  hideTooltip();
  const pending=tcData.filter(r=>ESTADO_PENDIENTE.has(r.estado));
  function fechaToMesKey(f){
    if(!f) return '';
    let d;
    if(f.startsWith('Date(')){const p=f.replace('Date(','').replace(')','').split(',').map(Number);d=new Date(p[0],p[1],p[2]);}
    else d=new Date(f);
    return isNaN(d)?'':`${MESES[d.getMonth()]}-${d.getFullYear()}`;
  }
  const movsMap={};
  tcData.forEach(r=>{
    const k=r.movimiento+'|'+r.fecha;
    if(!movsMap[k]) movsMap[k]={movimiento:r.movimiento,fecha:r.fecha,total:r.total,cuotas:r.cuotas,valorCuota:r.valorCuota,pagadas:0,pendientesCount:0,pendientesMonto:0,mesFin:'',mesCompra:fechaToMesKey(r.fecha)};
    const m=movsMap[k];
    if(ESTADO_PENDIENTE.has(r.estado)){m.pendientesCount++;m.pendientesMonto+=r.valorCuota;if(!m.mesFin||monthKey(r.mes)>monthKey(m.mesFin))m.mesFin=r.mes;}
  });
  Object.values(movsMap).forEach(m=>{m.pagadas=Math.max(0,m.cuotas-m.pendientesCount);});
  const todosMovsPend=Object.values(movsMap).filter(m=>m.pendientesCount>0).sort((a,b)=>{const d=parseFechaNum(a.fecha)-parseFechaNum(b.fecha);return d!==0?d:a.movimiento.localeCompare(b.movimiento,'es');});
  const deudaTotal=todosMovsPend.reduce((a,m)=>a+m.pendientesMonto,0);
  const mesesCompra=[...new Set(todosMovsPend.map(m=>m.mesCompra).filter(Boolean))].sort((a,b)=>monthKey(a)-monthKey(b));
  const movNombres=[...new Set(todosMovsPend.map(m=>m.movimiento))].sort((a,b)=>a.localeCompare(b,'es'));
  let movsFiltrados=todosMovsPend;
  if(tcFiltroMes) movsFiltrados=movsFiltrados.filter(m=>m.mesCompra===tcFiltroMes);
  if(tcFiltroMov) movsFiltrados=movsFiltrados.filter(m=>m.movimiento===tcFiltroMov);
  const deudaFiltrada=movsFiltrados.reduce((a,m)=>a+m.pendientesMonto,0);
  const filteredMovKeys=new Set(movsFiltrados.map(m=>m.movimiento+'|'+m.fecha));
  const proyMap={};
  tcData.filter(r=>ESTADO_PENDIENTE.has(r.estado)&&filteredMovKeys.has(r.movimiento+'|'+r.fecha))
    .forEach(r=>{proyMap[r.mes]=(proyMap[r.mes]||0)+r.valorCuota;});
  const proyMeses=Object.entries(proyMap).sort((a,b)=>monthKey(a[0])-monthKey(b[0]));
  const estadosUnicos=[...new Set(tcData.map(r=>r.estado||'(vacío)'))];
  const debugBox=tcData.length===0
    ?`<div class="debug-box">⚠ No se cargaron filas de <code>Tarjeta Credito</code>.</div>`
    :pending.length===0?`<div class="debug-box">⚠ ${tcData.length} filas cargadas pero ninguna pendiente.<br>Estados: ${estadosUnicos.map(e=>`<code>${e}</code>`).join(' · ')}</div>`:'';
  // [2] Tooltip TC: valor en $ sin M
  const tooltipFn=makeExternalTooltip(
    i=>fmtMesLabel(proyMeses[i][0]),
    i=>[{color:'#00b89e',label:'Cuotas',val:fmtM(proyMeses[i][1])}]
  );

  // [3] Filtros custom dropdown modernos
  const opsMeses=mesesCompra.map(m=>({
    value:m,
    label:fmtMesLabel(m),
    amt:fmtM(todosMovsPend.filter(mv=>mv.mesCompra===m).reduce((a,mv)=>a+mv.pendientesMonto,0))
  }));
  const opsMov=movNombres.map(n=>({
    value:n,label:n,
    amt:fmtM(todosMovsPend.filter(mv=>mv.movimiento===n).reduce((a,mv)=>a+mv.pendientesMonto,0))
  }));

  const filtrosHTML=`
    <div class="filter-row">
      <div class="filter-group">
        <div class="filter-label">Mes de compra</div>
        ${buildDropdown('dd-mes',opsMeses,tcFiltroMes,'Todos los meses',`v=>{tcFiltroMes=v;renderTC()}`)}
      </div>
      <div class="filter-group">
        <div class="filter-label">Movimiento</div>
        ${buildDropdown('dd-mov',opsMov,tcFiltroMov,'Todos los movimientos',`v=>{tcFiltroMov=v;renderTC()}`)}
      </div>
      ${(tcFiltroMes||tcFiltroMov)?`<div style="display:flex;flex-direction:column;gap:5px;align-self:flex-end">
        <div class="filter-label">Pendiente filtrado</div>
        <div style="padding:9px 14px;background:rgba(237,22,80,.07);border:1.5px solid rgba(237,22,80,.2);border-radius:10px;font-size:13px;font-weight:800;color:#ED1650">${fmtM(deudaFiltrada)}</div>
      </div>`:''}
    </div>`;

  document.getElementById('page-content').innerHTML=`
${UI.hero('Tarjeta Crédito',fmtM(deudaTotal),'pendiente')}
${debugBox}
${UI.card('Proyección Mensual',`<div style="font-size:11px;color:var(--muted);font-weight:600">${proyMeses.length} meses</div>`,`<div style="position:relative;height:260px"><canvas id="tc-chart"></canvas></div>`,'margin-bottom:var(--gap)')}
${UI.card('Movimientos Pendientes',`<div style="font-size:11px;color:var(--muted)">${movsFiltrados.length} movimientos</div>`,`${filtrosHTML}
<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:12px">
  <thead><tr style="border-bottom:2px solid var(--border)">
    <th class="tc-th" style="text-align:left">Movimiento</th>
    <th class="tc-th" style="text-align:center">Fecha</th>
    <th class="tc-th" style="text-align:right">$ Total</th>
    <th class="tc-th" style="text-align:right">$ Pagado</th>
    <th class="tc-th" style="text-align:right">$ Pendiente</th>
    <th class="tc-th" style="text-align:right">$ Cuota</th>
    <th class="tc-th" style="text-align:center">Cuotas</th>
    <th class="tc-th" style="text-align:center">Mes Fin</th>
  </tr></thead>
  <tbody>${movsFiltrados.map((m,i)=>{
    const pagadoMonto=m.total-m.pendientesMonto;
    const isUltima=m.pendientesCount===1;
    const bg=i%2===0?'transparent':'rgba(0,0,0,.012)';
    const pill=isUltima?`<span style="margin-left:5px;font-size:9px;font-weight:800;background:rgba(0,184,158,.12);color:#007a72;padding:1px 5px;border-radius:5px;vertical-align:middle">ÚLTIMA</span>`:'';
    return`<tr style="border-bottom:1px solid var(--border);background:${bg}">
      <td class="tc-td" style="font-weight:600;color:var(--text);max-width:220px">${m.movimiento}${pill}</td>
      <td class="tc-td" style="text-align:center;color:var(--muted);white-space:nowrap">${fmtFecha(m.fecha)}</td>
      <td class="tc-td" style="text-align:right;color:var(--muted)">$${Math.round(m.total).toLocaleString('es-CL')}</td>
      <td class="tc-td" style="text-align:right;color:#059669">$${Math.round(pagadoMonto).toLocaleString('es-CL')}</td>
      <td class="tc-td" style="text-align:right;color:#ED1650;font-weight:700">$${Math.round(m.pendientesMonto).toLocaleString('es-CL')}</td>
      <td class="tc-td" style="text-align:right;color:var(--muted)">$${Math.round(m.valorCuota).toLocaleString('es-CL')}</td>
      <td class="tc-td" style="text-align:center;min-width:80px">
        <div style="font-size:10px;font-weight:700;color:${isUltima?'#007a72':'var(--muted)'};margin-bottom:3px">${m.pagadas}/${m.cuotas}</div>
        <div style="height:3px;background:rgba(27,0,136,.07);border-radius:3px;overflow:hidden"><div style="height:100%;width:${Math.round(m.pagadas/Math.max(m.cuotas,1)*100)}%;background:${isUltima?'#00b89e':'#634dd2'};border-radius:3px"></div></div>
      </td>
      <td class="tc-td" style="text-align:center;color:${isUltima?'#007a72':'var(--muted)'};font-weight:${isUltima?700:400};white-space:nowrap">${fmtMesCorto(m.mesFin)}</td>
    </tr>`;
  }).join('')}</tbody>
  <tfoot><tr style="border-top:2px solid var(--border);background:rgba(0,0,0,.015)">
    <td colspan="4" style="padding:9px;font-weight:700;color:var(--text)">Total Pendiente</td>
    <td style="padding:9px 8px;text-align:right;font-weight:800;color:#ED1650;font-size:13px">$${Math.round(deudaFiltrada).toLocaleString('es-CL')}</td>
    <td style="padding:9px 8px;text-align:right;font-weight:800;color:var(--muted);font-size:13px">$${Math.round(movsFiltrados.reduce((a,m)=>a+m.valorCuota,0)).toLocaleString('es-CL')}</td>
    <td colspan="2"></td>
  </tr></tfoot>
</table></div>`)}`;
  requestAnimationFrame(()=>{
    const canvas=document.getElementById('tc-chart');
    if(!canvas) return;
    if(charts.tc){charts.tc.destroy();delete charts.tc;}
    const ctx=canvas.getContext('2d');
    const grad=ctx.createLinearGradient(0,0,0,260);
    grad.addColorStop(0,'#00e5c8');grad.addColorStop(1,'#00b89e');
    charts.tc=new Chart(canvas,{type:'bar',plugins:[BAR_LABELS_PLUGIN],data:{
      labels:proyMeses.map(([mes])=>{const[m,y]=mes.split('-');return[m.slice(0,3).toUpperCase(),y];}),
      datasets:[{label:'Cuotas',data:proyMeses.map(([,v])=>v),backgroundColor:grad,hoverBackgroundColor:'#00e5c8',borderWidth:0,borderRadius:7,borderSkipped:false}]
    },options:{...stdBarOptions(tooltipFn),layout:{padding:{top:22}}}});
  });
}

// ── PAGE: CRÉDITOS ──
function renderCreditos(){
  hideTooltip();
  function fmtFechaCredito(str){
    if(!str) return '—';
    if(str.startsWith('Date(')){const p=str.replace('Date(','').replace(')','').split(',').map(Number);return fmtMesCorto(`${MESES[p[1]]}-${p[0]}`);}
    const d=new Date(str);if(!isNaN(d)) return fmtMesCorto(`${MESES[d.getMonth()]}-${d.getFullYear()}`);return str;
  }
  function fechaTs(str){
    if(!str) return 0;
    if(str.startsWith('Date(')){const p=str.replace('Date(','').replace(')','').split(',').map(Number);return new Date(p[0],p[1],p[2]).getTime();}
    return new Date(str).getTime()||0;
  }
  const creditosMap={};
  credData.forEach(r=>{
    if(!creditosMap[r.detalle]) creditosMap[r.detalle]={detalle:r.detalle,fecha:r.fecha,cuotas:r.cuotas,valorCuota:r.valorCuota,pagadas:0,pendientes:0,mesFin:'',mesFinPagado:''};
    const c=creditosMap[r.detalle];
    if(r.estado==='pagado'){c.pagadas++;if(!c.mesFinPagado||monthKey(r.mes)>monthKey(c.mesFinPagado))c.mesFinPagado=r.mes;}
    else{c.pendientes++;if(!c.mesFin||monthKey(r.mes)>monthKey(c.mesFin))c.mesFin=r.mes;}
    if(r.valorCuota>0) c.valorCuota=r.valorCuota;
  });
  const todos=Object.values(creditosMap).filter(c=>c.cuotas>0).sort((a,b)=>fechaTs(a.fecha)-fechaTs(b.fecha));
  const activos=todos.filter(c=>c.pendientes>0),pagados=todos.filter(c=>c.pendientes===0);
  const totalCuotaMes=activos.reduce((a,c)=>a+c.valorCuota,0);
  const totalPendiente=activos.reduce((a,c)=>a+c.valorCuota*c.pendientes,0);
  const ACCENT='#634dd2';
  function cardHTML(c){
    const esActivo=c.pendientes>0,pct=c.cuotas>0?Math.round(c.pagadas/c.cuotas*100):0;
    const montoTotal=c.valorCuota*c.cuotas,montoPendiente=c.valorCuota*c.pendientes;
    const barGrad=esActivo?`linear-gradient(90deg,${ACCENT},#a855f7)`:`linear-gradient(90deg,#059669,#22c55e)`;
    const pctColor=esActivo?ACCENT:'#059669',mesFinal=esActivo?c.mesFin:c.mesFinPagado;
    return`<div class="card" style="position:relative;overflow:hidden">
      <div style="position:absolute;top:0;left:0;right:0;height:2px;background:${pctColor}"></div>
      <div style="margin-bottom:16px"><div style="font-size:14px;font-weight:800;color:var(--text);margin-bottom:3px">${c.detalle}</div><div style="font-size:10px;color:var(--muted);font-weight:600">Desde ${fmtFechaCredito(c.fecha)}</div></div>
      <div style="margin-bottom:18px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px"><span style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Progreso</span><span style="font-size:17px;font-weight:800;color:${pctColor}">${pct}%</span></div>
        <div style="height:8px;background:rgba(99,77,210,.07);border-radius:6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${barGrad};border-radius:6px;transition:width .8s cubic-bezier(.4,0,.2,1)"></div></div>
        <div style="display:flex;justify-content:space-between;margin-top:4px"><span style="font-size:9px;font-weight:600;color:var(--muted)">$0</span><span style="font-size:9px;font-weight:600;color:var(--muted)">${fmtM(montoTotal,true)}</span></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <div style="background:rgba(99,77,210,.04);border-radius:8px;padding:10px"><div style="font-size:8px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">Total cuotas</div><div style="font-size:18px;font-weight:800;color:var(--text)">${c.cuotas}</div></div>
        <div style="background:rgba(99,77,210,.04);border-radius:8px;padding:10px"><div style="font-size:8px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">Pagadas</div><div style="font-size:18px;font-weight:800;color:#059669">${c.pagadas}</div></div>
        <div style="background:rgba(99,77,210,.04);border-radius:8px;padding:10px"><div style="font-size:8px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">Restantes</div><div style="font-size:18px;font-weight:800;color:${esActivo?'#ED1650':'#9CA3AF'}">${c.pendientes}</div></div>
        <div style="background:rgba(99,77,210,.04);border-radius:8px;padding:10px"><div style="font-size:8px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">Valor cuota</div><div style="font-size:15px;font-weight:800;color:var(--text)">${fmtM(c.valorCuota,true)}</div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border)">
        <div><div style="font-size:8px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px">${esActivo?'Pendiente total':'Total pagado'}</div><div style="font-size:14px;font-weight:800;color:${esActivo?'#ED1650':'#059669'}">${fmtM(esActivo?montoPendiente:montoTotal)}</div></div>
        <div style="text-align:right"><div style="font-size:8px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px">${esActivo?'Mes fin':'Terminó'}</div><div style="font-size:14px;font-weight:800;color:${esActivo?ACCENT:'#9CA3AF'}">${mesFinal?fmtMesCorto(mesFinal):'—'}</div></div>
      </div></div>`;
  }
  // ── Calcular meta prepago (10% deuda pendiente crédito consumo ITAU) ──
  const creditoConsumo = activos.find(c => /consumo|itau/i.test(c.detalle));

  const metaPrepago = Math.round(montoPendienteConsumo * 0.10);

  // ── Card prepago HTML ──

  <div class="card-header">
    <div class="card-title">Prepago — Crédito de Consumo</div>
    <span class="badge badge-navy">10% del saldo</span>
  </div>
  <p style="font-size:11px;color:var(--muted);margin:-8px 0 16px">Junta el equivalente al 10% de tu deuda y realiza un abono anticipado.${inicioAhorro?` <span style="font-weight:700">Ahorrando desde ${inicioAhorro}.</span>`:''}</p>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">

        <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none">$</span>

      </div>
      ${creditoConsumo?`<div style="font-size:9px;color:var(--muted);margin-top:4px">Saldo pendiente: ${fmtM(montoPendienteConsumo)}</div>`:''}
    </div>
    <div>
      <div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px">Lo que ya tienes</div>
      <div style="position:relative">
        <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none">$</span>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Progreso hacia la meta</span>
      <span style="font-size:20px;font-weight:800;color:var(--accent)" id="pp-pct">0%</span>

</div>

  ${activos.length?activos.map(cardHTML).join(''):'<div style="color:#9CA3AF;font-size:13px;padding:20px 0">Sin créditos activos</div>'}
</div>

// ── PAGE: MAMÁ ──
function calcMamaSaldos(){
  const meses=[...new Set(mamaData.map(r=>r.mes))].sort((a,b)=>monthKey(a)-monthKey(b));
  let acum=0;
  return meses.map(mes=>{
    const rows=mamaData.filter(r=>r.mes===mes);
    const ingresos=rows.filter(r=>r.tipo==='ingreso').reduce((a,r)=>a+r.monto,0);
    const gastos=rows.filter(r=>r.tipo!=='ingreso').reduce((a,r)=>a+r.monto,0);
    acum+=ingresos-gastos;
    return{mes,ingresos,gastos,neto:ingresos-gastos,saldo:acum};
  });
}
function setMamaRange(n,btn){
  mamaEvoRange=n;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderMamaChart(calcMamaSaldos());
}
function renderMama(){
  hideTooltip();
  if(!mamaData.length){
    document.getElementById('page-content').innerHTML=`<div class="error-box">No se encontraron datos en la pestaña <strong>Mama</strong>.</div>`;
    return;
  }
  const saldoPorMes=calcMamaSaldos();
  const mamaMeses=saldoPorMes.map(s=>s.mes);
  const saldoActual=saldoPorMes[saldoPorMes.length-1]?.saldo||0;
  const prevSaldo=saldoPorMes.length>1?saldoPorMes[saldoPorMes.length-2]:null;
  const diff=prevSaldo!=null?saldoActual-prevSaldo.saldo:null;

  const tablaRows=[...mamaMeses].reverse().map(mes=>{
    const rows=mamaData.filter(r=>r.mes===mes);
    const sp=saldoPorMes.find(s=>s.mes===mes);
    const netColor=sp.neto>=0?'#059669':'#ED1650';
    const netoFmt=(sp.neto>=0?'+':'-')+fmtM(Math.abs(sp.neto));
    // [4] Agrupar por detalle, [4] orden: tipo (ingreso primero) luego nombre alfabético
    const grupoMap={};
    rows.forEach(r=>{
      const key=r.detalle.trim();
      if(!grupoMap[key]) grupoMap[key]={detalle:key,monto:0,tipo:r.tipo};
      grupoMap[key].monto+=r.monto;
    });
    const rowsHTML=Object.values(grupoMap)
      .sort((a,b)=>{
        const tipoOrd=t=>t==='ingreso'?0:1;
        const tDiff=tipoOrd(a.tipo)-tipoOrd(b.tipo);
        return tDiff!==0?tDiff:a.detalle.localeCompare(b.detalle,'es');
      })
      .map(g=>{
        const ing=g.tipo==='ingreso';
        const color=ing?'#059669':'#ED1650';
        return`<tr>
          <td style="padding:5px 10px;font-size:12px;color:var(--muted);font-weight:600;padding-left:22px">
            <span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:${color};margin-right:5px;vertical-align:middle"></span>${g.detalle}
          </td>
          <td style="padding:5px 10px;text-align:right;font-size:12px;font-weight:800;color:${color}">${ing?'+':'-'}${fmtM(g.monto)}</td>
        </tr>`;
      }).join('');
    return`<tbody>
      <tr style="background:rgba(27,0,136,.03);border-top:2px solid var(--border)">
        <td style="padding:7px 10px;font-size:12px;font-weight:800;color:var(--text)">${fmtMesLabel(mes)}</td>
        <td style="padding:7px 10px;text-align:right;font-size:12px;font-weight:800;color:${netColor}">${netoFmt}</td>
      </tr>${rowsHTML}</tbody>`;
  }).join('');

  const diffHtml=diff!=null
    ?`<div style="display:inline-flex;align-items:center;gap:8px;background:${diff>=0?'rgba(5,150,105,.07)':'rgba(237,22,80,.07)'};border:1px solid ${diff>=0?'rgba(5,150,105,.18)':'rgba(237,22,80,.18)'};border-radius:9px;padding:7px 14px;margin-bottom:20px">
        <span style="font-size:12px;font-weight:700;color:var(--muted)">vs mes anterior</span>
        <span style="font-size:17px;font-weight:800;color:${diff>=0?'#059669':'#ED1650'}">${diff>=0?'↑':'↓'} ${diff>=0?'':'-'}${fmtM(Math.abs(diff),true)}</span>
      </div>`:'';

  document.getElementById('page-content').innerHTML=`
${UI.hero('Ahorro Mamá',fmtM(Math.abs(saldoActual)),saldoActual>=0?'disponible':'déficit','Seguimiento de aportes y gastos')}
${diffHtml}
${UI.sectionLabel('Ahorro Mamá')}
<div class="mama-grid" style="margin-bottom:24px">
  ${UI.card('Ingresos · Gastos · Saldo acumulado',
    UI.periodToggle(mamaEvoRange,[{val:12,label:'12M',fn:'setMamaRange(12,this)'},{val:0,label:'Todo',fn:'setMamaRange(0,this)'}]),
    `<div style="position:relative;height:340px"><canvas id="mama-chart"></canvas></div>${UI.chartLegend([{color:'#059669',label:'Ingresos'},{color:'#ED1650',label:'Gastos'},{color:'#1B0088',label:'Saldo acumulado'}])}`
  )}
  ${UI.card('Movimientos por Mes','',`<div class="tbl-scroll" style="max-height:380px"><table style="width:100%">
    <thead><tr style="border-bottom:2px solid var(--border)">
      <th style="padding:8px 10px;font-size:10px;font-weight:800;color:var(--accent);text-align:left;position:sticky;top:0;background:var(--card);z-index:1">Detalle</th>
      <th style="padding:8px 10px;font-size:10px;font-weight:800;color:var(--accent);text-align:right;position:sticky;top:0;background:var(--card);z-index:1">Monto</th>
    </tr></thead>
    ${tablaRows}
  </table></div>`)}
</div>`;
  renderMamaChart(saldoPorMes);
}

function renderMamaChart(saldoPorMes){
  const slice=mamaEvoRange===0?saldoPorMes:saldoPorMes.slice(-mamaEvoRange);
  const canvas=document.getElementById('mama-chart');
  if(!canvas) return;
  if(charts.mama){charts.mama.destroy();delete charts.mama;}
  const labels=slice.map(s=>{const[m,y]=s.mes.split('-');return[m.slice(0,3).toUpperCase(),y];});
  const labelsFmt=slice.map(s=>fmtMesLabel(s.mes));
  const tooltipFn=makeExternalTooltip(i=>labelsFmt[i],i=>{
    const s=slice[i];
    const fmtSigned=v=>v<0?`-${fmtM(Math.abs(v))}`:fmtM(v);
    return[
      {color:'#1B0088',label:'Saldo acum.',val:fmtSigned(s.saldo)},
      {color:'#059669',label:'Ingresos',val:fmtM(s.ingresos)},
      {color:'#ED1650',label:'Gastos',val:fmtM(s.gastos)},
      {color:'#6b6a8a',label:'Neto mes',val:fmtSigned(s.neto)},
    ];
  });
  charts.mama=new Chart(canvas,{
    type:'bar',plugins:[MAMA_BAR_LABELS_PLUGIN],
    data:{labels,datasets:[
      {label:'Ingresos',data:slice.map(s=>s.ingresos),backgroundColor:'rgba(5,150,105,.6)',borderColor:'rgba(5,150,105,.85)',borderWidth:1,borderRadius:{topLeft:4,topRight:4,bottomLeft:0,bottomRight:0},stack:'stack',order:2},
      {label:'Gastos',data:slice.map(s=>-s.gastos),backgroundColor:'rgba(237,22,80,.5)',borderColor:'rgba(237,22,80,.75)',borderWidth:1,borderRadius:{topLeft:0,topRight:0,bottomLeft:4,bottomRight:4},stack:'stack',order:2},
      {label:'Saldo acumulado',data:slice.map(s=>s.saldo),type:'line',borderColor:'#1B0088',borderWidth:2.5,pointRadius:3.5,pointHoverRadius:6,pointBackgroundColor:'#1B0088',pointBorderColor:'#fff',pointBorderWidth:2,fill:false,tension:.3,order:1,yAxisID:'ySaldo'}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{enabled:false,external:tooltipFn}},
      scales:{
        x:{grid:{display:false},ticks:{font:{family:SF,size:10},color:'#9CA3AF',maxRotation:0}},
        y:{stacked:true,grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{family:SF,size:10},color:'#9CA3AF',callback:v=>fmtM(v,true)}},
        ySaldo:{position:'right',grid:{display:false},ticks:{font:{family:SF,size:10},color:'#1B0088',callback:v=>fmtM(v,true)}}
      }
    }
  });
}

// ── NAV ──

function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('active');}

// ── PREPAGO CRÉDITO ──
function ppCalc(){
  const meta  = parseFloat(document.getElementById('pp-meta')?.value)  || 0;
  const tengo = parseFloat(document.getElementById('pp-tengo')?.value) || 0;
  const mes   = parseFloat(document.getElementById('pp-mes')?.value)   || 0;
  const falta = Math.max(0, meta - tengo);
  const pct   = meta > 0 ? Math.min(100, Math.round(tengo / meta * 100)) : 0;

  const fillEl = document.getElementById('pp-fill');
  if(fillEl) fillEl.style.width = pct + '%';
  const pctEl = document.getElementById('pp-pct');
  if(pctEl) pctEl.textContent = pct + '%';
  const metaLbl = document.getElementById('pp-meta-label');
  if(metaLbl) metaLbl.textContent = meta > 0 ? 'Meta: ' + fmtM(meta) : 'Meta: —';
  const ahorradoEl = document.getElementById('pp-ahorrado');
  if(ahorradoEl) ahorradoEl.textContent = tengo > 0 ? fmtM(tengo) : '—';
  const faltaEl = document.getElementById('pp-falta');
  if(faltaEl) faltaEl.textContent = meta > 0 ? (falta === 0 ? '¡Listo!' : fmtM(falta)) : '—';

  const alertEl = document.getElementById('pp-alert');
  const resEl   = document.getElementById('pp-meses-res');

  if(meta > 0 && tengo >= meta){
    if(alertEl){
      alertEl.style.display='block';
      alertEl.style.background='rgba(5,150,105,.08)';
      alertEl.style.border='1px solid rgba(5,150,105,.2)';
      alertEl.style.color='#065f46';
      alertEl.textContent='✓ ¡Ya alcanzaste la meta! Puedes realizar el prepago.';
    }
    if(resEl) resEl.textContent='';
  } else if(meta > 0 && mes > 0 && falta > 0){
    const meses = Math.ceil(falta / mes);
    const d = new Date();
    d.setMonth(d.getMonth() + meses);
    const MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const llegada = MESES_CORTO[d.getMonth()] + ' ' + d.getFullYear();
    if(resEl) resEl.innerHTML = `→ llegarías en <strong>${meses} mes${meses!==1?'es':''}</strong> (~${llegada})`;
    if(alertEl) alertEl.style.display='none';
  } else {
    if(resEl) resEl.textContent = '→ ingresa un monto mensual';
    if(alertEl) alertEl.style.display='none';
  }
}

loadData();
