<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Portal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f0eff8;--card:#fff;--border:#e2e0f0;--text:#0F004F;--muted:#1B0088;--accent:#634dd2;--green-dk:#059669;--red:#ED1650;--shadow:0 2px 12px rgba(0,0,0,.06);--shadow-lg:0 8px 30px rgba(74,44,168,.15);--radius:16px;--gap:16px;--sidebar:224px}
html,body{height:100%}
body{font-family:'Sofia Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#c4c0e0;border-radius:999px}
.app{display:flex;flex:1;min-height:100vh}
.sidebar{width:var(--sidebar);background:#0F004F;display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:200;transition:transform .25s ease}
.sidebar-logo{padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
.sidebar-logo-title{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.2px;line-height:1.1}
.sidebar-nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:700;color:rgba(255,255,255,.55);cursor:pointer;border:none;background:transparent;font-family:'Sofia Sans',sans-serif;text-align:left;width:100%;transition:all .15s}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85)}
.nav-item.active{background:linear-gradient(135deg,rgba(0,184,158,.22),rgba(0,184,158,.10));color:#00e5c8;border:1px solid rgba(0,184,158,.22)}
.nav-icon{width:17px;height:17px;flex-shrink:0}
.nav-soon{font-size:9px;font-weight:800;background:rgba(255,255,255,.08);color:rgba(255,255,255,.35);padding:2px 7px;border-radius:20px;margin-left:auto}
.sidebar-month{padding:14px 12px;border-top:1px solid rgba(255,255,255,.08)}
.sidebar-month-label{font-size:9px;font-weight:800;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px}
.sidebar-month select{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:8px 10px;font-family:'Sofia Sans',sans-serif;font-size:13px;font-weight:700;color:rgba(255,255,255,.85);cursor:pointer;outline:none;appearance:none}
.sidebar-month select option{background:#1B0088;color:#fff}
.sidebar-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;font-weight:600;color:rgba(255,255,255,.25);line-height:1.5}
.sidebar-footer span{display:block;color:rgba(255,255,255,.45);font-weight:700}
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-width:0}
.content{padding:24px;flex:1}
.hamburger{display:none;position:fixed;top:14px;left:14px;z-index:300;flex-direction:column;gap:5px;background:#fff;border:1px solid var(--border);border-radius:10px;cursor:pointer;padding:8px 10px;box-shadow:var(--shadow)}
.hamburger span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,0,79,.5);z-index:150}
.hero{background:linear-gradient(135deg,#0F004F 0%,#1B0088 45%,#2d1a6e 100%);border-radius:20px;padding:28px 32px 30px;position:relative;overflow:hidden;margin-bottom:24px;box-shadow:0 16px 40px rgba(15,10,46,.15)}
.orb{position:absolute;border-radius:50%;pointer-events:none}
.orb-1{top:-60px;right:-60px;width:260px;height:260px;background:radial-gradient(circle,rgba(168,85,247,.3) 0%,transparent 70%)}
.orb-2{bottom:-40px;left:35%;width:180px;height:180px;background:radial-gradient(circle,rgba(0,229,200,.12) 0%,transparent 70%)}
.hero-inner{position:relative;z-index:1}
.hero-eyebrow{font-size:11px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.14em;margin-bottom:6px}
.hero-title{font-size:34px;font-weight:800;color:#fff;line-height:1.05;margin-bottom:4px;letter-spacing:-.5px}
.hero-title span{background:linear-gradient(90deg,#00e5c8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:13px;color:rgba(255,255,255,.35);font-weight:500;margin-top:6px}
.kpi-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap);margin-bottom:24px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.kpi-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.kpi-card::before{display:none}
.kpi-label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.kpi-val{font-size:20px;font-weight:800;color:var(--text);line-height:1;margin-bottom:6px}
.kpi-delta{font-size:11px;font-weight:700;display:flex;align-items:center;gap:3px}
.delta-up{color:var(--green-dk)}.delta-down{color:var(--red)}.delta-flat{color:var(--muted);opacity:.5;font-weight:600}
.sec-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.card-title{font-size:14px;font-weight:800;color:var(--text)}
.grid-main{display:grid;grid-template-columns:3.3fr 6.7fr;gap:var(--gap)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:800;white-space:nowrap}
.badge-navy{background:rgba(27,0,136,.09);color:#1B0088}.badge-green{background:rgba(22,101,52,.10);color:#166534}.badge-red{background:rgba(237,22,80,.10);color:#ED1650}.badge-amber{background:rgba(245,158,11,.12);color:#92400e}.badge-purple{background:rgba(112,0,171,.09);color:#7000AB}.badge-teal{background:rgba(0,184,158,.10);color:#007a72}.badge-gray{background:rgba(156,163,175,.12);color:#6b7280}
.period-toggle{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:3px;gap:3px}
.period-btn{border:none;background:transparent;color:var(--muted);font-family:'Sofia Sans',sans-serif;font-size:12px;font-weight:700;padding:5px 14px;border-radius:6px;cursor:pointer;transition:all .15s}
.period-btn.active{background:#1B0088;color:#fff;box-shadow:0 2px 6px rgba(27,0,136,.3)}
.tbl-scroll{overflow-y:auto;max-height:340px;scrollbar-width:thin;scrollbar-color:#c4c0e0 transparent}
table{width:100%;border-collapse:separate;border-spacing:0}
thead th{padding:10px 12px;font-size:11px;font-weight:800;color:var(--accent);text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:1}
thead th:last-child{text-align:right}
tbody td{padding:10px 12px;font-size:13px;color:var(--text);border-bottom:1px solid rgba(0,0,0,.04);vertical-align:middle}
tbody td:last-child{text-align:right;font-weight:800}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(99,77,210,.025)}
.tc-th{padding:8px 8px;color:var(--muted);font-weight:600;white-space:nowrap;font-size:12px}
.tc-td{padding:9px 8px;font-size:12px}
.dist-bar{display:flex;height:44px;border-radius:10px;overflow:hidden;gap:2px;margin-bottom:14px}
.dist-seg{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;padding:0 10px;min-width:fit-content;transition:filter .15s;cursor:default}
.dist-seg:hover{filter:brightness(1.1)}
.dist-seg-name,.dist-seg-val{font-size:9px;white-space:nowrap}
.dist-seg-val{font-weight:700;opacity:.8}
.bar-row{margin-bottom:11px}
.bar-row:last-child{margin-bottom:0}
.bar-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.bar-name{font-size:12px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:7px}
.bar-right{display:flex;gap:8px;align-items:center}
.bar-pct{font-size:11px;color:var(--muted);font-weight:600}
.bar-amt{font-size:12px;font-weight:800;color:var(--text)}
.bar-track{height:5px;background:rgba(27,0,136,.07);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.chart-legend{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted)}
.legend-dot{width:12px;height:3px;display:inline-block;border-radius:2px;flex-shrink:0}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px;gap:14px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:#1B0088;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.error-box{background:rgba(237,22,80,.07);border:1px solid rgba(237,22,80,.2);border-radius:12px;padding:20px;text-align:center;font-size:13px;color:var(--red);font-weight:600}
.debug-box{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:12px;padding:14px 18px;font-size:13px;color:#92400e;font-weight:600;margin-bottom:16px;line-height:1.7}
.debug-box code{background:rgba(245,158,11,.15);padding:1px 6px;border-radius:4px;font-size:12px;font-family:monospace;font-weight:700}
.chart-tooltip{position:fixed;z-index:9999;pointer-events:none;background:#1a1040;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px 14px;min-width:160px;font-family:'Sofia Sans',sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
.ct-header{font-size:12px;font-weight:800;color:#fff;margin-bottom:8px}
.ct-divider{height:1px;background:rgba(255,255,255,.1);margin-bottom:8px}
.ct-row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:4px}
.ct-row:last-child{margin-bottom:0}
.ct-label{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.55)}
.ct-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.ct-val{font-size:12px;font-weight:800;color:#fff;display:flex;align-items:center;gap:4px}
@media(max-width:1100px){.kpi-strip{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){:root{--sidebar:0px}.sidebar{transform:translateX(-224px);width:224px}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.hamburger{display:flex}.overlay.active{display:block}.kpi-strip{grid-template-columns:repeat(2,1fr)}.grid-main{grid-template-columns:1fr}}
@media(max-width:560px){.content{padding:16px}.hero{padding:22px 18px}.hero-title{font-size:28px}.kpi-strip{grid-template-columns:1fr 1fr}}
@media(max-width:380px){.kpi-strip{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="chart-tooltip" id="chartTooltip"><div class="ct-header" id="ct-header"></div><div class="ct-divider"></div><div id="ct-rows"></div></div>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<button class="hamburger" id="hamburger" onclick="openSidebar()"><span></span><span></span><span></span></button>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo"><div class="sidebar-logo-title">Mi Portal</div></div>
    <nav class="sidebar-nav">
      <button class="nav-item active" onclick="setTab('mensual',this)"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Mensual</button>
      <button class="nav-item" onclick="setTab('tc',this)"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Tarjeta Crédito</button>
      <button class="nav-item" onclick="setTab('creditos',this)"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>Créditos</button>
      <button class="nav-item" onclick="setTab('mama',this)"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>Mamá</button>
    </nav>
    <div class="sidebar-month"><div class="sidebar-month-label">Período</div><select id="month-select" onchange="onMonthChange()"><option>Cargando…</option></select></div>
    <div class="sidebar-footer">Última actualización<br><span id="sidebar-ts">—</span></div>
  </aside>
  <div class="main"><div class="content" id="page-content"><div class="loading-state"><div class="spinner"></div><div class="loading-text">Conectando con Google Sheets…</div></div></div></div>
</div>
<script>
const SID  = '1nkQ4lsPoGXXzic_GLgkXR9qHlfcEe4j4q6XxheR2U3I';
const BASE = `https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:json`;
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const GASTO_TIPOS = ['ahorro','casa','mamá','mama','transporte','deuda','tarjeta credito'];
const ESTADO_PENDIENTE = new Set(['pendiente','por pagar','pending','activo','no pagado','debe','p']);

let rawData=[], tcData=[], credData=[], mamaData=[], months=[], selMonth='', evoRange=12, charts={};

// ── TOOLTIP ──
const tip = document.getElementById('chartTooltip');
document.addEventListener('mousemove', e => {
  if(tip.style.display!=='block') return;
  const w=tip.offsetWidth, x0=e.clientX+16;
  tip.style.left=(x0+w>window.innerWidth-8?e.clientX-w-16:x0)+'px';
  tip.style.top=(e.clientY-tip.offsetHeight/2)+'px';
},{passive:true});
function showTooltip(header,rows){
  document.getElementById('ct-header').textContent=header;
  document.getElementById('ct-rows').innerHTML=rows.map(r=>`<div class="ct-row"><div class="ct-label"><span class="ct-dot" style="background:${r.color}"></span>${r.label}</div><div class="ct-val">${r.val}</div></div>`).join('');
  tip.style.display='block';
}
function hideTooltip(){tip.style.display='none';}
function makeExternalTooltip(getHeader,getRows){
  return ctx=>{
    if(ctx.tooltip.opacity===0){hideTooltip();return;}
    const i=ctx.tooltip.dataPoints[0].dataIndex;
    showTooltip(getHeader(i),getRows(i));
  };
}

// ── UTILS ──
const parseMonto=v=>{if(v==null)return 0;if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/[$.\s]/g,'').replace(',','.'));return isNaN(n)?0:n;};
function parseMesCell(cell){
  if(!cell)return '';
  const{v,f=''}=cell;
  if(!v&&v!==0)return '';
  const sv=String(v);
  if(sv.startsWith('Date(')){const p=sv.replace('Date(','').replace(')','').split(',').map(Number);const m=MESES[p[1]];return m?`${m}-${p[0]}`:''}
  if(f&&/[a-záéíóúüñ]+-\d{4}/i.test(f))return f.toLowerCase();
  if(/[a-záéíóúüñ]+-\d{4}/i.test(sv))return sv.toLowerCase();
  return sv;
}
const monthKey=m=>{const[mes,año]=String(m).split('-');return parseInt(año||0)*12+Math.max(0,MESES.indexOf(mes?.toLowerCase()));};
function nextMonth(m){const[mes,año]=String(m||'').split('-');const mi=MESES.indexOf((mes||'').toLowerCase());if(mi===-1||!año)return '';return `${MESES[(mi+1)%12]}-${mi===11?parseInt(año)+1:parseInt(año)}`;}
function parseFechaNum(str){if(!str)return 0;if(str.startsWith('Date(')){const p=str.replace('Date(','').replace(')','').split(',').map(Number);return new Date(p[0],p[1],p[2]).getTime();}return new Date(str).getTime()||0;}
const capFirst=s=>s?s[0].toUpperCase()+s.slice(1):'';
function fmtM(n,short=false){const abs=Math.abs(n);if(short){if(abs>=1e6)return`$${(abs/1e6).toFixed(1)}M`;if(abs>=1e3)return`$${Math.round(abs/1e3).toLocaleString('es-CL')}K`;}return`$${Math.round(abs).toLocaleString('es-CL')}`;}
function fmtM2(n){const abs=Math.abs(n);if(abs>=1e6)return`$${(abs/1e6).toFixed(2)}M`;if(abs>=1e3)return`$${(abs/1e3).toFixed(2)}K`;return`$${Math.round(abs).toLocaleString('es-CL')}`;}
function deltaKpi(a,b,inv=false){if(!b)return'<span class="delta-flat">—</span>';const d=a-b;if(Math.abs(d)<1)return'<span class="delta-flat">≈ igual</span>';const good=inv?d<0:d>0;return`<span class="${good?'delta-up':'delta-down'}">${d>0?'↑':'↓'} $${Math.round(Math.abs(d)).toLocaleString('es-CL')} vs ant.</span>`;}
function fmtFecha(str){if(!str)return'—';if(str.startsWith('Date(')){const p=str.replace('Date(','').replace(')','').split(',').map(Number);return new Date(p[0],p[1],p[2]).toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'});}const d=new Date(str);return isNaN(d)?str:d.toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'});}
function fmtMesCorto(mes){if(!mes)return'—';const[m,y]=mes.split('-');const map={enero:'ene',febrero:'feb',marzo:'mar',abril:'abr',mayo:'may',junio:'jun',julio:'jul',agosto:'ago',septiembre:'sep',octubre:'oct',noviembre:'nov',diciembre:'dic'};return`${map[m]||m} ${y}`;}

// ── UI COMPONENTS ──
const UI={
  hero:(ey,ti,acc='',sub='')=>`<div class="hero"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="hero-inner"><div class="hero-eyebrow">${ey}</div><div class="hero-title">${ti}${acc?` <span>${acc}</span>`:''}</div>${sub?`<div class="hero-sub">${sub}</div>`:''}</div></div>`,
  sectionLabel:t=>`<div class="sec-label">${t}</div>`,
  badge:(t,v='navy')=>`<span class="badge badge-${v}">${t}</span>`,
  kpiCard:(l,v,d)=>`<div class="kpi-card"><div class="kpi-label">${l}</div><div class="kpi-val">${v}</div><div class="kpi-delta">${d}</div></div>`,
  card:(ti,hr='',body='',ex='')=>`<div class="card"${ex?` style="${ex}"`:''}><div class="card-header"><div class="card-title">${ti}</div>${hr}</div>${body}</div>`,
  chartLegend:items=>`<div class="chart-legend">${items.map(it=>`<span class="legend-item"><span class="legend-dot" style="background:${it.color}"></span>${it.label}</span>`).join('')}</div>`,
  periodToggle:(active,items)=>`<div class="period-toggle">${items.map(it=>`<button class="period-btn${active===it.val?' active':''}" onclick="${it.fn}">${it.label}</button>`).join('')}</div>`,
};

// ── CHART FACTORIES ──
const SF="'Sofia Sans',sans-serif";
function lineDataset(label,data,color){return{label,data,borderColor:color,borderWidth:2.5,pointRadius:4,pointHoverRadius:7,pointBackgroundColor:color,pointBorderColor:'#fff',pointBorderWidth:2,fill:false,tension:.35};}
function stdLineOptions(tooltipFn,maxTicks=12){return{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{enabled:false,external:tooltipFn}},scales:{x:{grid:{display:false},ticks:{font:{family:SF,size:10},color:'#634dd2',maxTicksLimit:maxTicks,maxRotation:0}},y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{family:SF,size:10},color:'#634dd2',callback:v=>fmtM(v,true)}}}};}
function stdBarOptions(tooltipFn){return{responsive:true,maintainAspectRatio:false,animation:{duration:600,easing:'easeOutQuart'},plugins:{legend:{display:false},tooltip:{enabled:false,external:tooltipFn}},scales:{x:{grid:{display:false},border:{display:false},ticks:{font:{family:SF,size:11,weight:'700'},color:'#9CA3AF',maxRotation:45}},y:{grid:{color:'rgba(27,0,136,.05)',drawTicks:false},border:{display:false},ticks:{font:{family:SF,size:11},color:'#9CA3AF',padding:8,callback:v=>fmtM(v,true)}}}};}
const BAR_LABELS_PLUGIN={id:'barLabels',afterDatasetsDraw(chart){const{ctx,data,scales:{y}}=chart;ctx.save();data.datasets[0].data.forEach((val,i)=>{const bar=chart.getDatasetMeta(0).data[i];const barH=y.getPixelForValue(0)-bar.y;if(barH<22)return;ctx.font=`700 10px ${SF}`;ctx.fillStyle='rgba(0,0,0,.55)';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(fmtM2(val),bar.x,bar.y+6);});ctx.restore();}};

// ── DATA ──
async function fetchSheet(sheet){
  const r=await fetch(`${BASE}&sheet=${encodeURIComponent(sheet)}`);
  if(!r.ok)throw new Error(`HTTP ${r.status} al cargar "${sheet}"`);
  const txt=await r.text();
  return JSON.parse(txt.replace(/^[^{]+/,'').replace(/[^}]+$/,'')).table.rows||[];
}
async function loadData(){
  try{
    const[rowsMensual,rowsTC,rowsCred,rowsMama]=await Promise.all([fetchSheet('mensual'),fetchSheet('Tarjeta Credito'),fetchSheet('Creditos'),fetchSheet('Mama')]);
    rawData=rowsMensual.map(r=>({
      detalle:String(r.c[0]?.v||''),tipo:String(r.c[1]?.v||'').toLowerCase().trim(),
      mes:parseMesCell(r.c[2]),monto:parseMonto(r.c[3]?.v)
    })).filter(r=>r.mes&&r.monto);
    tcData=rowsTC.map(r=>{
      const total=parseMonto(r.c[2]?.v),cuotas=Number(r.c[3]?.v)||0;
      const rawValor=parseMonto(r.c[6]?.v);
      return{movimiento:String(r.c[0]?.v||''),fecha:String(r.c[1]?.v||''),total,cuotas,
        mes:parseMesCell(r.c[5]),valorCuota:rawValor>0?rawValor:(total>0?total/cuotas:0),
        estado:String(r.c[7]?.v||'').toLowerCase().trim()};
    }).filter(r=>r.movimiento&&r.mes);
    // Creditos: Detalle,Fecha,Cuotas,Mes,Cuota Numero,Valor Cuota,Estado
    credData=rowsCred.map(r=>({
      detalle:String(r.c[0]?.v||''),
      fecha:String(r.c[1]?.v||''),
      cuotas:Number(r.c[2]?.v)||0,
      mes:parseMesCell(r.c[3]),
      cuotaNum:Number(r.c[4]?.v)||0,
      valorCuota:parseMonto(r.c[5]?.v),
      estado:String(r.c[6]?.v||'').toLowerCase().trim()
    })).filter(r=>r.detalle&&r.mes);
    // Mama: Fecha(date), Tipo(ingreso/gasto), Detalle, Monto — col A=fecha, B=tipo, C=detalle, D=monto
    mamaData=rowsMama.map(r=>({
      mes:parseMesCell(r.c[0]),
      tipo:String(r.c[1]?.v||'').toLowerCase().trim(),
      detalle:String(r.c[2]?.v||'').trim(),
      monto:parseMonto(r.c[3]?.v)
    })).filter(r=>r.mes&&r.detalle);
    months=[...new Set(rawData.map(r=>r.mes))].sort((a,b)=>monthKey(a)-monthKey(b));
    selMonth=nextMonth(months[months.length-1]);
    document.getElementById('month-select').innerHTML=[...months,selMonth].map(m=>`<option value="${m}"${m===selMonth?' selected':''}>${capFirst(m)}</option>`).join('');
    const now=new Date();
    document.getElementById('sidebar-ts').textContent=now.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'})+' · '+now.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
    renderPage();
  }catch(e){
    document.getElementById('page-content').innerHTML=`<div class="error-box">Error al cargar datos.<br><small style="opacity:.7">${e.message}</small></div>`;
  }
}

function sumsFor(mes){
  const m=months.includes(mes)?mes:months[months.length-1];
  const rows=rawData.filter(r=>r.mes===m);
  const sum=types=>rows.filter(r=>types.includes(r.tipo)).reduce((a,r)=>a+r.monto,0);
  return{ing:sum(['ingreso']),gasto:sum(['ahorro','casa','mamá','mama','transporte','deuda']),
    tc:sum(['tarjeta credito']),
    hip:rows.filter(r=>r.tipo==='deuda'&&r.detalle.toLowerCase().includes('hipotecario')).reduce((a,r)=>a+r.monto,0),
    cons:rows.filter(r=>r.tipo==='deuda'&&r.detalle.toLowerCase().includes('consumo')).reduce((a,r)=>a+r.monto,0)};
}
function gastoRows(mes){const m=months.includes(mes)?mes:months[months.length-1];return rawData.filter(r=>r.mes===m&&GASTO_TIPOS.includes(r.tipo));}

${UI.sectionLabel('Análisis del mes')}

function setEvoRange(n,btn){evoRange=n;document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderEvoChart();}

function renderEvoChart(){
  const slice=evoRange===0?months:months.slice(-evoRange);
  const labels=slice.map(m=>{const[mes,año]=m.split('-');return[mes.slice(0,3).toUpperCase(),año];});
  const labelsFmt=slice.map(m=>{const[mes,año]=m.split('-');return`${mes.slice(0,3).toUpperCase()} ${año}`;});
  const ingresos=slice.map(m=>sumsFor(m).ing);
  const gastos=slice.map(m=>sumsFor(m).gasto);
  const tcs=slice.map(m=>sumsFor(m).tc);
  function varHtml(curr,prev,inv=false){
    if(prev==null||prev===0)return'';const d=curr-prev;if(Math.abs(d)<1)return' <span style="color:rgba(255,255,255,.35);font-size:10px">≈</span>';
    const good=inv?d<0:d>0;const color=good?'#22c55e':'#f87171';
    return` <span style="color:${color};font-size:10px;font-weight:700">${d>0?'↑':'↓'} ${fmtM(Math.abs(d),true)}</span>`;
  }
  const tooltipFn=makeExternalTooltip(i=>labelsFmt[i],i=>{const p=i>0?i-1:null;return[
    {color:'#059669',label:'Ingreso',val:fmtM(ingresos[i])+varHtml(ingresos[i],p!==null?ingresos[p]:null)},
    {color:'#ED1650',label:'Gasto',val:fmtM(gastos[i])+varHtml(gastos[i],p!==null?gastos[p]:null,true)},
    {color:'#f59e0b',label:'TC',val:fmtM(tcs[i])+varHtml(tcs[i],p!==null?tcs[p]:null,true)},
  ];});
  if(charts.evo)charts.evo.destroy();
  charts.evo=new Chart(document.getElementById('chartEvo'),{type:'line',data:{labels,datasets:[lineDataset('Ingreso',ingresos,'#059669'),lineDataset('Gasto',gastos,'#ED1650'),lineDataset('Tarjeta Crédito',tcs,'#f59e0b')]},options:stdLineOptions(tooltipFn,evoRange===0?20:evoRange)});
}

function renderDetalle(prevMes){
  const mesBase=[...months].reverse().find(m=>rawData.some(r=>r.mes===m))||months[months.length-1];
  const rows=rawData.filter(r=>r.mes===mesBase).sort((a,b)=>{const t=a.tipo.localeCompare(b.tipo,'es');return t!==0?t:a.detalle.localeCompare(b.detalle,'es');});
  const prevRows=prevMes?rawData.filter(r=>r.mes===prevMes):[];
  document.getElementById('tbody-detalle').innerHTML=rows.map(row=>{
    const prv=prevRows.find(p=>p.detalle===row.detalle);
    let badge='<span style="color:#9CA3AF;font-size:11px;font-weight:700">—</span>';
    if(prv?.monto>0){const d=row.monto-prv.monto;badge=Math.abs(d)<1?`<span class="badge badge-gray" style="font-size:10px;padding:2px 8px">≈ igual</span>`:`<span class="badge ${d>0?'badge-red':'badge-green'}" style="font-size:10px;padding:2px 8px">${d>0?'↑':'↓'} $${Math.round(Math.abs(d)).toLocaleString('es-CL')}</span>`;}
    const montoHtml=row.monto?fmtM(row.monto):`<span style="color:#9CA3AF;font-size:12px;font-weight:600">—</span>`;
    return`<tr><td style="font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap">${capFirst(row.tipo)}</td><td style="font-size:13px">${row.detalle}</td><td style="text-align:center">${badge}</td><td>${montoHtml}</td></tr>`;
  }).join('')||`<tr><td colspan="4" style="color:#9CA3AF;font-size:12px;padding:20px 0">Sin registros</td></tr>`;
  document.getElementById('tfoot-detalle').innerHTML=`<tr style="border-top:2px solid var(--border)"><td colspan="3" style="padding:8px 12px;font-weight:700;font-size:12px;color:var(--text)">${rows.length} conceptos</td><td style="padding:8px 12px;font-weight:800;font-size:13px;text-align:right">${fmtM(rows.reduce((a,r)=>a+(r.monto||0),0))}</td></tr>`;
}

function renderDist(){
  const rows=gastoRows(selMonth).filter(r=>r.tipo!=='tarjeta credito');
  const ing=sumsFor(selMonth).ing;
  const catDef=[
    {key:'ahorro',label:'Ahorro',color:'#059669',match:r=>r.tipo==='ahorro'},
    {key:'hip',label:'Hipotecario',color:'#1B0088',match:r=>r.tipo==='deuda'&&r.detalle.toLowerCase().includes('hipotecario')},
    {key:'cons',label:'Consumo',color:'#7000AB',match:r=>r.tipo==='deuda'&&r.detalle.toLowerCase().includes('consumo')},
    {key:'casa',label:'Casa',color:'#4257E8',match:r=>r.tipo==='casa'},
    {key:'mama',label:'Mamá',color:'#ED1650',match:r=>r.tipo==='mamá'||r.tipo==='mama'},
    {key:'trans',label:'Transporte',color:'#00b89e',match:r=>r.tipo==='transporte'},
    {key:'deuda',label:'Deuda',color:'#634dd2',match:r=>r.tipo==='deuda'},
    {key:'otros',label:'Otros',color:'#c4c0e0',match:()=>false}
  ];
  const bkt=Object.fromEntries(catDef.map(c=>[c.key,0]));
  rows.forEach(r=>{const cat=catDef.find(c=>c.key!=='otros'&&c.match(r));bkt[cat?cat.key:'otros']+=r.monto;});
  const sorted=catDef.map(c=>({...c,amt:bkt[c.key]})).filter(c=>c.amt>0).sort((a,b)=>b.amt-a.amt);
  const totalGastos=sorted.reduce((a,c)=>a+c.amt,0);
  const disponible=ing-totalGastos;
  const dispColor=disponible>=0?'#16a34a':'#ED1650';
  const dispLabel=disponible>=0?'Disponible':'Déficit';
  const allSegs=[...sorted,{key:'disp',label:dispLabel,color:dispColor,amt:Math.abs(disponible)}];
  const pct=amt=>ing>0?(amt/ing*100):0;
  const maxAmt=Math.max(...allSegs.map(c=>c.amt),1);
  document.getElementById('dist-bar-wrap').innerHTML=`<div class="dist-bar">${allSegs.map(c=>`<div class="dist-seg" style="background:${c.color};flex:${c.amt}" title="${c.label}: ${fmtM(c.amt,true)} (${pct(c.amt).toFixed(1)}% ingreso)"><div class="dist-seg-name">${c.label}</div><div class="dist-seg-val">${pct(c.amt).toFixed(1)}%</div></div>`).join('')}</div>`;
  document.getElementById('dist-bars').innerHTML=[
    ...sorted.map(c=>`<div class="bar-row"><div class="bar-meta"><div class="bar-name"><span style="width:8px;height:8px;border-radius:2px;background:${c.color};display:inline-block;flex-shrink:0"></span>${c.label}</div><div class="bar-right"><span class="bar-pct">${pct(c.amt).toFixed(1)}%</span><span class="bar-amt">${fmtM(c.amt,true)}</span></div></div><div class="bar-track"><div class="bar-fill" style="width:${(c.amt/maxAmt*100).toFixed(1)}%;background:${c.color}"></div></div></div>`),
    `<div class="bar-row" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)"><div class="bar-meta"><div class="bar-name"><span style="width:8px;height:8px;border-radius:2px;background:${dispColor};display:inline-block;flex-shrink:0"></span><strong style="color:${dispColor}">${dispLabel}</strong></div><div class="bar-right"><span class="bar-pct">${pct(Math.abs(disponible)).toFixed(1)}%</span><span class="bar-amt" style="color:${dispColor}">${disponible<0?'-':''}${fmtM(Math.abs(disponible),true)}</span></div></div><div class="bar-track"><div class="bar-fill" style="width:${(Math.abs(disponible)/maxAmt*100).toFixed(1)}%;background:${dispColor}"></div></div></div>`
  ].join('');
}

// ── PAGE: TARJETA CRÉDITO ──
let tcFiltroMes='',tcFiltroMov='';
function renderTC(){
  hideTooltip();
  const pending=tcData.filter(r=>ESTADO_PENDIENTE.has(r.estado));
  const proyMap={};
  pending.forEach(r=>{proyMap[r.mes]=(proyMap[r.mes]||0)+r.valorCuota;});
  const proyMeses=Object.entries(proyMap).sort((a,b)=>monthKey(a[0])-monthKey(b[0]));
  function fechaToMesKey(f){if(!f)return'';let d;if(f.startsWith('Date(')){const p=f.replace('Date(','').replace(')','').split(',').map(Number);d=new Date(p[0],p[1],p[2]);}else d=new Date(f);return isNaN(d)?'':`${MESES[d.getMonth()]}-${d.getFullYear()}`;}
  const movsMap={};
  tcData.forEach(r=>{
    const k=r.movimiento+'|'+r.fecha;
    if(!movsMap[k])movsMap[k]={movimiento:r.movimiento,fecha:r.fecha,total:r.total,cuotas:r.cuotas,valorCuota:r.valorCuota,pagadas:0,pendientesCount:0,pendientesMonto:0,mesFin:'',mesCompra:fechaToMesKey(r.fecha)};
    const m=movsMap[k];
    if(ESTADO_PENDIENTE.has(r.estado)){m.pendientesCount++;m.pendientesMonto+=r.valorCuota;if(!m.mesFin||monthKey(r.mes)>monthKey(m.mesFin))m.mesFin=r.mes;}
  });
  Object.values(movsMap).forEach(m=>{m.pagadas=Math.max(0,m.cuotas-m.pendientesCount);});
  const todosMovsPend=Object.values(movsMap).filter(m=>m.pendientesCount>0).sort((a,b)=>{const d=parseFechaNum(a.fecha)-parseFechaNum(b.fecha);return d!==0?d:a.movimiento.localeCompare(b.movimiento,'es');});
  const deudaTotal=todosMovsPend.reduce((a,m)=>a+m.pendientesMonto,0);
  const mesesCompra=[...new Set(todosMovsPend.map(m=>m.mesCompra).filter(Boolean))].sort((a,b)=>monthKey(a)-monthKey(b));
  const movNombres=[...new Set(todosMovsPend.map(m=>m.movimiento))].sort((a,b)=>a.localeCompare(b,'es'));
  let movsFiltrados=todosMovsPend;
  if(tcFiltroMes)movsFiltrados=movsFiltrados.filter(m=>m.mesCompra===tcFiltroMes);
  if(tcFiltroMov)movsFiltrados=movsFiltrados.filter(m=>m.movimiento===tcFiltroMov);
  const deudaFiltrada=movsFiltrados.reduce((a,m)=>a+m.pendientesMonto,0);

  const tooltipFn=makeExternalTooltip(i=>capFirst(proyMeses[i][0].replace('-',' ')),i=>[{color:'#00b89e',label:'Cuotas',val:`$${Math.round(proyMeses[i][1]).toLocaleString('es-CL')}`}]);
  const selStyle='background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-family:\'Sofia Sans\',sans-serif;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;outline:none';

    <div style="display:flex;flex-direction:column;gap:4px"><label style="font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Mes de compra</label>

    <div style="display:flex;flex-direction:column;gap:4px"><label style="font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Movimiento</label>
    <select onchange="tcFiltroMov=this.value;renderTC()" style="${selStyle};min-width:200px;max-width:320px"><option value="">Todos los movimientos</option>${movNombres.map(n=>`<option value="${n}"${tcFiltroMov===n?' selected':''}>${n} — $${Math.round(todosMovsPend.filter(mv=>mv.movimiento===n).reduce((a,mv)=>a+mv.pendientesMonto,0)).toLocaleString('es-CL')}</option>`).join('')}</select></div>
    ${(tcFiltroMes||tcFiltroMov)?`<div style="display:flex;flex-direction:column;gap:4px"><label style="font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Pendiente filtrado</label><div style="padding:7px 12px;background:rgba(237,22,80,.07);border:1px solid rgba(237,22,80,.2);border-radius:8px;font-size:13px;font-weight:800;color:#ED1650">$${Math.round(deudaFiltrada).toLocaleString('es-CL')}</div></div><button onclick="tcFiltroMes='';tcFiltroMov='';renderTC()" style="${selStyle}">✕ Limpiar</button>`:''}
  </div>`;
  document.getElementById('page-content').innerHTML=`
${UI.hero('Tarjeta Crédito',fmtM(deudaTotal),'pendiente')}
${debugBox}

${UI.card('Movimientos Pendientes',`<div style="font-size:11px;color:var(--muted)">${movsFiltrados.length} movimientos</div>`,`${filtrosHTML}<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:12px">

    <th class="tc-th" style="text-align:center">Cuotas</th><th class="tc-th" style="text-align:center">Mes Fin</th>
  </tr></thead>
  <tbody>${movsFiltrados.map((m,i)=>{
    const pagadoMonto=m.total-m.pendientesMonto;

    const pill=isUltima?`<span style="margin-left:6px;font-size:9px;font-weight:800;background:rgba(0,184,158,.15);color:#007a72;padding:1px 6px;border-radius:6px;vertical-align:middle">ÚLTIMA</span>`:'';

      <td class="tc-td" style="font-weight:600;color:var(--text);max-width:220px">${m.movimiento}${pill}</td>
      <td class="tc-td" style="text-align:center;color:var(--muted);white-space:nowrap">${fmtFecha(m.fecha)}</td>
      <td class="tc-td" style="text-align:right;color:var(--muted)">$${Math.round(m.total).toLocaleString('es-CL')}</td>
      <td class="tc-td" style="text-align:right;color:#059669">$${Math.round(pagadoMonto).toLocaleString('es-CL')}</td>
      <td class="tc-td" style="text-align:right;color:#ED1650;font-weight:700">$${Math.round(m.pendientesMonto).toLocaleString('es-CL')}</td>
      <td class="tc-td" style="text-align:right;color:var(--muted)">$${Math.round(m.valorCuota).toLocaleString('es-CL')}</td>
      <td class="tc-td" style="text-align:center;min-width:80px">
        <div style="font-size:10px;font-weight:700;color:${isUltima?'#007a72':'var(--muted)'};margin-bottom:3px;text-align:center">${m.pagadas}/${m.cuotas}</div>
        <div style="height:4px;background:rgba(27,0,136,.08);border-radius:3px;overflow:hidden"><div style="height:100%;width:${Math.round(m.pagadas/Math.max(m.cuotas,1)*100)}%;background:${isUltima?'#00b89e':'#634dd2'};border-radius:3px;transition:width .6s"></div></div>
      </td>
      <td class="tc-td" style="text-align:center;color:${isUltima?'#007a72':'var(--muted)'};font-weight:${isUltima?700:400};white-space:nowrap">${fmtMesCorto(m.mesFin)}</td>
    </tr>`;
  }).join('')}</tbody>
  <tfoot><tr style="border-top:2px solid var(--border);background:rgba(0,0,0,.02)">
    <td colspan="4" style="padding:10px;font-weight:700;color:var(--text)">Total Pendiente</td>
    <td style="padding:10px 8px;text-align:right;font-weight:800;color:#ED1650;font-size:13px">$${Math.round(deudaFiltrada).toLocaleString('es-CL')}</td>
    <td style="padding:10px 8px;text-align:right;font-weight:800;color:var(--muted);font-size:13px">$${Math.round(movsFiltrados.reduce((a,m)=>a+m.valorCuota,0)).toLocaleString('es-CL')}</td>
    <td colspan="2"></td>
  </tr></tfoot>
</table></div>`)}`;
  requestAnimationFrame(()=>{
    const canvas=document.getElementById('tc-chart');
    if(!canvas)return;
    if(charts.tc){charts.tc.destroy();delete charts.tc;}
    const ctx=canvas.getContext('2d');
    const grad=ctx.createLinearGradient(0,0,0,280);
    grad.addColorStop(0,'#00e5c8');grad.addColorStop(1,'#00b89e');
    charts.tc=new Chart(canvas,{type:'bar',plugins:[BAR_LABELS_PLUGIN],data:{
      labels:proyMeses.map(([mes])=>{const[m,y]=mes.split('-');return[m.slice(0,3).toUpperCase(),y];}),
      datasets:[{label:'Cuotas',data:proyMeses.map(([,v])=>v),backgroundColor:grad,hoverBackgroundColor:'#00e5c8',borderWidth:0,borderRadius:8,borderSkipped:false}]
    },options:stdBarOptions(tooltipFn)});
  });
}

// ── NAV ──
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('active');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('active');}
function setTab(tab,btn){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');closeSidebar();
  if(tab==='tc')renderTC();
  else if(tab==='mensual')renderPage();
  else if(tab==='creditos')renderCreditos();
  else if(tab==='mama')renderMama();
  else{hideTooltip();document.getElementById('page-content').innerHTML=`<div class="loading-state"><div class="loading-text">Próximamente…</div></div>`;}
}

// ── PAGE: MAMÁ ──
function renderMama(){
  hideTooltip();

  if(!mamaData.length){
    document.getElementById('page-content').innerHTML=`<div class="error-box">No se encontraron datos en la pestaña <strong>Mama</strong>.<br><small style="opacity:.7">Verifica que la pestaña exista y tenga columnas: Fecha · Detalle · Monto</small></div>`;
    return;
  }

  // ── Ordenar meses ──
  const mamaMeses=[...new Set(mamaData.map(r=>r.mes))].sort((a,b)=>monthKey(a)-monthKey(b));

  // ── Saldo acumulado por mes ──
  const esIngreso=r=>r.tipo==='ingreso';
  let saldoAcum=0;
  const saldoPorMes=mamaMeses.map(mes=>{
    const rows=mamaData.filter(r=>r.mes===mes);
    const ingresos=rows.filter(esIngreso).reduce((a,r)=>a+r.monto,0);
    const gastos=rows.filter(r=>!esIngreso(r)).reduce((a,r)=>a+r.monto,0);
    saldoAcum+=ingresos-gastos;
    return{mes,ingresos,gastos,neto:ingresos-gastos,saldo:saldoAcum};
  });

  const saldoActual=saldoPorMes[saldoPorMes.length-1]?.saldo||0;
  const totalAportado=mamaData.filter(esIngreso).reduce((a,r)=>a+r.monto,0);
  const totalGastado=mamaData.filter(r=>!esIngreso(r)).reduce((a,r)=>a+r.monto,0);

  // Categorías de gastos
  const catMap={};
  mamaData.filter(r=>!esIngreso(r)).forEach(r=>{
    const key=r.detalle.replace(/\s*\(\d+\/\d+\)/,'').trim();
    catMap[key]=(catMap[key]||0)+r.monto;
  });
  const catSort=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const topGasto=catSort[0]||['—',0];

  // Último mes con datos
  const lastMes=mamaMeses[mamaMeses.length-1]||'';
  const prevMes=mamaMeses.length>1?mamaMeses[mamaMeses.length-2]:null;
  const lastSaldo=saldoPorMes[saldoPorMes.length-1];
  const prevSaldo=prevMes?saldoPorMes[saldoPorMes.length-2]:null;

  // ── Tabla: filas agrupadas por mes (desc) ──
  const mesDescArr=[...mamaMeses].reverse();
  const tablaRows=mesDescArr.map(mes=>{
    const rows=mamaData.filter(r=>r.mes===mes);
    const sp=saldoPorMes.find(s=>s.mes===mes);
    const netColor=sp.neto>=0?'#059669':'#ED1650';
    const rowsHTML=rows.map(r=>{
      const esIng=esIngreso(r);
      const cat=r.detalle.replace(/\s*\(\d+\/\d+\)/,'').trim();
      const colorDot=CAT_COLOR(cat,esIng);
      return`<tr>
        <td style="padding:8px 12px;font-size:12px;color:var(--muted);font-weight:600;padding-left:28px">
          <span style="display:inline-block;width:7px;height:7px;border-radius:2px;background:${colorDot};margin-right:7px;vertical-align:middle"></span>
          ${r.detalle}
        </td>
        <td style="padding:8px 12px;text-align:right;font-size:13px;font-weight:800;color:${esIng?'#059669':'#ED1650'}">${esIng?'+':'-'}${fmtM(r.monto)}</td>
      </tr>`;
    }).join('');
    return`<tbody>
      <tr style="background:rgba(27,0,136,.04);border-top:2px solid var(--border)">
        <td style="padding:9px 12px;font-size:12px;font-weight:800;color:var(--text)">${capFirst(mes)}</td>
        <td style="padding:9px 12px;text-align:right;font-size:12px;font-weight:800;color:${netColor}">${sp.neto>=0?'+':''}${fmtM(sp.neto)}</td>
      </tr>
      ${rowsHTML}
    </tbody>`;
  }).join('');

  // ── Categorías resumen ──
  const COLORS_POOL=['#634dd2','#ED1650','#00b89e','#f59e0b','#1B0088','#7000AB','#4257E8'];
  function CAT_COLOR(name,esIng){
    if(esIng)return'#059669';
    const idx=Math.abs([...name].reduce((a,c)=>a+c.charCodeAt(0),0))%COLORS_POOL.length;
    return COLORS_POOL[idx];
  }
  const maxCat=catSort[0]?catSort[0][1]:1;
  const catBarsHTML=catSort.map(([name,amt])=>{
    const pct=(amt/totalGastado*100).toFixed(1);
    const w=(amt/maxCat*100).toFixed(1);
    const color=CAT_COLOR(name,false);
    return`<div class="bar-row">
      <div class="bar-meta">
        <div class="bar-name"><span style="width:8px;height:8px;border-radius:2px;background:${color};display:inline-block;flex-shrink:0"></span>${name}</div>
        <div class="bar-right"><span class="bar-pct">${pct}%</span><span class="bar-amt">${fmtM(amt,true)}</span></div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
    </div>`;
  }).join('');

  // ── Render HTML ──
  const saldoColor=saldoActual>=0?'#059669':'#ED1650';
  document.getElementById('page-content').innerHTML=`
${UI.hero('Fondo Mamá', fmtM(Math.abs(saldoActual)), saldoActual>=0?'disponible':'déficit', 'Seguimiento de aportes y gastos')}
<div class="kpi-strip" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px">
  ${UI.kpiCard('Saldo Actual',`<span style="color:${saldoColor}">${fmtM(saldoActual)}</span>`,
    prevSaldo?`<span class="${(saldoActual-prevSaldo.saldo)>=0?'delta-up':'delta-down'}">${(saldoActual-prevSaldo.saldo)>=0?'↑':'↓'} ${fmtM(Math.abs(saldoActual-prevSaldo.saldo),true)} vs ant.</span>`:'<span class="delta-flat">—</span>')}
  ${UI.kpiCard('Total Aportado', fmtM(totalAportado), `<span class="delta-flat">${mamaMeses.length} meses</span>`)}
  ${UI.kpiCard('Total Gastado', fmtM(totalGastado), `<span class="delta-flat">${catSort.length} categorías</span>`)}
  ${UI.kpiCard('Mayor Gasto', capFirst(topGasto[0].length>18?topGasto[0].slice(0,18)+'…':topGasto[0]), `<span class="delta-flat">${fmtM(topGasto[1],true)} total</span>`)}
</div>
${UI.sectionLabel('Saldo Acumulado')}
${UI.card('Evolución del saldo mes a mes','',`<div style="position:relative;height:240px"><canvas id="mama-chart"></canvas></div>${UI.chartLegend([{color:'#059669',label:'Saldo positivo'},{color:'#ED1650',label:'Saldo negativo'}])}`,'margin-bottom:24px')}
${UI.sectionLabel('Análisis de Gastos')}
<div class="grid-main" style="margin-bottom:24px">
  ${UI.card('Movimientos por Mes',`<span class="badge badge-navy">${mamaData.length} registros</span>`,
    `<div class="tbl-scroll"><table style="width:100%">
      <thead><tr style="border-bottom:2px solid var(--border)">
        <th style="padding:10px 12px;font-size:11px;font-weight:800;color:var(--accent);text-align:left;position:sticky;top:0;background:var(--card);z-index:1">Detalle</th>
        <th style="padding:10px 12px;font-size:11px;font-weight:800;color:var(--accent);text-align:right;position:sticky;top:0;background:var(--card);z-index:1">Monto</th>
      </tr></thead>
      ${tablaRows}
    </table></div>`)}
  ${UI.card('Distribución por Categoría',`<span class="badge badge-purple">${catSort.length} categorías</span>`,catBarsHTML)}
</div>`;

  // ── Gráfico saldo acumulado ──
  requestAnimationFrame(()=>{
    const canvas=document.getElementById('mama-chart');
    if(!canvas)return;
    if(charts.mama){charts.mama.destroy();delete charts.mama;}
    const labels=saldoPorMes.map(s=>{const[m,y]=s.mes.split('-');return[m.slice(0,3).toUpperCase(),y];});
    const labelsFmt=saldoPorMes.map(s=>{const[m,y]=s.mes.split('-');return`${m.slice(0,3).toUpperCase()} ${y}`;});
    const saldos=saldoPorMes.map(s=>s.saldo);
    const ptColors=saldos.map(v=>v>=0?'#059669':'#ED1650');
    const tooltipFn=makeExternalTooltip(
      i=>labelsFmt[i],
      i=>{
        const s=saldoPorMes[i];
        return[
          {color:s.saldo>=0?'#059669':'#ED1650', label:'Saldo acum.', val:fmtM(s.saldo)},
          {color:'#059669', label:'Ingresos', val:fmtM(s.ingresos)},
          {color:'#ED1650', label:'Gastos', val:fmtM(s.gastos)},
          {color:'#634dd2', label:'Neto mes', val:(s.neto>=0?'+':'')+fmtM(s.neto)},
        ];
      }
    );
    const ctx=canvas.getContext('2d');
    const grad=ctx.createLinearGradient(0,0,0,240);
    grad.addColorStop(0,'rgba(99,77,210,.18)');
    grad.addColorStop(1,'rgba(99,77,210,.01)');
    charts.mama=new Chart(canvas,{
      type:'line',
      data:{
        labels,
        datasets:[{
          data:saldos,
          borderColor:'#634dd2',
          borderWidth:2.5,
          pointRadius:5,
          pointHoverRadius:8,
          pointBackgroundColor:ptColors,
          pointBorderColor:'#fff',
          pointBorderWidth:2,
          fill:true,
          backgroundColor:grad,
          tension:.3
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{display:false},
          tooltip:{enabled:false,external:tooltipFn}
        },
        scales:{
          x:{grid:{display:false},ticks:{font:{family:SF,size:10},color:'#634dd2',maxRotation:0}},
          y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{family:SF,size:10},color:'#634dd2',callback:v=>fmtM(v,true)}}
        }
      }
    });
  });
}

// ── PAGE: CRÉDITOS ──
function renderCreditos(){
  hideTooltip();

  // Helper: parsear fecha raw a "mes-año" legible
  function fmtFechaCredito(str){
    if(!str)return'—';
    if(str.startsWith('Date(')){
      const p=str.replace('Date(','').replace(')','').split(',').map(Number);
      return fmtMesCorto(`${MESES[p[1]]}-${p[0]}`);
    }
    const d=new Date(str);
    if(!isNaN(d))return fmtMesCorto(`${MESES[d.getMonth()]}-${d.getFullYear()}`);
    return str;
  }

  // Helper: fecha a timestamp para ordenar
  function fechaTs(str){
    if(!str)return 0;
    if(str.startsWith('Date(')){const p=str.replace('Date(','').replace(')','').split(',').map(Number);return new Date(p[0],p[1],p[2]).getTime();}
    return new Date(str).getTime()||0;
  }

  // Agrupar filas por detalle
  const creditosMap={};
  credData.forEach(r=>{
    if(!creditosMap[r.detalle])creditosMap[r.detalle]={
      detalle:r.detalle,fecha:r.fecha,cuotas:r.cuotas,
      valorCuota:r.valorCuota,pagadas:0,pendientes:0,mesFin:'',mesFinPagado:''
    };
    const c=creditosMap[r.detalle];
    if(r.estado==='pagado'){
      c.pagadas++;
      if(!c.mesFinPagado||monthKey(r.mes)>monthKey(c.mesFinPagado))c.mesFinPagado=r.mes;
    } else {
      c.pendientes++;
      if(!c.mesFin||monthKey(r.mes)>monthKey(c.mesFin))c.mesFin=r.mes;
    }
    if(r.valorCuota>0)c.valorCuota=r.valorCuota;
  });

  const todos=Object.values(creditosMap).filter(c=>c.cuotas>0)
    .sort((a,b)=>fechaTs(a.fecha)-fechaTs(b.fecha));

  const activos=todos.filter(c=>c.pendientes>0);
  const pagados=todos.filter(c=>c.pendientes===0);

  const totalCuotaMes=activos.reduce((a,c)=>a+c.valorCuota,0);
  const totalPendiente=activos.reduce((a,c)=>a+c.valorCuota*c.pendientes,0);

  const ACCENT='#634dd2';

  function cardHTML(c){
    const esActivo=c.pendientes>0;
    const pct=c.cuotas>0?Math.round(c.pagadas/c.cuotas*100):0;
    const montoTotal=c.valorCuota*c.cuotas;
    const montoPendiente=c.valorCuota*c.pendientes;
    const barGrad=esActivo
      ?`linear-gradient(90deg,${ACCENT},#a855f7)`
      :`linear-gradient(90deg,#059669,#22c55e)`;
    const pctColor=esActivo?ACCENT:'#059669';
    const mesFinal=esActivo?c.mesFin:c.mesFinPagado;
    return`<div class="card" style="position:relative;overflow:hidden">
      <div style="position:absolute;top:0;left:0;right:0;height:3px;background:${pctColor}"></div>
      <div style="margin-bottom:18px">
        <div style="font-size:15px;font-weight:800;color:var(--text);margin-bottom:4px">${c.detalle}</div>
        <div style="font-size:11px;color:var(--muted);font-weight:600">Desde ${fmtFechaCredito(c.fecha)}</div>
      </div>
      <div style="margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Progreso</span>
          <span style="font-size:18px;font-weight:800;color:${pctColor}">${pct}%</span>
        </div>
        <div style="height:10px;background:rgba(99,77,210,.08);border-radius:6px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${barGrad};border-radius:6px;transition:width .8s cubic-bezier(.4,0,.2,1)"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:5px">
          <span style="font-size:10px;font-weight:600;color:var(--muted)">$0</span>
          <span style="font-size:10px;font-weight:600;color:var(--muted)">${fmtM(montoTotal,true)}</span>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
        <div style="background:rgba(99,77,210,.05);border-radius:10px;padding:12px">
          <div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Total cuotas</div>
          <div style="font-size:20px;font-weight:800;color:var(--text)">${c.cuotas}</div>
        </div>
        <div style="background:rgba(99,77,210,.05);border-radius:10px;padding:12px">
          <div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Cuotas pagadas</div>
          <div style="font-size:20px;font-weight:800;color:#059669">${c.pagadas}</div>
        </div>
        <div style="background:rgba(99,77,210,.05);border-radius:10px;padding:12px">
          <div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Cuotas restantes</div>
          <div style="font-size:20px;font-weight:800;color:${esActivo?'#ED1650':'#9CA3AF'}">${c.pendientes}</div>
        </div>
        <div style="background:rgba(99,77,210,.05);border-radius:10px;padding:12px">
          <div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Valor cuota</div>
          <div style="font-size:16px;font-weight:800;color:var(--text)">${fmtM(c.valorCuota,true)}</div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid var(--border)">
        <div>
          <div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px">${esActivo?'Pendiente total':'Total pagado'}</div>
          <div style="font-size:15px;font-weight:800;color:${esActivo?'#ED1650':'#059669'}">${fmtM(esActivo?montoPendiente:montoTotal)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px">${esActivo?'Mes fin':'Terminó'}</div>
          <div style="font-size:15px;font-weight:800;color:${esActivo?ACCENT:'#9CA3AF'}">${mesFinal?fmtMesCorto(mesFinal):'—'}</div>
        </div>
      </div>
    </div>`;
  }

  document.getElementById('page-content').innerHTML=`
${UI.hero('Créditos',fmtM(totalPendiente),'pendiente','Resumen de créditos')}
<div class="kpi-strip" style="grid-template-columns:repeat(2,1fr);margin-bottom:24px">
  ${UI.kpiCard('Cuota mensual total',fmtM(totalCuotaMes),'<span class="delta-flat">créditos activos</span>')}
  ${UI.kpiCard('Créditos activos',activos.length+' de '+todos.length,'<span class="delta-flat">vigentes</span>')}
</div>
${UI.sectionLabel('Detalle Créditos Activos')}
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:var(--gap);margin-bottom:28px">
  ${activos.length?activos.map(cardHTML).join(''):'<div style="color:#9CA3AF;font-size:13px;padding:20px 0">Sin créditos activos</div>'}
</div>
${UI.sectionLabel('Detalle Créditos Pagados')}
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:var(--gap);margin-bottom:24px">
  ${pagados.length?pagados.map(cardHTML).join(''):'<div style="color:#9CA3AF;font-size:13px;padding:20px 0">Sin créditos pagados</div>'}
</div>`;
}
loadData();
</script>
</body>
</html>
