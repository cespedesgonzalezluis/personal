<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance — Luis</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #13161d;
    --surface2: #1a1e28;
    --border: rgba(255,255,255,0.07);
    --text: #e8e4dc;
    --muted: #6b7280;
    --accent: #c9a84c;
    --accent-dim: rgba(201,168,76,0.15);
    --green: #4ade80;
    --green-dim: rgba(74,222,128,0.12);
    --red: #f87171;
    --red-dim: rgba(248,113,113,0.12);
    --blue: #60a5fa;
    --blue-dim: rgba(96,165,250,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── BACKGROUND TEXTURE ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 10% 0%, rgba(201,168,76,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 100%, rgba(96,165,250,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  /* ── HEADER ── */
  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
    line-height: 1;
  }

  .header-left h1 span {
    color: var(--accent);
  }

  .header-left p {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .header-right {
    text-align: right;
  }

  .month-selector {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
  }

  .month-selector select {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    outline: none;
    letter-spacing: 0.05em;
  }

  .month-selector select option { background: #1a1e28; }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── KPI CARDS ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 18px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--stripe-color, var(--accent));
    opacity: 0.6;
  }

  .kpi-card:hover { border-color: rgba(255,255,255,0.14); }

  .kpi-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 10px;
  }

  .kpi-value {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    line-height: 1;
    margin-bottom: 8px;
  }

  .kpi-delta {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .kpi-delta.pos { color: var(--green); }
  .kpi-delta.neg { color: var(--red); }
  .kpi-delta.neu { color: var(--muted); }

  /* ── MAIN GRID ── */
  .main-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    overflow: hidden;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }

  .card-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    background: var(--surface2);
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ── CHART ── */
  .chart-wrap {
    position: relative;
    height: 220px;
    margin-bottom: 16px;
  }

  .chart-legend {
    display: flex;
    gap: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 2px;
  }

  canvas { display: block; }

  /* ── DETAIL TABLE ── */
  .detail-table {
    width: 100%;
    border-collapse: collapse;
  }

  .detail-table th {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 0 0 12px 0;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  .detail-table th:last-child { text-align: right; }

  .detail-table td {
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    font-size: 13px;
    vertical-align: middle;
  }

  .detail-table tr:last-child td { border-bottom: none; }

  .detail-table td:last-child {
    text-align: right;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
  }

  .cat-pill {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .cat-pill.casa { background: rgba(96,165,250,0.15); color: #60a5fa; }
  .cat-pill.auto { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .cat-pill.mama { background: rgba(244,114,182,0.15); color: #f472b6; }
  .cat-pill.cred { background: rgba(167,139,250,0.15); color: #a78bfa; }
  .cat-pill.ahorro { background: rgba(74,222,128,0.15); color: #4ade80; }
  .cat-pill.tc { background: rgba(251,146,60,0.15); color: #fb923c; }

  .delta-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 6px;
  }

  .delta-badge.pos { background: var(--green-dim); color: var(--green); }
  .delta-badge.neg { background: var(--red-dim); color: var(--red); }
  .delta-badge.neu { background: var(--surface2); color: var(--muted); }

  /* ── BOTTOM GRID ── */
  .bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
  }

  /* ── SPENDING BAR ── */
  .spending-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }

  .spending-item:last-child { margin-bottom: 0; }

  .spending-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .spending-name {
    font-size: 13px;
    color: var(--text);
  }

  .spending-amount {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  .bar-track {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.8s ease;
  }

  /* ── AHORRO PROGRESS ── */
  .ahorro-big {
    text-align: center;
    padding: 8px 0 20px;
  }

  .ahorro-pct {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .ahorro-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .ahorro-track {
    height: 8px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
    margin: 16px 0 10px;
  }

  .ahorro-fill {
    height: 100%;
    background: linear-gradient(90deg, #c9a84c, #f0d080);
    border-radius: 4px;
    transition: width 1s ease;
  }

  .ahorro-details {
    display: flex;
    justify-content: space-between;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
  }

  /* ── LOADING STATE ── */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 300px;
    gap: 16px;
  }

  .loading-spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading p {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* ── ERROR ── */
  .error-box {
    background: var(--red-dim);
    border: 1px solid rgba(248,113,113,0.2);
    border-radius: 12px;
    padding: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--red);
    text-align: center;
  }

  /* ── SCROLLABLE TABLE ── */
  .table-scroll {
    max-height: 280px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 800px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .main-grid { grid-template-columns: 1fr; }
    .bottom-grid { grid-template-columns: 1fr; }
    .kpi-value { font-size: 18px; }
    .header-left h1 { font-size: 28px; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <h1>Finance <span>Personal</span></h1>
      <p id="last-updated">Cargando datos…</p>
    </div>
    <div class="header-right">
      <div class="month-selector">
        <div class="status-dot"></div>
        <select id="month-select" onchange="onMonthChange()">
          <option value="">Cargando…</option>
        </select>
      </div>
    </div>
  </header>

  <!-- KPI CARDS -->
  <div class="kpi-grid" id="kpi-grid">
    <div class="loading" style="grid-column:1/-1;height:120px">
      <div class="loading-spinner"></div>
      <p>Conectando con Google Sheets</p>
    </div>
  </div>

  <!-- MAIN: CHART + TABLE -->
  <div class="main-grid">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Flujo mensual</span>
        <span class="card-badge" id="chart-months-label">últimos 12 meses</span>
      </div>
      <div class="chart-wrap">
        <canvas id="flowChart"></canvas>
      </div>
      <div class="chart-legend">
        <span class="legend-item"><span class="legend-dot" style="background:#60a5fa"></span>Ingreso</span>
        <span class="legend-item"><span class="legend-dot" style="background:#f87171"></span>Gasto</span>
        <span class="legend-item"><span class="legend-dot" style="background:#c9a84c"></span>Delta</span>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Detalle del mes</span>
        <span class="card-badge" id="detail-month-label">—</span>
      </div>
      <div class="table-scroll">
        <table class="detail-table" id="detail-table">
          <thead>
            <tr>
              <th>Concepto</th>
              <th>Δ</th>
              <th>Monto</th>
            </tr>
          </thead>
          <tbody id="detail-tbody">
            <tr><td colspan="3" style="color:var(--muted);font-family:'DM Mono',monospace;font-size:11px">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- BOTTOM GRID -->
  <div class="bottom-grid">

    <!-- TOP GASTOS -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Mayores gastos</span>
        <span class="card-badge" id="top-month-label">—</span>
      </div>
      <div id="spending-bars">
        <div class="loading" style="height:180px">
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>

    <!-- AHORRO -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Tasa de ahorro</span>
        <span class="card-badge" id="ahorro-month-label">—</span>
      </div>
      <div class="ahorro-big">
        <div class="ahorro-pct" id="ahorro-pct">—</div>
        <div class="ahorro-label">del ingreso</div>
      </div>
      <div class="ahorro-track">
        <div class="ahorro-fill" id="ahorro-bar" style="width:0%"></div>
      </div>
      <div class="ahorro-details">
        <span>Ahorro: <span id="ahorro-amt">—</span></span>
        <span>Ingreso: <span id="ahorro-base">—</span></span>
      </div>
      <div style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px">
        <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px">Comparativa anual</div>
        <canvas id="ahorroChart" height="80"></canvas>
      </div>
    </div>

    <!-- DISTRIBUCIÓN POR CATEGORÍA -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Distribución</span>
        <span class="card-badge" id="dist-month-label">—</span>
      </div>
      <div id="dist-bars">
        <div class="loading" style="height:180px">
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>

  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════
const SHEET_ID = '1nkQ4lsPoGXXzic_GLgkXR9qHlfcEe4j4q6XxheR2U3I';
const SHEET_NAME = 'mensual';
const API_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let allData = [];
let months = [];
let selectedMonth = '';
let flowChartInst = null;
let ahorroChartInst = null;

// ═══════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════
function parseMonto(str) {
  if (!str) return 0;
  return parseFloat(String(str).replace(/[$.]/g, '').replace(',', '.')) || 0;
}

function fmtCLP(n) {
  if (Math.abs(n) >= 1e6) return `$${(n/1e6).toFixed(1)}M`;
  if (Math.abs(n) >= 1e3) return `$${Math.round(n/1e3).toLocaleString('es-CL')}K`;
  return `$${Math.round(n).toLocaleString('es-CL')}`;
}

function fmtFull(n) {
  return `$${Math.round(Math.abs(n)).toLocaleString('es-CL')}`;
}

function monthOrder(m) {
  const meses = ['enero','febrero','marzo','abril','mayo','junio',
                 'julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const [mes, año] = m.split('-');
  return parseInt(año)*100 + meses.indexOf(mes.toLowerCase());
}

function getCategory(detalle) {
  const d = detalle.toLowerCase();
  if (d.includes('ahorro')) return 'ahorro';
  if (d.includes('casa')) return 'casa';
  if (d.includes('tarjeta credito') || d.includes('tc')) return 'tc';
  if (d.includes('credito') || d.includes('hipotecario') || d.includes('consumo')) return 'cred';
  if (d.includes('mamá') || d.includes('mama')) return 'mama';
  if (d.includes('autopista') || d.includes('seguro') || d.includes('mantención')) return 'auto';
  return '';
}

// ═══════════════════════════════════════════════════════
//  FETCH DATA
// ═══════════════════════════════════════════════════════
async function fetchData() {
  try {
    const r = await fetch(API_URL);
    const text = await r.text();
    const json = JSON.parse(text.replace(/^[^{]+/, '').replace(/[^}]+$/, ''));
    const rows = json.table.rows;

    allData = rows.map(row => ({
      detalle: row.c[0]?.v || '',
      tipo:    (row.c[1]?.v || '').toLowerCase(),
      mes:     row.c[2]?.v || '',
      monto:   parseMonto(row.c[3]?.v)
    })).filter(r => r.mes);

    // months sorted ascending
    months = [...new Set(allData.map(r => r.mes))]
      .sort((a,b) => monthOrder(a) - monthOrder(b));

    // populate selector
    const sel = document.getElementById('month-select');
    sel.innerHTML = months.map(m =>
      `<option value="${m}">${m.charAt(0).toUpperCase()+m.slice(1)}</option>`
    ).join('');
    selectedMonth = months[months.length - 1];
    sel.value = selectedMonth;

    const now = new Date();
    document.getElementById('last-updated').textContent =
      `ACTUALIZADO · ${now.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'})}`;

    render();
  } catch(e) {
    document.getElementById('kpi-grid').innerHTML =
      `<div class="error-box" style="grid-column:1/-1">
        Error al cargar datos. Verifica que el Sheet sea público.<br>
        <small style="opacity:.6">${e.message}</small>
      </div>`;
  }
}

// ═══════════════════════════════════════════════════════
//  MONTH CHANGE
// ═══════════════════════════════════════════════════════
function onMonthChange() {
  selectedMonth = document.getElementById('month-select').value;
  render();
}

// ═══════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════
function render() {
  renderKPIs();
  renderChart();
  renderDetail();
  renderSpending();
  renderAhorro();
  renderDist();
}

// ── KPIs ──────────────────────────────────────────────
function getMonthSums(mes) {
  const rows = allData.filter(r => r.mes === mes);
  const ingreso = rows.filter(r => r.tipo === 'ingreso').reduce((a,r) => a+r.monto, 0);
  const gasto   = rows.filter(r => r.tipo === 'gasto').reduce((a,r) => a+r.monto, 0);
  const tc      = rows.filter(r => r.tipo === 'tc').reduce((a,r) => a+r.monto, 0);
  const ahorro  = rows.filter(r => r.tipo === 'gasto' && r.detalle.toLowerCase().includes('ahorro')).reduce((a,r) => a+r.monto, 0);
  const hipotec = rows.filter(r => r.tipo === 'gasto' && r.detalle.toLowerCase().includes('hipotecario')).reduce((a,r) => a+r.monto, 0);
  const consumo = rows.filter(r => r.tipo === 'gasto' && r.detalle.toLowerCase().includes('consumo')).reduce((a,r) => a+r.monto, 0);
  return { ingreso, gasto, tc, ahorro, hipotec, consumo };
}

function renderKPIs() {
  const cur = getMonthSums(selectedMonth);
  const prevIdx = months.indexOf(selectedMonth) - 1;
  const prev = prevIdx >= 0 ? getMonthSums(months[prevIdx]) : null;

  function delta(cur, prev, key) {
    if (!prev || prev[key] === 0) return null;
    return ((cur[key] - prev[key]) / prev[key]) * 100;
  }

  function deltaHtml(pct, invert = false) {
    if (pct === null) return `<span class="kpi-delta neu">—</span>`;
    const pos = invert ? pct < 0 : pct > 0;
    const cls = pos ? 'pos' : 'neg';
    const arrow = pct > 0 ? '↑' : '↓';
    return `<span class="kpi-delta ${cls}">${arrow} ${Math.abs(pct).toFixed(1)}% vs mes ant.</span>`;
  }

  const gastoTotal = cur.gasto + cur.tc;
  const delta_i = delta(cur, prev, 'ingreso');
  const delta_g = prev ? ((gastoTotal - (prev.gasto + prev.tc)) / (prev.gasto + prev.tc)) * 100 : null;

  const cards = [
    {
      label: 'Ingreso',
      value: fmtFull(cur.ingreso),
      delta: deltaHtml(delta_i),
      stripe: '#60a5fa'
    },
    {
      label: 'Gastos totales',
      value: fmtFull(gastoTotal),
      delta: deltaHtml(delta_g, true),
      stripe: '#f87171'
    },
    {
      label: 'Tarjeta crédito',
      value: fmtFull(cur.tc),
      delta: deltaHtml(prev ? ((cur.tc - prev.tc)/prev.tc)*100 : null, true),
      stripe: '#fb923c'
    },
    {
      label: 'Crédito hipotecario',
      value: fmtFull(cur.hipotec),
      delta: `<span class="kpi-delta neu">cuota fija</span>`,
      stripe: '#a78bfa'
    },
    {
      label: 'Ahorro',
      value: fmtFull(cur.ahorro),
      delta: cur.ingreso > 0
        ? `<span class="kpi-delta pos">${((cur.ahorro/cur.ingreso)*100).toFixed(1)}% del ingreso</span>`
        : `<span class="kpi-delta neu">—</span>`,
      stripe: '#4ade80'
    }
  ];

  document.getElementById('kpi-grid').innerHTML = cards.map(c => `
    <div class="kpi-card" style="--stripe-color:${c.stripe}">
      <div class="kpi-label">${c.label}</div>
      <div class="kpi-value">${c.value}</div>
      ${c.delta}
    </div>
  `).join('');
}

// ── FLOW CHART ────────────────────────────────────────
function renderChart() {
  const last12 = months.slice(-12);
  const labels = last12.map(m => {
    const [mes] = m.split('-');
    return mes.slice(0,3).toUpperCase();
  });
  const ingresos = last12.map(m => getMonthSums(m).ingreso);
  const gastos   = last12.map(m => {
    const s = getMonthSums(m);
    return s.gasto + s.tc;
  });
  const deltas   = ingresos.map((v,i) => v - gastos[i]);

  const canvas = document.getElementById('flowChart');
  const ctx = canvas.getContext('2d');

  // Dynamic canvas size
  const wrap = canvas.parentElement;
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;

  if (flowChartInst) flowChartInst.destroy();

  flowChartInst = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: 'Ingreso',
          data: ingresos,
          backgroundColor: 'rgba(96,165,250,0.5)',
          borderColor: 'rgba(96,165,250,0.8)',
          borderWidth: 1,
          borderRadius: 4,
          order: 2
        },
        {
          label: 'Gasto',
          data: gastos,
          backgroundColor: 'rgba(248,113,113,0.4)',
          borderColor: 'rgba(248,113,113,0.7)',
          borderWidth: 1,
          borderRadius: 4,
          order: 3
        },
        {
          label: 'Delta',
          data: deltas,
          type: 'line',
          borderColor: '#c9a84c',
          backgroundColor: 'rgba(201,168,76,0.1)',
          borderWidth: 2,
          pointBackgroundColor: '#c9a84c',
          pointRadius: 3,
          fill: false,
          tension: 0.4,
          order: 1
        }
      ]
    },
    options: {
      responsive: false,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a1e28',
          borderColor: 'rgba(255,255,255,0.08)',
          borderWidth: 1,
          titleColor: '#e8e4dc',
          bodyColor: '#9ca3af',
          titleFont: { family: 'DM Mono', size: 11 },
          bodyFont: { family: 'DM Mono', size: 11 },
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${fmtCLP(ctx.parsed.y)}`
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(255,255,255,0.03)' },
          ticks: { color: '#6b7280', font: { family: 'DM Mono', size: 10 } }
        },
        y: {
          grid: { color: 'rgba(255,255,255,0.05)' },
          ticks: {
            color: '#6b7280',
            font: { family: 'DM Mono', size: 10 },
            callback: v => fmtCLP(v)
          }
        }
      }
    }
  });
}

// ── DETAIL TABLE ──────────────────────────────────────
function renderDetail() {
  const label = selectedMonth.charAt(0).toUpperCase() + selectedMonth.slice(1);
  document.getElementById('detail-month-label').textContent = label;

  const rows = allData.filter(r => r.mes === selectedMonth && r.tipo === 'gasto');
  const prevIdx = months.indexOf(selectedMonth) - 1;
  const prevRows = prevIdx >= 0
    ? allData.filter(r => r.mes === months[prevIdx] && r.tipo === 'gasto')
    : [];

  // Sort by monto desc
  const sorted = [...rows].sort((a,b) => b.monto - a.monto);

  const tbody = document.getElementById('detail-tbody');
  tbody.innerHTML = sorted.map(row => {
    const cat = getCategory(row.detalle);
    const prev = prevRows.find(p => p.detalle === row.detalle);
    let deltaBadge = '';
    if (prev && prev.monto > 0) {
      const pct = ((row.monto - prev.monto) / prev.monto) * 100;
      const cls = Math.abs(pct) < 2 ? 'neu' : (pct > 0 ? 'neg' : 'pos');
      deltaBadge = `<span class="delta-badge ${cls}">${pct > 0 ? '+' : ''}${pct.toFixed(0)}%</span>`;
    } else {
      deltaBadge = `<span class="delta-badge neu">—</span>`;
    }
    const catPill = cat ? `<span class="cat-pill ${cat}">${cat}</span>` : '';
    return `
      <tr>
        <td>
          <span style="font-size:12px">${row.detalle}</span>${catPill}
        </td>
        <td>${deltaBadge}</td>
        <td style="color:var(--text)">${fmtFull(row.monto)}</td>
      </tr>`;
  }).join('') || `<tr><td colspan="3" style="color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;padding-top:16px">Sin datos de gasto para este mes</td></tr>`;
}

// ── SPENDING BARS ─────────────────────────────────────
function renderSpending() {
  const label = selectedMonth.charAt(0).toUpperCase() + selectedMonth.slice(1);
  document.getElementById('top-month-label').textContent = label;

  const rows = allData.filter(r => r.mes === selectedMonth && r.tipo === 'gasto');
  const sorted = [...rows].sort((a,b) => b.monto - a.monto).slice(0, 8);
  const max = sorted[0]?.monto || 1;

  const colors = ['#60a5fa','#f87171','#c9a84c','#a78bfa','#4ade80','#fb923c','#f472b6','#34d399'];

  document.getElementById('spending-bars').innerHTML = sorted.map((r, i) => `
    <div class="spending-item">
      <div class="spending-row">
        <span class="spending-name">${r.detalle}</span>
        <span class="spending-amount">${fmtFull(r.monto)}</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(r.monto/max*100).toFixed(1)}%;background:${colors[i%colors.length]}"></div>
      </div>
    </div>
  `).join('') || '<div style="color:var(--muted);font-size:12px;font-family:DM Mono">Sin datos</div>';
}

// ── AHORRO ────────────────────────────────────────────
function renderAhorro() {
  const label = selectedMonth.charAt(0).toUpperCase() + selectedMonth.slice(1);
  document.getElementById('ahorro-month-label').textContent = label;

  const sums = getMonthSums(selectedMonth);
  const pct = sums.ingreso > 0 ? (sums.ahorro / sums.ingreso) * 100 : 0;

  document.getElementById('ahorro-pct').textContent = `${pct.toFixed(1)}%`;
  document.getElementById('ahorro-bar').style.width = `${Math.min(pct, 100)}%`;
  document.getElementById('ahorro-amt').textContent = fmtCLP(sums.ahorro);
  document.getElementById('ahorro-base').textContent = fmtCLP(sums.ingreso);

  // Mini chart - ahorro % by month (last 12)
  const last12 = months.slice(-12);
  const ahorroData = last12.map(m => {
    const s = getMonthSums(m);
    return s.ingreso > 0 ? parseFloat(((s.ahorro/s.ingreso)*100).toFixed(1)) : 0;
  });
  const labels = last12.map(m => m.split('-')[0].slice(0,3).toUpperCase());

  const canvas = document.getElementById('ahorroChart');
  const ctx = canvas.getContext('2d');
  if (ahorroChartInst) ahorroChartInst.destroy();

  ahorroChartInst = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: ahorroData,
        borderColor: '#c9a84c',
        backgroundColor: 'rgba(201,168,76,0.08)',
        borderWidth: 1.5,
        pointRadius: 2,
        fill: true,
        tension: 0.4
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: {
        x: { display: false },
        y: {
          display: true,
          grid: { color: 'rgba(255,255,255,0.04)' },
          ticks: { color: '#6b7280', font: { family: 'DM Mono', size: 9 }, callback: v => `${v}%` }
        }
      }
    }
  });
}

// ── DISTRIBUCIÓN ──────────────────────────────────────
function renderDist() {
  const label = selectedMonth.charAt(0).toUpperCase() + selectedMonth.slice(1);
  document.getElementById('dist-month-label').textContent = label;

  const rows = allData.filter(r => r.mes === selectedMonth && r.tipo === 'gasto');
  const total = rows.reduce((a,r) => a+r.monto, 0);

  const cats = {
    'Ahorro': { color: '#4ade80', keys: ['ahorro'] },
    'Hipotecario': { color: '#a78bfa', keys: ['hipotecario'] },
    'Tarjeta TC': { color: '#fb923c', keys: ['tc'] },
    'Casa': { color: '#60a5fa', keys: ['casa'] },
    'Mamá': { color: '#f472b6', keys: ['mama'] },
    'Autopistas': { color: '#fbbf24', keys: ['autopista'] },
    'Seguros': { color: '#34d399', keys: ['seguro'] },
    'Crédito consumo': { color: '#c9a84c', keys: ['consumo'] },
    'Otros': { color: '#6b7280', keys: [] }
  };

  const buckets = {};
  Object.keys(cats).forEach(k => { buckets[k] = 0; });

  rows.forEach(r => {
    const d = r.detalle.toLowerCase();
    let matched = false;
    for (const [cat, {keys}] of Object.entries(cats)) {
      if (cat === 'Otros') continue;
      if (keys.some(k => d.includes(k))) {
        buckets[cat] += r.monto;
        matched = true;
        break;
      }
    }
    if (!matched) buckets['Otros'] += r.monto;
  });

  const sorted = Object.entries(buckets)
    .filter(([,v]) => v > 0)
    .sort(([,a],[,b]) => b - a);

  document.getElementById('dist-bars').innerHTML = sorted.map(([cat, amt]) => {
    const color = cats[cat].color;
    const pct = total > 0 ? (amt/total*100).toFixed(1) : 0;
    return `
      <div class="spending-item">
        <div class="spending-row">
          <span class="spending-name" style="display:flex;align-items:center;gap:7px">
            <span style="width:8px;height:8px;border-radius:2px;background:${color};flex-shrink:0"></span>
            ${cat}
          </span>
          <span class="spending-amount">${pct}%</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%;background:${color}"></div>
        </div>
      </div>`;
  }).join('') || '<div style="color:var(--muted);font-size:12px;font-family:DM Mono">Sin datos</div>';
}

// ═══════════════════════════════════════════════════════
//  CHART.JS CDN
// ═══════════════════════════════════════════════════════
function loadChartJS(cb) {
  if (window.Chart) { cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';
  s.onload = cb;
  document.head.appendChild(s);
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
loadChartJS(fetchData);
</script>
