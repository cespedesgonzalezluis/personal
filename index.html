<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Portal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0eff8;--card:#fff;--border:#e2e0f0;--text:#0F004F;--muted:#6b6a8a;
  --accent:#634dd2;--navy:#1B0088;--green:#059669;--red:#ED1650;--teal:#00b89e;
  --shadow:0 1px 4px rgba(15,0,79,.06),0 4px 16px rgba(15,0,79,.04);
  --shadow-md:0 4px 20px rgba(74,44,168,.12);
  --radius:14px;--gap:16px;--sidebar:220px;--font:'Sofia Sans',sans-serif;
}
html,body{height:100%;font-family:var(--font)}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#c4c0e0;border-radius:999px}
.app{display:flex;flex:1;min-height:100vh}
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-width:0}
.content{padding:24px 28px;flex:1}

/* SIDEBAR */
.sidebar{width:var(--sidebar);background:#0F004F;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200;transition:transform .25s;border-right:1px solid rgba(255,255,255,.06)}
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#00e5c8,#a855f7);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark svg{width:16px;height:16px;stroke:#fff}
.sidebar-logo-title{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.2px;line-height:1.1}
.sidebar-logo-sub{font-size:10px;font-weight:600;color:rgba(255,255,255,.3);margin-top:1px}
.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav-section{font-size:9px;font-weight:800;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:.14em;padding:10px 8px 4px;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:13px;font-weight:700;color:rgba(255,255,255,.5);cursor:pointer;border:none;background:transparent;font-family:var(--font);text-align:left;width:100%;transition:all .15s;position:relative}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8)}
.nav-item.active{background:linear-gradient(135deg,rgba(0,184,158,.2),rgba(0,184,158,.08));color:#00e5c8}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;background:#00e5c8;border-radius:2px}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active .nav-icon{opacity:1}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:10px;font-weight:600;color:rgba(255,255,255,.2);line-height:1.6}
.sidebar-footer span{display:block;color:rgba(255,255,255,.4);font-weight:700;font-size:11px}

/* HAMBURGER */
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:300;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--border);border-radius:9px;cursor:pointer;padding:8px 9px;box-shadow:var(--shadow)}
.hamburger span{display:block;width:18px;height:2px;background:var(--text);border-radius:2px}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,0,79,.45);z-index:150;backdrop-filter:blur(2px)}

/* HERO */
.hero{background:linear-gradient(135deg,#0F004F 0%,#1a0080 50%,#2d1a6e 100%);border-radius:18px;padding:26px 30px 28px;position:relative;overflow:hidden;margin-bottom:20px;box-shadow:0 12px 40px rgba(15,0,79,.18)}
.orb{position:absolute;border-radius:50%;pointer-events:none}
.orb-1{top:-50px;right:-50px;width:240px;height:240px;background:radial-gradient(circle,rgba(168,85,247,.25) 0%,transparent 70%)}
.orb-2{bottom:-30px;left:38%;width:160px;height:160px;background:radial-gradient(circle,rgba(0,229,200,.1) 0%,transparent 70%)}
.hero-inner{position:relative;z-index:1}
.hero-eyebrow{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.16em;margin-bottom:5px}
.hero-title{font-size:30px;font-weight:800;color:#fff;line-height:1.08;letter-spacing:-.4px}
.hero-title span{background:linear-gradient(90deg,#00e5c8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:12px;color:rgba(255,255,255,.3);font-weight:500;margin-top:5px}

/* KPI */
.kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-bottom:20px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.kpi-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.kpi-label{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.kpi-val{font-size:21px;font-weight:800;color:var(--text);line-height:1;margin-bottom:5px}
.kpi-delta{font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px;min-height:16px}
.delta-up{color:var(--green)}.delta-down{color:var(--red)}

/* SECTION / CARD */
.sec-label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:13px;font-weight:800;color:var(--text)}
.mama-grid{display:grid;grid-template-columns:6fr 2.8fr;gap:var(--gap)}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:800;white-space:nowrap}
.badge-navy{background:rgba(27,0,136,.08);color:#1B0088}
.badge-green{background:rgba(5,150,105,.1);color:#065f46}
.badge-red{background:rgba(237,22,80,.08);color:#ED1650}
.badge-teal{background:rgba(0,184,158,.1);color:#007a72}
.badge-gray{background:rgba(156,163,175,.1);color:#6b7280}

/* PERIOD TOGGLE */
.period-toggle{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:2px;gap:2px}
.period-btn{border:none;background:transparent;color:var(--muted);font-family:var(--font);font-size:11px;font-weight:700;padding:4px 12px;border-radius:5px;cursor:pointer;transition:all .15s}
.period-btn.active{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(27,0,136,.25)}

/* FILTER DROPDOWN */
.filter-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.filter-group{display:flex;flex-direction:column;gap:5px;position:relative}
.filter-label{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.filter-trigger{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer;min-width:220px;transition:border-color .15s,box-shadow .15s;user-select:none}
.filter-trigger:hover{border-color:var(--accent)}
.filter-trigger.open{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,77,210,.1)}
.filter-trigger-left{display:flex;flex-direction:column;gap:2px}
.filter-trigger-val{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.filter-trigger-amt{font-size:10px;font-weight:700;color:var(--muted)}
.filter-trigger-val.placeholder{color:var(--muted);font-weight:600}
.filter-chevron{width:16px;height:16px;flex-shrink:0;color:var(--muted);transition:transform .2s}
.filter-trigger.open .filter-chevron{transform:rotate(180deg)}
.filter-dropdown{position:absolute;top:calc(100% + 6px);left:0;z-index:100;background:var(--card);border:1.5px solid var(--border);border-radius:12px;box-shadow:0 8px 32px rgba(15,0,79,.12);min-width:100%;max-height:260px;overflow-y:auto;display:none;scrollbar-width:thin;scrollbar-color:#c4c0e0 transparent}
.filter-dropdown.open{display:block}
.filter-option{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;cursor:pointer;transition:background .1s;border-bottom:1px solid rgba(0,0,0,.04)}
.filter-option:last-child{border-bottom:none}
.filter-option:hover{background:rgba(99,77,210,.04)}
.filter-option.selected{background:rgba(99,77,210,.06)}
.filter-option-name{font-size:12px;font-weight:600;color:var(--text)}
.filter-option-amt{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
.filter-option.selected .filter-option-name{color:var(--accent);font-weight:700}
.filter-option.selected .filter-option-amt{color:var(--accent)}
.filter-option-check{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.filter-option.selected .filter-option-check{background:var(--accent);border-color:var(--accent)}
.filter-option.selected .filter-option-check::after{content:'';width:7px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block}
/* Botón limpiar — fuera del dropdown, al lado del filtro */
.btn-clear{display:inline-flex;align-items:center;gap:5px;padding:9px 12px;border:1.5px solid rgba(237,22,80,.25);background:rgba(237,22,80,.06);border-radius:10px;font-family:var(--font);font-size:11px;font-weight:700;color:var(--red);cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-clear:hover{background:rgba(237,22,80,.12);border-color:rgba(237,22,80,.4)}

/* CAT PILLS */
.cat-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cat-btn{border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font);font-size:11px;font-weight:700;padding:4px 11px;border-radius:6px;cursor:pointer;transition:all .15s}
.cat-btn:hover{border-color:var(--accent);color:var(--accent)}
.cat-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 2px 6px rgba(27,0,136,.25)}
.cat-btn.active[data-cat]:not([data-cat=""]){background:var(--cat-c,var(--navy));border-color:var(--cat-c,var(--navy))}
@media(hover:none){.chart-tooltip{display:none!important}}

/* TABLE */
.tbl-scroll{overflow-y:auto;max-height:340px;scrollbar-width:thin;scrollbar-color:#c4c0e0 transparent}
table{width:100%;border-collapse:separate;border-spacing:0}
thead th{padding:9px 12px;font-size:10px;font-weight:800;color:var(--accent);text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:1;letter-spacing:.04em}
thead th:last-child{text-align:right}
tbody td{padding:9px 12px;font-size:12px;color:var(--text);border-bottom:1px solid rgba(0,0,0,.035);vertical-align:middle}
tbody td:last-child{text-align:right;font-weight:800}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(99,77,210,.02)}
.tc-th{padding:8px;color:var(--muted);font-weight:700;white-space:nowrap;font-size:11px}
.tc-td{padding:9px 8px;font-size:12px}

/* DIST BAR — componente reutilizable */
.dist-bar{display:flex;height:64px;border-radius:10px;overflow:hidden;gap:2px}
.dist-seg{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;padding:0 6px;transition:filter .15s,opacity .2s;overflow:hidden;min-width:0}
.dist-seg:hover{filter:brightness(1.1)}
.dist-seg-name{font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dist-seg-info{font-size:9px;font-weight:700;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-top:1px}

/* LEGEND */
.chart-legend{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.legend-dot{width:12px;height:3px;display:inline-block;border-radius:2px;flex-shrink:0}

/* MISC */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px;gap:12px}
.spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.error-box{background:rgba(237,22,80,.06);border:1px solid rgba(237,22,80,.18);border-radius:12px;padding:20px;text-align:center;font-size:13px;color:var(--red);font-weight:600}
.debug-box{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.25);border-radius:10px;padding:12px 16px;font-size:12px;color:#92400e;font-weight:600;margin-bottom:14px;line-height:1.7}

/* TOOLTIP */
.chart-tooltip{position:fixed;z-index:9999;pointer-events:none;background:#150a40;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;min-width:180px;font-family:var(--font);box-shadow:0 8px 32px rgba(0,0,0,.35);display:none}
.ct-header{font-size:11px;font-weight:800;color:#fff;margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.ct-divider{height:1px;background:rgba(255,255,255,.08);margin-bottom:7px}
.ct-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:4px}
.ct-row:last-child{margin-bottom:0}
.ct-label{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.5)}
.ct-dot{width:6px;height:6px;border-radius:2px;flex-shrink:0}
.ct-val{font-size:12px;font-weight:800;color:#fff}

/* RESUMEN WIDGETS */
.widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-bottom:20px}
.widget-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap);margin-bottom:20px}
.widget-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);margin-bottom:20px}
.widget{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.widget-title{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}
.widget-val{font-size:22px;font-weight:800;color:var(--text);line-height:1.1}
.widget-sub{font-size:11px;font-weight:600;color:var(--muted);margin-top:4px}
.widget-accent{color:var(--accent)}
.widget-green{color:var(--green)}
.widget-red{color:var(--red)}
.widget-teal{color:var(--teal)}
.dist-ahorro-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.dist-ahorro-row:last-child{border-bottom:none}
.dist-ahorro-name{font-weight:700;color:var(--text);flex:1}
.dist-ahorro-bank{font-size:11px;color:var(--muted);font-weight:600;margin-right:12px}
.dist-ahorro-pct{font-size:11px;font-weight:800;color:var(--muted);min-width:36px;text-align:right;margin-right:10px}
.dist-ahorro-monto{font-weight:800;color:var(--text)}
.prog-bar-wrap{margin-top:8px}
.prog-bar-track{height:6px;background:rgba(27,0,136,.07);border-radius:6px;overflow:hidden;margin-top:4px}
.prog-bar-fill{height:100%;border-radius:6px;transition:width .4s}
.prog-label{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--muted);margin-top:4px}
.millas-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:12px}
.tc-resumen-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.tc-resumen-row:last-child{border-bottom:none}
.tc-resumen-label{font-weight:600;color:var(--muted)}
.tc-resumen-val{font-weight:800;color:var(--text)}
@media(max-width:900px){.widget-grid,.widget-grid-4{grid-template-columns:repeat(2,1fr)}.widget-grid-2{grid-template-columns:1fr}}
@media(max-width:560px){.widget-grid,.widget-grid-2,.widget-grid-4{grid-template-columns:1fr}}

  :root{--sidebar:0px}
  .sidebar{transform:translateX(-224px);width:224px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}.hamburger{display:flex}.overlay.active{display:block}
  .kpi-strip{grid-template-columns:repeat(2,1fr)}
  .mama-grid{grid-template-columns:1fr}
  .filter-row{flex-direction:column}
  .filter-trigger{min-width:100%}
}
@media(max-width:560px){.content{padding:14px 16px}.hero{padding:20px 18px}.hero-title{font-size:26px}.kpi-strip{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="chart-tooltip" id="chartTooltip">
  <div class="ct-header" id="ct-header"></div>
  <div class="ct-divider"></div>
  <div id="ct-rows"></div>
</div>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<button class="hamburger" id="hamburger" onclick="openSidebar()"><span></span><span></span><span></span></button>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <div>
        <div class="sidebar-logo-title">Mi Portal</div>
        <div class="sidebar-logo-sub">Finanzas Personales</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">General</div>
      <button class="nav-item" onclick="setTab('resumen',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Resumen
      </button>
      <div class="nav-section">Reportes</div>
      <button class="nav-item active" onclick="setTab('mensual',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Mensual
      </button>
      <button class="nav-item" onclick="setTab('tc',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Tarjeta Crédito
      </button>
      <button class="nav-item" onclick="setTab('creditos',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        Créditos
      </button>
      <button class="nav-item" onclick="setTab('pendientes',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Pendientes
      </button>
      <div class="nav-section">Familia</div>
      <button class="nav-item" onclick="setTab('mama',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        Mamá
      </button>
    </nav>
    <select id="month-select" style="display:none" onchange="onMonthChange()"></select>
    <div class="sidebar-footer">Última actualización<br><span id="sidebar-ts">—</span></div>
  </aside>
  <div class="main">
    <div class="content" id="page-content">
      <div class="loading-state"><div class="spinner"></div><div class="loading-text">Conectando con Google Sheets…</div></div>
    </div>
  </div>
</div>
<script>
// ── CONFIG ──

// ── UTILS ──
const capFirst = s => s ? s[0].toUpperCase()+s.slice(1) : '';
const parseMonto = v => {
  if(v==null) return 0;
  if(typeof v==='number') return v;
  const n=parseFloat(String(v).replace(/[$.\s]/g,'').replace(',','.'));
  return isNaN(n)?0:n;
};
function parseMesCell(cell){
  if(!cell) return '';
  const{v,f=''}=cell;
  if(!v&&v!==0) return '';
  const sv=String(v);
  if(sv.startsWith('Date(')){
    const p=sv.replace('Date(','').replace(')','').split(',').map(Number);
    const m=MESES[p[1]]; return m?`${m}-${p[0]}`:'';}
  if(f&&/[a-záéíóúüñ]+-\d{4}/i.test(f)) return f.toLowerCase();
  if(/[a-záéíóúüñ]+-\d{4}/i.test(sv)) return sv.toLowerCase();
  return sv;
}
function parseMesMama(cell){
  if(!cell) return '';
  const base=parseMesCell(cell); if(base) return base;
  const sv=String(cell.v||'');
  const iso=sv.match(/^(\d{4})-(\d{1,2})-\d{1,2}$/);
  if(iso){const m=MESES[parseInt(iso[2],10)-1];return m?`${m}-${iso[1]}`:'';}
  return '';
}
const monthKey = m => { const[mes,año]=String(m).split('-'); return parseInt(año||0)*12+Math.max(0,MESES.indexOf(mes?.toLowerCase())); };
function parseFechaNum(str){
  if(!str) return 0;
  if(str.startsWith('Date(')){const p=str.replace('Date(','').replace(')','').split(',').map(Number);return new Date(p[0],p[1],p[2]).getTime();}
  return new Date(str).getTime()||0;
}
// fmtM: short=true → 200K / 2,05M | short=false → CLP completo $1.234.567
function fmtM(n, short=false){
  const abs=Math.abs(n);
  if(short){
    if(abs>=1e6) return `$${(abs/1e6).toFixed(2).replace('.',',')}M`;
    if(abs>=1e3) return `$${Math.round(abs/1e3).toLocaleString('es-CL')}K`;
  }
  return `$${Math.round(abs).toLocaleString('es-CL')}`;
}
function fmtNum(n){ return Math.round(Math.abs(n)).toLocaleString('es-CL'); }
function deltaKpi(a,b,inv=false){
  if(!b) return '';
  const d=a-b; if(Math.abs(d)<1) return '';
  const good=inv?d<0:d>0;
  return `<span class="${good?'delta-up':'delta-down'}">${d>0?'↑':'↓'} $${Math.round(Math.abs(d)).toLocaleString('es-CL')}</span>`;
}
function fmtFecha(str){
  if(!str) return '—';
  if(str.startsWith('Date(')){const p=str.replace('Date(','').replace(')','').split(',').map(Number);return new Date(p[0],p[1],p[2]).toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'});}
  const d=new Date(str); return isNaN(d)?str:d.toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'});
}
const fmtMesLabel = mes => { if(!mes) return '—'; const[m,y]=mes.split('-'); return `${capFirst(m)} ${y}`; };
function fmtMesCorto(mes){
  if(!mes) return '—';
  const[m,y]=mes.split('-');
  const map={enero:'ene',febrero:'feb',marzo:'mar',abril:'abr',mayo:'may',junio:'jun',julio:'jul',agosto:'ago',septiembre:'sep',octubre:'oct',noviembre:'nov',diciembre:'dic'};
  return `${map[m]||m} ${y}`;
}
function getTypeColor(tipo, pool){
  if(!pool._i) pool._i=0;
  if(!pool[tipo]) pool[tipo]=COLOR_MAP[tipo]||COLOR_POOL[pool._i++%COLOR_POOL.length];
  return pool[tipo];
}

  pillUltima: () => `<span style="margin-left:5px;font-size:9px;font-weight:800;background:rgba(0,184,158,.12);color:#007a72;padding:1px 5px;border-radius:5px;vertical-align:middle">ÚLTIMA</span>`,

// Plugin etiquetas sobre barras — formato corto (200K / 2,05M)
function makeBarLabelPlugin(id){
  return{id,afterDatasetsDraw(chart){
    const{ctx,data}=chart; ctx.save();
    data.datasets[0].data.forEach((val,i)=>{
      if(!val) return;
      const bar=chart.getDatasetMeta(0).data[i];
      ctx.font=`700 10px ${SF}`;
      ctx.fillStyle='rgba(0,0,0,.55)';
      ctx.textAlign='center';
      ctx.textBaseline='bottom';
      ctx.fillText(fmtM(val,true), bar.x, bar.y-3); // SHORT = true → 200K / 2,05M
    });
    ctx.restore();
  }};
}
const BAR_LABELS = makeBarLabelPlugin('barLabels');

// Plugin etiquetas dentro de barras Mamá (stacked)
const MAMA_BAR_LABELS = {id:'mamaBarLabels',afterDatasetsDraw(chart){
  const{ctx,scales:{y}}=chart; ctx.save();
  chart.data.datasets.forEach((ds,di)=>{
    if(ds.type==='line') return;
    const meta=chart.getDatasetMeta(di);
    ds.data.forEach((val,i)=>{
      if(!val) return;
      const bar=meta.data[i];
      const barH=Math.abs(y.getPixelForValue(0)-bar.y);
      if(barH<18) return;
      ctx.font=`700 9px ${SF}`;
      ctx.fillStyle='rgba(255,255,255,.9)';
      ctx.textAlign='center';ctx.textBaseline='middle';
      const midY=val>0?(bar.y+(y.getPixelForValue(0)-bar.y)/2):(bar.y-(bar.y-y.getPixelForValue(0))/2);
      ctx.fillText(fmtM(Math.abs(val),true), bar.x, midY); // SHORT = true
    });
  });
  ctx.restore();
}};

// ── DROPDOWN ──
function closeAllDropdowns(){
  document.querySelectorAll('.filter-dropdown.open').forEach(d=>{
    d.classList.remove('open');d.previousElementSibling?.classList.remove('open');
  });
}
function toggleDropdown(id){
  const dd=document.getElementById(id),trigger=dd.previousElementSibling;
  const wasOpen=dd.classList.contains('open');
  closeAllDropdowns();
  if(!wasOpen){dd.classList.add('open');trigger.classList.add('open');}
}
function buildDropdown(id,options,currentVal,placeholder,onSelect){
  const selected=options.find(o=>o.value===currentVal);
  const triggerContent=selected
    ?`<div class="filter-trigger-left"><div class="filter-trigger-val">${selected.label}</div><div class="filter-trigger-amt">${selected.amt}</div></div>`
    :`<div class="filter-trigger-left"><div class="filter-trigger-val placeholder">${placeholder}</div></div>`;
  const chevron=`<svg class="filter-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;
  const opts=options.map(o=>`
    <div class="filter-option${o.value===currentVal?' selected':''}" onclick="event.stopPropagation();closeAllDropdowns();(${onSelect})(${JSON.stringify(o.value)})">
      <div class="filter-option-name">${o.label}</div>
      <div style="display:flex;align-items:center;gap:8px"><div class="filter-option-amt">${o.amt}</div><div class="filter-option-check"></div></div>
    </div>`).join('');
  return `<div class="filter-trigger" onclick="event.stopPropagation();toggleDropdown('${id}')">${triggerContent}${chevron}</div>
    <div class="filter-dropdown" id="${id}">${opts}</div>`;
}

// ── DATA FETCH ──
async function fetchSheet(sheet){
  const r=await fetch(`${BASE}&sheet=${encodeURIComponent(sheet)}`);
  if(!r.ok) throw new Error(`HTTP ${r.status} al cargar "${sheet}"`);
  const txt=await r.text();
  return JSON.parse(txt.replace(/^[^{]+/,'').replace(/[^}]+$/,'')).table.rows||[];
}
async function loadData(){
  try{
    const[rowsMensual,rowsTC,rowsCred,rowsMama,rowsOtros,rowsPend]=await Promise.all([
      fetchSheet('mensual'),fetchSheet('Tarjeta Credito'),fetchSheet('Creditos'),
      fetchSheet('Mama'),fetchSheet('Otros'),fetchSheet('Pendientes')
    ]);
    rawData=rowsMensual.map(r=>({
      detalle:String(r.c[0]?.v||''),tipo:String(r.c[1]?.v||'').toLowerCase().trim(),
      mes:parseMesCell(r.c[2]),monto:parseMonto(r.c[3]?.v)
    })).filter(r=>r.mes&&r.monto);

    tcData=rowsTC.map(r=>{
      const total=parseMonto(r.c[2]?.v),cuotas=Number(r.c[3]?.v)||0;
      const rawValor=parseMonto(r.c[6]?.v);
      return{movimiento:String(r.c[0]?.v||''),fecha:String(r.c[1]?.v||''),total,cuotas,
        mes:parseMesCell(r.c[5]),valorCuota:rawValor>0?rawValor:(total>0?total/cuotas:0),
        estado:String(r.c[7]?.v||'').toLowerCase().trim()};
    }).filter(r=>r.movimiento&&r.mes);

    credData=rowsCred.map(r=>({
      detalle:String(r.c[0]?.v||''),fecha:String(r.c[1]?.v||''),cuotas:Number(r.c[2]?.v)||0,
      mes:parseMesCell(r.c[3]),cuotaNum:Number(r.c[4]?.v)||0,
      valorCuota:parseMonto(r.c[5]?.v),estado:String(r.c[6]?.v||'').toLowerCase().trim()
    })).filter(r=>r.detalle&&r.mes);

    mamaData=rowsMama.map(r=>({
      mes:parseMesMama(r.c[0]),tipo:String(r.c[1]?.v||'').toLowerCase().trim(),
      detalle:String(r.c[2]?.v||'').trim(),monto:parseMonto(r.c[3]?.v)
    })).filter(r=>r.mes&&r.detalle);

    pendientesData=rowsPend.map(r=>({
      responsable:String(r.c[0]?.v||'').trim(),detalle:String(r.c[1]?.v||'').trim(),
      fecha:String(r.c[2]?.v||''),total:parseMonto(r.c[3]?.v),cuotas:Number(r.c[4]?.v)||0,
      cuotaNum:Number(r.c[5]?.v)||0,mes:parseMesCell(r.c[6]),monto:parseMonto(r.c[7]?.v),
      estado:String(r.c[8]?.v||'').toLowerCase().trim()
    })).filter(r=>r.responsable&&r.mes);

    // Hoja Otros: parseo completo para Resumen + campos existentes
    if(rowsOtros.length){
      const od={};
      rowsOtros.forEach(row=>{
        const cells=row.c||[];
        for(let ci=0;ci<cells.length;ci++){
          const cell=cells[ci]; if(!cell||cell.v==null) continue;
          const v=String(cell.v).trim();
          const nx=cells[ci+1];
          const nxv=nx?.v!=null?nx.v:null;
          // key→valor: buscamos todos los pares clave:siguiente_celda
          const kn=v.toLowerCase().replace(/\s+/g,' ');
          if(nxv!=null) od[kn]=nxv;
          // aliases específicos
          if(/ahorro\s*cr[eé]dito/i.test(v)){ahorroCredito=parseMonto(nxv)||0; od['ahorro credito']=nxv;}
          if(/^inicio$/i.test(v)){
            const sv=String(nxv||'');let d;
            if(sv.startsWith('Date(')){const p=sv.replace('Date(','').replace(')','').split(',').map(Number);d=new Date(p[0],p[1],p[2]);}
            else d=new Date(sv);
            inicioAhorro=isNaN(d)?sv:d.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});
            od['inicio']=inicioAhorro;
          }
        }
      });
      // Guardar distribución de ahorro (filas con banco y %)
      const distAhorro=[];
      rowsOtros.forEach(row=>{
        const cells=row.c||[];
        // buscamos patrón: col[D]=Tipo, col[E]=Banco, col[F]=%, col[G]=Monto
        const tipo=String(cells[3]?.v||'').trim();
        const banco=String(cells[4]?.v||'').trim();
        const pct=cells[5]?.v!=null?Number(String(cells[5].v).replace('%',''))||0:0;
        const monto=parseMonto(cells[6]?.v);
        if(tipo&&banco&&(pct||monto)) distAhorro.push({tipo,banco,pct,monto});
      });
      od['_distAhorro']=distAhorro;
      // Liquidez / IPC
      rowsOtros.forEach(row=>{
        const cells=row.c||[];
        const a=String(cells[0]?.v||'').trim();
        const b=cells[1]?.v!=null?cells[1].v:null;
        if(a&&b!=null){
          const kn=a.toLowerCase().replace(/\s+/g,' ');
          od[kn]=b;
        }
      });
      otrosData=od;
    }

    months=[...new Set(rawData.map(r=>r.mes))].sort((a,b)=>monthKey(a)-monthKey(b));
    selMonth=months[months.length-1];
    document.getElementById('month-select').innerHTML=months.map(m=>`<option value="${m}"${m===selMonth?' selected':''}>${fmtMesLabel(m)}</option>`).join('');
    const now=new Date();
    document.getElementById('sidebar-ts').textContent=now.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'})+' · '+now.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
    renderPage();
  }catch(e){
    document.getElementById('page-content').innerHTML=`<div class="error-box">Error al cargar datos.<br><small style="opacity:.7">${e.message}</small></div>`;
  }
}

// ── DATA HELPERS ──
function sumsFor(mes){
  const m=months.includes(mes)?mes:months[months.length-1];
  const rows=rawData.filter(r=>r.mes===m);
  const sum=types=>rows.filter(r=>types.includes(r.tipo)).reduce((a,r)=>a+r.monto,0);
  const gasto=rows.filter(r=>r.tipo!=='ingreso'&&r.tipo!=='tarjeta credito').reduce((a,r)=>a+r.monto,0);
  return{ing:sum(['ingreso']),gasto,tc:sum(['tarjeta credito'])};
}
function getCatAmounts(mes){
  const m=months.includes(mes)?mes:months[months.length-1];
  const rows=rawData.filter(r=>r.mes===m&&r.tipo!=='ingreso'&&r.tipo!=='tarjeta credito');
  const bkt=Object.fromEntries(CAT_DEF.map(c=>[c.key,0]));
  rows.forEach(r=>{const cat=CAT_DEF.find(c=>c.key!=='otros'&&c.match(r));bkt[cat?cat.key:'otros']+=r.monto;});
  return bkt;
}
// Construir segmentos de distribución dinámica (por tipo del mes)
function buildDistSegs(mes){
  const m=months.includes(mes)?mes:months[months.length-1];
  const rows=rawData.filter(r=>r.mes===m&&r.tipo!=='ingreso'&&r.tipo!=='tarjeta credito');
  const pool={};
  const tipoMap={};
  rows.forEach(r=>{
    const t=r.tipo;
    if(!tipoMap[t]) tipoMap[t]={label:capFirst(t),color:getTypeColor(t,pool),amt:0};
    tipoMap[t].amt+=r.monto;
  });
  return Object.values(tipoMap).filter(s=>s.amt>0).sort((a,b)=>b.amt-a.amt);
}

function renderEvoChart(){
  const slice=evoRange===0?months:months.slice(-evoRange);
  const labels=slice.map(m=>{const[mes,año]=m.split('-');return[mes.slice(0,3).toUpperCase(),año];});
  const labelsFmt=slice.map(m=>fmtMesLabel(m));
  const ingresos=slice.map(m=>sumsFor(m).ing);
  const gastos=slice.map(m=>sumsFor(m).gasto);
  const tcs=slice.map(m=>sumsFor(m).tc);
  const tooltipFn=makeExternalTooltip(i=>labelsFmt[i],i=>[
    {color:'#059669',label:'Ingreso',val:fmtM(ingresos[i])},
    {color:'#ED1650',label:'Gasto',val:fmtM(gastos[i])},
    {color:'#f59e0b',label:'TC',val:fmtM(tcs[i])},
  ]);
  if(charts.evo) charts.evo.destroy();
  charts.evo=new Chart(document.getElementById('chartEvo'),{type:'line',
    data:{labels,datasets:[lineDataset('Ingreso',ingresos,'#059669'),lineDataset('Gasto',gastos,'#ED1650'),lineDataset('TC',tcs,'#f59e0b',[6,4])]},
    options:stdLineOptions(tooltipFn,evoRange===0?20:evoRange)});
}

function setDistCat(key){
  distCatFilter=key;
  document.querySelectorAll('#dist-cat-pills .cat-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`#dist-cat-pills .cat-btn[data-cat="${key}"]`)?.classList.add('active');
  renderDistEvo();
}
function renderDistEvo(){
  const slice=evoRange===0?months:months.slice(-evoRange);
  const labels=slice.map(m=>{const[mes,año]=m.split('-');return[mes.slice(0,3).toUpperCase(),año];});
  const labelsFmt=slice.map(m=>fmtMesLabel(m));
  const allCats=CAT_DEF.filter(c=>c.key!=='otros');
  const catsToShow=distCatFilter?allCats.filter(c=>c.key===distCatFilter):allCats;
  const pctData=catsToShow.map(cat=>({...cat,
    pcts:slice.map(m=>{const ing=sumsFor(m).ing;return!ing?0:Math.round(getCatAmounts(m)[cat.key]/ing*1000)/10;}),
    amts:slice.map(m=>getCatAmounts(m)[cat.key]||0)
  }));
  const tooltipFn=makeExternalTooltip(i=>labelsFmt[i],i=>pctData.filter(c=>c.pcts[i]>0).map(c=>({color:c.color,label:c.label,val:`${c.pcts[i].toFixed(1)}%  ${fmtM(c.amts[i])}`})));
  const yScale=distCatFilter
    ?{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{family:SF,size:10},color:'#9CA3AF',callback:v=>`${v}%`}}
    :{stacked:true,grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{family:SF,size:10},color:'#9CA3AF',callback:v=>`${v}%`},min:0,max:100};
  if(charts.dist) charts.dist.destroy();
  charts.dist=new Chart(document.getElementById('chartDist'),{type:'line',
    data:{labels,datasets:pctData.map(cat=>({label:cat.label,data:cat.pcts,borderColor:cat.color,backgroundColor:cat.color+'33',borderWidth:2,pointRadius:2.5,pointHoverRadius:5,pointBackgroundColor:cat.color,pointBorderColor:'#fff',pointBorderWidth:1.5,fill:true,tension:.4,...(distCatFilter?{}:{stack:'area'})}))},
    options:{responsive:true,maintainAspectRatio:false,events:['mousemove','mouseout','click'],interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{enabled:false,external:tooltipFn}},scales:{x:{grid:{display:false},ticks:{font:{family:SF,size:10},color:'#9CA3AF',maxTicksLimit:evoRange===0?20:evoRange,maxRotation:0}},y:yScale}}});
}

function renderDetalle(prevMes){
  const rows=rawData.filter(r=>r.mes===selMonth).sort((a,b)=>{const t=a.tipo.localeCompare(b.tipo,'es');return t!==0?t:a.detalle.localeCompare(b.detalle,'es');});
  const prevRows=prevMes?rawData.filter(r=>r.mes===prevMes):[];
  document.getElementById('tbody-detalle').innerHTML=rows.map(row=>{
    const prv=prevRows.find(p=>p.detalle===row.detalle);
    let badge='<span style="color:#9CA3AF;font-size:11px;font-weight:700">—</span>';
    if(prv?.monto>0){
      const d=row.monto-prv.monto;
      if(Math.abs(d)<1) badge=`<span class="badge badge-gray" style="font-size:10px;padding:2px 7px">≈ igual</span>`;
      else{const good=row.tipo==='ingreso'?d>0:d<0;badge=`<span class="badge ${good?'badge-green':'badge-red'}" style="font-size:10px;padding:2px 7px">${d>0?'↑':'↓'} $${Math.round(Math.abs(d)).toLocaleString('es-CL')}</span>`;}
    }
    return`<tr><td style="font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap">${capFirst(row.tipo)}</td><td style="font-size:12px">${row.detalle}</td><td style="text-align:center">${badge}</td><td>${fmtM(row.monto)}</td></tr>`;
  }).join('')||`<tr><td colspan="4" style="color:#9CA3AF;font-size:12px;padding:20px 0">Sin registros</td></tr>`;
}

function renderDist(){
  const segs=buildDistSegs(selMonth);
  const ing=sumsFor(selMonth).ing;
  const totalGasto=segs.reduce((a,s)=>a+s.amt,0);
  const disponible=ing-totalGasto;
  const dispColor=disponible>=0?'#16a34a':'#ED1650';
  const allSegs=[...segs,{label:disponible>=0?'Disponible':'Déficit',color:dispColor,amt:Math.abs(disponible)}];
  const total=allSegs.reduce((a,s)=>a+s.amt,0);
  document.getElementById('dist-bar-wrap').innerHTML=UI.distBar(allSegs, total);
}

// ── PÁGINA: TARJETA CRÉDITO ──
function renderTC(){
  hideTooltip();
  const pending=tcData.filter(r=>ESTADO_PENDIENTE.has(r.estado));
  function fechaToMesKey(f){
    if(!f) return '';
    let d=f.startsWith('Date(')?new Date(...f.replace('Date(','').replace(')','').split(',').map(Number)):new Date(f);
    return isNaN(d)?'':`${MESES[d.getMonth()]}-${d.getFullYear()}`;
  }
  // Construir movsMap
  const movsMap={};
  tcData.forEach(r=>{
    const k=r.movimiento+'|'+r.fecha;
    if(!movsMap[k]) movsMap[k]={movimiento:r.movimiento,fecha:r.fecha,total:r.total,cuotas:r.cuotas,valorCuota:r.valorCuota,pendientesCount:0,pendientesMonto:0,mesFin:'',mesCompra:fechaToMesKey(r.fecha)};
    const m=movsMap[k];
    if(ESTADO_PENDIENTE.has(r.estado)){m.pendientesCount++;m.pendientesMonto+=r.valorCuota;if(!m.mesFin||monthKey(r.mes)>monthKey(m.mesFin))m.mesFin=r.mes;}
  });
  Object.values(movsMap).forEach(m=>{m.pagadas=Math.max(0,m.cuotas-m.pendientesCount);});
  const todosMovsPend=Object.values(movsMap).filter(m=>m.pendientesCount>0)
    .sort((a,b)=>{const d=parseFechaNum(a.fecha)-parseFechaNum(b.fecha);return d!==0?d:a.movimiento.localeCompare(b.movimiento,'es');});
  const deudaTotal=todosMovsPend.reduce((a,m)=>a+m.pendientesMonto,0);
  const mesesCompra=[...new Set(todosMovsPend.map(m=>m.mesCompra).filter(Boolean))].sort((a,b)=>monthKey(a)-monthKey(b));
  const movNombres=[...new Set(todosMovsPend.map(m=>m.movimiento))].sort((a,b)=>a.localeCompare(b,'es'));

  // Filtrar
  let movsFiltrados=todosMovsPend;
  if(tcFiltroMes) movsFiltrados=movsFiltrados.filter(m=>m.mesCompra===tcFiltroMes);
  if(tcFiltroMov) movsFiltrados=movsFiltrados.filter(m=>m.movimiento===tcFiltroMov);
  const deudaFiltrada=movsFiltrados.reduce((a,m)=>a+m.pendientesMonto,0);
  const filteredKeys=new Set(movsFiltrados.map(m=>m.movimiento+'|'+m.fecha));

  // Proyección
  const proyMap={};
  tcData.filter(r=>ESTADO_PENDIENTE.has(r.estado)&&filteredKeys.has(r.movimiento+'|'+r.fecha))
    .forEach(r=>{proyMap[r.mes]=(proyMap[r.mes]||0)+r.valorCuota;});
  const proyMeses=Object.entries(proyMap).sort((a,b)=>monthKey(a[0])-monthKey(b[0]));

  // Debug
  const estadosUnicos=[...new Set(tcData.map(r=>r.estado||'(vacío)'))];
  const debugBox=tcData.length===0
    ?`<div class="debug-box">⚠ No se cargaron filas de <code>Tarjeta Credito</code>.</div>`
    :pending.length===0?`<div class="debug-box">⚠ ${tcData.length} filas cargadas pero ninguna pendiente.<br>Estados: ${estadosUnicos.map(e=>`<code>${e}</code>`).join(' · ')}</div>`:'';

  // Tooltip CLP completo
  const tooltipFn=makeExternalTooltip(i=>fmtMesLabel(proyMeses[i][0]),i=>[{color:'#00b89e',label:'Cuotas',val:fmtM(proyMeses[i][1])}]);

  // Filtros + botón limpiar separado
  const opsMeses=mesesCompra.map(m=>({value:m,label:fmtMesLabel(m),amt:fmtM(todosMovsPend.filter(mv=>mv.mesCompra===m).reduce((a,mv)=>a+mv.pendientesMonto,0))}));
  const opsMov=movNombres.map(n=>({value:n,label:n,amt:fmtM(todosMovsPend.filter(mv=>mv.movimiento===n).reduce((a,mv)=>a+mv.pendientesMonto,0))}));
  const hasFiltro=tcFiltroMes||tcFiltroMov;

  const filtrosHTML=`
    <div class="filter-row">
      <div class="filter-group">
        <div class="filter-label">Mes de compra</div>
        ${buildDropdown('dd-mes',opsMeses,tcFiltroMes,'Todos los meses',`v=>{tcFiltroMes=v;renderTC()}`)}
      </div>
      <div class="filter-group">
        <div class="filter-label">Movimiento</div>
        ${buildDropdown('dd-mov',opsMov,tcFiltroMov,'Todos los movimientos',`v=>{tcFiltroMov=v;renderTC()}`)}
      </div>
      ${hasFiltro?btnClear(`()=>{tcFiltroMes='';tcFiltroMov='';renderTC()}`):''}
      ${hasFiltro?`<div style="display:flex;flex-direction:column;gap:5px">
        <div class="filter-label">Pendiente filtrado</div>
        <div style="padding:9px 14px;background:rgba(237,22,80,.07);border:1.5px solid rgba(237,22,80,.2);border-radius:10px;font-size:13px;font-weight:800;color:#ED1650">${fmtM(deudaFiltrada)}</div>
      </div>`:''}
    </div>`;

  // Tabla movimientos
  const tbodyRows=movsFiltrados.map((m,i)=>{
    const pagadoMonto=m.total-m.pendientesMonto;
    const isUlt=m.pendientesCount===1;
    const bg=i%2===0?'transparent':'rgba(0,0,0,.012)';
    return`<tr style="border-bottom:1px solid var(--border);background:${bg}">
      <td class="tc-td" style="font-weight:600;color:var(--text);max-width:220px">${m.movimiento}${isUlt?UI.pillUltima():''}</td>
      <td class="tc-td" style="text-align:center;color:var(--muted);white-space:nowrap">${fmtFecha(m.fecha)}</td>
      <td class="tc-td" style="text-align:right;color:var(--muted)">${fmtM(m.total)}</td>
      <td class="tc-td" style="text-align:right;color:#059669">${fmtM(pagadoMonto)}</td>
      <td class="tc-td" style="text-align:right;color:#ED1650;font-weight:700">${fmtM(m.pendientesMonto)}</td>
      <td class="tc-td" style="text-align:right;color:var(--muted)">${fmtM(m.valorCuota)}</td>
      <td class="tc-td" style="text-align:center;min-width:80px">${UI.cuotasProg(m.pagadas,m.cuotas,isUlt)}</td>
      <td class="tc-td" style="text-align:center;color:${isUlt?'#007a72':'var(--muted)'};font-weight:${isUlt?700:400};white-space:nowrap">${fmtMesCorto(m.mesFin)}</td>
    </tr>`;
  }).join('');

  document.getElementById('page-content').innerHTML=`
${UI.hero('Tarjeta Crédito',fmtM(deudaTotal),'pendiente')}
${debugBox}
${UI.card('Proyección Mensual',`<div style="font-size:11px;color:var(--muted);font-weight:600">${proyMeses.length} meses</div>`,`<div style="position:relative;height:260px"><canvas id="tc-chart"></canvas></div>`,'margin-bottom:var(--gap)')}
${UI.card('Movimientos Pendientes',`<div style="font-size:11px;color:var(--muted)">${movsFiltrados.length} movimientos</div>`,`${filtrosHTML}
<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:12px">
  <thead><tr style="border-bottom:2px solid var(--border)">
    <th class="tc-th" style="text-align:left">Movimiento</th><th class="tc-th" style="text-align:center">Fecha</th>
    <th class="tc-th" style="text-align:right">$ Total</th><th class="tc-th" style="text-align:right">$ Pagado</th>
    <th class="tc-th" style="text-align:right">$ Pendiente</th><th class="tc-th" style="text-align:right">$ Cuota</th>
    <th class="tc-th" style="text-align:center">Cuotas</th><th class="tc-th" style="text-align:center">Mes Fin</th>
  </tr></thead>
  <tbody>${tbodyRows}</tbody>
  <tfoot><tr style="border-top:2px solid var(--border);background:rgba(0,0,0,.015)">
    <td colspan="4" style="padding:9px;font-weight:700;color:var(--text)">Total Pendiente</td>
    <td style="padding:9px 8px;text-align:right;font-weight:800;color:#ED1650;font-size:13px">${fmtM(deudaFiltrada)}</td>
    <td style="padding:9px 8px;text-align:right;font-weight:800;color:var(--muted);font-size:13px">${fmtM(movsFiltrados.reduce((a,m)=>a+m.valorCuota,0))}</td>
    <td colspan="2"></td>
  </tr></tfoot>
</table></div>`)}`;

  requestAnimationFrame(()=>{
    const canvas=document.getElementById('tc-chart');
    if(!canvas) return;
    if(charts.tc){charts.tc.destroy();delete charts.tc;}
    const ctx=canvas.getContext('2d');
    const grad=ctx.createLinearGradient(0,0,0,260);
    grad.addColorStop(0,'#00e5c8');grad.addColorStop(1,'#00b89e');
    charts.tc=new Chart(canvas,{type:'bar',plugins:[BAR_LABELS],
      data:{labels:proyMeses.map(([mes])=>{const[m,y]=mes.split('-');return[m.slice(0,3).toUpperCase(),y];}),
        datasets:[{label:'Cuotas',data:proyMeses.map(([,v])=>v),backgroundColor:grad,hoverBackgroundColor:'#00e5c8',borderWidth:0,borderRadius:7,borderSkipped:false}]},
      options:{...stdBarOptions(tooltipFn),layout:{padding:{top:22}}}});
  });
}

// ── PÁGINA: CRÉDITOS ──
function renderCreditos(){
  hideTooltip();
  function fechaTs(str){
    if(!str) return 0;
    if(str.startsWith('Date(')){const p=str.replace('Date(','').replace(')','').split(',').map(Number);return new Date(p[0],p[1],p[2]).getTime();}
    return new Date(str).getTime()||0;
  }
  function fmtFechaCredito(str){
    if(!str) return '—';
    if(str.startsWith('Date(')){const p=str.replace('Date(','').replace(')','').split(',').map(Number);return fmtMesCorto(`${MESES[p[1]]}-${p[0]}`);}
    const d=new Date(str);return !isNaN(d)?fmtMesCorto(`${MESES[d.getMonth()]}-${d.getFullYear()}`):str;
  }
  const creditosMap={};
  credData.forEach(r=>{
    if(!creditosMap[r.detalle]) creditosMap[r.detalle]={detalle:r.detalle,fecha:r.fecha,cuotas:r.cuotas,valorCuota:r.valorCuota,pagadas:0,pendientes:0,mesFin:'',mesFinPagado:''};
    const c=creditosMap[r.detalle];
    if(r.estado==='pagado'){c.pagadas++;if(!c.mesFinPagado||monthKey(r.mes)>monthKey(c.mesFinPagado))c.mesFinPagado=r.mes;}
    else{c.pendientes++;if(!c.mesFin||monthKey(r.mes)>monthKey(c.mesFin))c.mesFin=r.mes;}
    if(r.valorCuota>0) c.valorCuota=r.valorCuota;
  });
  const todos=Object.values(creditosMap).filter(c=>c.cuotas>0).sort((a,b)=>fechaTs(a.fecha)-fechaTs(b.fecha));
  const activos=todos.filter(c=>c.pendientes>0),pagados=todos.filter(c=>c.pendientes===0);
  const totalCuotaMes=activos.reduce((a,c)=>a+c.valorCuota,0);
  const totalPendiente=activos.reduce((a,c)=>a+c.valorCuota*c.pendientes,0);
  const ACCENT='#634dd2';

  function cardHTML(c){
    const esActivo=c.pendientes>0,pct=c.cuotas>0?Math.round(c.pagadas/c.cuotas*100):0;
    const montoTotal=c.valorCuota*c.cuotas,montoPendiente=c.valorCuota*c.pendientes;
    const barGrad=esActivo?`linear-gradient(90deg,${ACCENT},#a855f7)`:`linear-gradient(90deg,#059669,#22c55e)`;
    const pctColor=esActivo?ACCENT:'#059669',mesFinal=esActivo?c.mesFin:c.mesFinPagado;
    return`<div class="card" style="position:relative;overflow:hidden;padding:10px 14px">
      <div style="position:absolute;top:0;left:0;right:0;height:2px;background:${pctColor}"></div>
      <div style="margin-bottom:8px">
        <div style="font-size:13px;font-weight:800;color:var(--text);margin-bottom:2px">${c.detalle}</div>
        <div style="font-size:10px;color:var(--muted);font-weight:600">Desde ${fmtFechaCredito(c.fecha)}</div>
      </div>
      <div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">Progreso</span>
          <span style="font-size:14px;font-weight:800;color:${pctColor}">${pct}%</span>
        </div>
        <div style="height:12px;background:rgba(99,77,210,.07);border-radius:6px;overflow:hidden;position:relative">
          <div style="height:100%;width:${pct}%;background:${barGrad};border-radius:6px;position:relative">
            ${pct>=18?`<span style="position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:800;color:#fff;white-space:nowrap">${fmtM(montoTotal-montoPendiente,true)}</span>`:''}
          </div>
          ${pct<18?`<span style="position:absolute;left:${pct+2}%;top:50%;transform:translateY(-50%);font-size:9px;font-weight:800;color:${pctColor};white-space:nowrap">${fmtM(montoTotal-montoPendiente,true)}</span>`:''}
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:2px">
          <span style="font-size:9px;font-weight:600;color:var(--muted)">$0</span>
          <span style="font-size:9px;font-weight:600;color:var(--muted)">${fmtM(montoTotal,true)}</span>

function calcMamaSaldos(){
  const meses=[...new Set(mamaData.map(r=>r.mes))].sort((a,b)=>monthKey(a)-monthKey(b));
  let acum=0;
  return meses.map(mes=>{
    const rows=mamaData.filter(r=>r.mes===mes);
    const ingresos=rows.filter(r=>r.tipo==='ingreso').reduce((a,r)=>a+r.monto,0);
    const gastos=rows.filter(r=>r.tipo!=='ingreso').reduce((a,r)=>a+r.monto,0);
    acum+=ingresos-gastos;
    return{mes,ingresos,gastos,neto:ingresos-gastos,saldo:acum};
  });
}
function setMamaRange(n,btn){
  mamaEvoRange=n;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderMamaChart(calcMamaSaldos());
}

    const rows=mamaData.filter(r=>r.mes===mes);

    const rowsHTML=Object.values(grupoMap)

    ]},
    options:{responsive:true,maintainAspectRatio:false,events:['mousemove','mouseout','click'],interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{enabled:false,external:tooltipFn}},

function renderPendientes(){
  hideTooltip();

  // Construir ítems agrupados
  const itemsMap={};
  pendientesData.forEach(r=>{
    const k=r.responsable+'|'+r.detalle+'|'+r.fecha;
    if(!itemsMap[k]) itemsMap[k]={responsable:r.responsable,detalle:r.detalle,fecha:r.fecha,total:r.total,cuotas:r.cuotas,valorCuota:r.monto,pendientesCount:0,montoPendiente:0,mesFin:''};
    const it=itemsMap[k];
    if(ESTADO_PENDIENTE.has(r.estado)){it.pendientesCount++;it.montoPendiente+=r.monto;if(!it.mesFin||monthKey(r.mes)>monthKey(it.mesFin))it.mesFin=r.mes;}
    if(r.monto>0) it.valorCuota=r.monto;
  });
  Object.values(itemsMap).forEach(it=>{it.pagadas=Math.max(0,it.cuotas-it.pendientesCount);});

  const todosItems=Object.values(itemsMap).filter(i=>i.cuotas>0).sort((a,b)=>{
    const rc=a.responsable.localeCompare(b.responsable,'es');if(rc!==0)return rc;
    const fd=parseFechaNum(a.fecha)-parseFechaNum(b.fecha);if(fd!==0)return fd;
    return a.detalle.localeCompare(b.detalle,'es');
  });
  const activos=todosItems.filter(i=>i.pendientesCount>0);
  const respUnicos=[...new Set(pendientesData.map(r=>r.responsable))].sort();
  const respColorMap=Object.fromEntries(respUnicos.map((r,i)=>[r,RESP_COLORS[i%RESP_COLORS.length]]));

  // Segmentos distribución
  const distSegs=respUnicos.map(r=>({label:r,color:respColorMap[r],amt:activos.filter(i=>i.responsable===r).reduce((a,i)=>a+i.montoPendiente,0),opacity:!pendDistFiltro||pendDistFiltro===r?1:.3})).filter(d=>d.amt>0).sort((a,b)=>b.amt-a.amt);
  const totalDist=distSegs.reduce((a,d)=>a+d.amt,0);

  // Filtrar
  const filteredItems=pendDistFiltro?activos.filter(i=>i.responsable===pendDistFiltro):activos;
  const filteredKeys=new Set(filteredItems.map(i=>i.responsable+'|'+i.detalle+'|'+i.fecha));
  const totalPend=filteredItems.reduce((a,i)=>a+i.montoPendiente,0);

  // Proyección
  const proyMap={};
  pendientesData.filter(r=>ESTADO_PENDIENTE.has(r.estado)&&filteredKeys.has(r.responsable+'|'+r.detalle+'|'+r.fecha))
    .forEach(r=>{proyMap[r.mes]=(proyMap[r.mes]||0)+r.monto;});
  const proy=Object.entries(proyMap).sort((a,b)=>monthKey(a[0])-monthKey(b[0]));

  // Tabla
  const tableRows=filteredItems.map((it,i)=>{
    const pagadoMonto=it.total>0?it.total-it.montoPendiente:it.pagadas*it.valorCuota;
    const isUlt=it.pendientesCount===1;
    const bg=i%2===0?'transparent':'rgba(0,0,0,.012)';
    const color=respColorMap[it.responsable]||'#634dd2';
    return`<tr style="border-bottom:1px solid var(--border);background:${bg}">
      <td class="tc-td" style="font-weight:700;white-space:nowrap"><span style="display:inline-block;width:6px;height:6px;border-radius:2px;background:${color};margin-right:5px;vertical-align:middle"></span><span style="color:${color}">${it.responsable}</span></td>
      <td class="tc-td" style="text-align:center;color:var(--muted);white-space:nowrap">${fmtFecha(it.fecha)}</td>
      <td class="tc-td" style="max-width:260px;font-weight:600">${it.detalle}${isUlt?UI.pillUltima():''}</td>
      <td class="tc-td" style="text-align:right;color:var(--muted)">${it.total>0?fmtM(it.total):'—'}</td>
      <td class="tc-td" style="text-align:right;color:#059669">${fmtM(pagadoMonto)}</td>
      <td class="tc-td" style="text-align:right;color:#ED1650;font-weight:700">${fmtM(it.montoPendiente)}</td>
      <td class="tc-td" style="text-align:right;color:var(--muted)">${fmtM(it.valorCuota)}</td>
      <td class="tc-td" style="text-align:center;color:${isUlt?'#007a72':'var(--muted)'};font-weight:${isUlt?700:400}">${it.cuotas>0?`${it.pagadas}/${it.cuotas}`:'—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('page-content').innerHTML=`
${UI.hero('Pendientes',fmtM(totalPend),'pendiente','Compromisos y deudas')}
${UI.sectionLabel('Distribución por responsable')}
${UI.card('','',`
  ${UI.distBar(distSegs, totalDist, 'setPendFiltro')}
  ${pendDistFiltro?`<div style="margin-top:10px"><button class="btn-clear" onclick="setPendFiltro('')">✕ Limpiar filtro · ${pendDistFiltro}</button></div>`:''}
`,'margin-bottom:var(--gap)')}
${UI.sectionLabel('Detalle de compromisos')}
${UI.card('',`<div style="font-size:11px;color:var(--muted)">${filteredItems.length} ítems${pendDistFiltro?' · '+pendDistFiltro:''}</div>`,`
  <div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:12px;width:100%">
    <thead><tr style="border-bottom:2px solid var(--border)">
      <th class="tc-th" style="text-align:left">Responsable</th><th class="tc-th" style="text-align:center">Fecha</th>

      <th class="tc-th" style="text-align:right">$ Cuota</th><th class="tc-th" style="text-align:center"># Cuotas</th>
    </tr></thead>
    <tbody>${tableRows}</tbody>

      <td colspan="4" style="padding:9px;font-weight:700;color:var(--text)">Total</td>

${UI.sectionLabel('Proyección de pagos')}
${UI.card('',`<div style="font-size:11px;color:var(--muted)">${proy.length} meses</div>`,`<div style="position:relative;height:240px"><canvas id="pend-proy"></canvas></div>`,'margin-bottom:var(--gap)')}`;

  requestAnimationFrame(()=>{
    const canvas=document.getElementById('pend-proy');
    if(!canvas||!proy.length) return;
    if(charts.pendProy){charts.pendProy.destroy();delete charts.pendProy;}

    <div class="tc-resumen-row"><span class="tc-resumen-label">Copec</span><span class="tc-resumen-val">${copecTC?fmtM(copecTC):'—'}</span></div>
    <div class="tc-resumen-row"><span class="tc-resumen-label">Pago</span><span class="tc-resumen-val widget-green">${fmtM(pagoTC)}</span></div>
    <div class="tc-resumen-row"><span class="tc-resumen-label">Pendiente</span><span class="tc-resumen-val widget-red">${fmtM(pendienteTC)}</span></div>
    <div class="tc-resumen-row"><span class="tc-resumen-label">Delta</span><span class="tc-resumen-val ${deltaTC>=0?'widget-green':'widget-red'}">${fmtM(deltaTC)}</span></div>
  </div>
  <div class="widget">
    <div class="widget-title">TC del mes</div>
    ${tcGsTotal?`<div class="tc-resumen-row"><span class="tc-resumen-label">Total</span><span class="tc-resumen-val">${fmtM(tcGsTotal)}</span></div>`:''}
    ${finDia?`<div class="tc-resumen-row"><span class="tc-resumen-label">Fin</span><span class="tc-resumen-val">${finDia}</span></div>`:''}
    ${diario?`<div class="tc-resumen-row"><span class="tc-resumen-label">Diario</span><span class="tc-resumen-val widget-accent">${fmtM(diario)}</span></div>`:''}
  </div>
</div>

${objetivo||actual?`
${UI.sectionLabel('Objetivo Millas')}
<div class="widget-grid-2" style="margin-bottom:20px">
  <div class="widget">
    <div class="widget-title">Avance millas</div>
    <div class="widget-val">${actual?fmtNum(actual):'—'} <span style="font-size:14px;font-weight:600;color:var(--muted)">/ ${objetivo?fmtNum(objetivo):'—'}</span></div>
    <div class="prog-bar-wrap">
      <div class="prog-bar-track"><div class="prog-bar-fill" style="width:${Math.min(avancePct,100)}%;background:${avancePct>=100?'#059669':'#634dd2'}"></div></div>
      <div class="prog-label"><span>${avancePct}% completado</span><span>${objetivo&&actual?fmtNum(objetivo-actual)+' restantes':''}</span></div>
    </div>
  </div>
  <div class="widget">
    <div class="widget-title">Proyección</div>
    ${proyMillas?`<div class="millas-row"><span class="tc-resumen-label">Proy. Millas</span><span style="font-weight:800;font-size:15px">${fmtNum(proyMillas)}</span></div>`:''}
    ${metaMillas?`<div class="millas-row"><span class="tc-resumen-label">Fecha meta</span><span style="font-weight:700;color:var(--accent)">${metaMillas}</span></div>`:''}
  </div>
</div>`:''}

${UI.sectionLabel('Ahorro Crédito')}
<div class="widget-grid-2">
  <div class="widget">
    <div class="widget-title">Ahorro Crédito acumulado</div>
    <div class="widget-val widget-green">${fmtM(ahorroCredVal)}</div>
  </div>
  <div class="widget">
    <div class="widget-title">Inicio del ahorro</div>
    <div class="widget-val" style="font-size:16px;font-weight:700">${inicioVal||'—'}</div>
  </div>
</div>`;
}

// ── NAV ──
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('active');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('active');}
function setTab(tab,btn){
  document.querySelectorAll('.nav-item').forEach(b=>{b.classList.remove('active');b.dataset.tab='';});
  btn.classList.add('active');btn.dataset.tab=tab;
  closeSidebar();
  const pages={resumen:renderResumen,tc:renderTC,mensual:renderPage,creditos:renderCreditos,mama:renderMama,pendientes:renderPendientes};
  if(pages[tab]) pages[tab]();
  else{hideTooltip();document.getElementById('page-content').innerHTML=`<div class="loading-state"><div class="loading-text">Próximamente…</div></div>`;}
}

loadData();
</script>
</body>
</html>
