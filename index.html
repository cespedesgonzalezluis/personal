<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Portal</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23111111'/%3E%3Cpolyline points='22 12 18 12 15 21 9 3 6 12 2 12' fill='none' stroke='%2300D2BE' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d0d;--card:#1a1a1a;--border:rgba(255,255,255,.09);--text:#e8e8e8;--muted:#8899aa;
  --accent:#00D2BE;--navy:#009b8d;--green:#10b981;--red:#ED1650;--teal:#00D2BE;
  --shadow:0 1px 4px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.25);
  --shadow-md:0 4px 20px rgba(0,210,190,.18);
  --radius:14px;--gap:16px;--sidebar:220px;--font:'Sofia Sans',sans-serif;
}
html,body{height:100%;font-family:var(--font)}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#333;border-radius:999px}
.app{display:flex;flex:1;min-height:100vh}
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-width:0}
.content{padding:24px 28px;flex:1}

/* SIDEBAR */
.sidebar{width:var(--sidebar);background:#111111;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200;transition:transform .25s;border-right:1px solid rgba(255,255,255,.06)}
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(0,210,190,.22);display:flex;align-items:center;gap:10px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#00D2BE,#009b8d);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark svg{width:16px;height:16px;stroke:#fff}
.sidebar-logo-title{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.2px;line-height:1.1}
.sidebar-logo-sub{font-size:10px;font-weight:600;color:rgba(255,255,255,.3);margin-top:1px}
.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav-section{font-size:9px;font-weight:800;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:.14em;padding:10px 8px 4px;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:13px;font-weight:700;color:rgba(255,255,255,.5);cursor:pointer;border:none;background:transparent;font-family:var(--font);text-align:left;width:100%;transition:all .15s;position:relative}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8)}
.nav-item.active{background:linear-gradient(135deg,rgba(0,210,190,.22),rgba(0,210,190,.06));color:#00D2BE;text-shadow:0 0 12px rgba(0,210,190,.4)}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;background:#00D2BE;border-radius:2px}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active .nav-icon{opacity:1}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:10px;font-weight:600;color:rgba(255,255,255,.2);line-height:1.6}
.sidebar-footer span{display:block;color:rgba(255,255,255,.4);font-weight:700;font-size:11px}

/* HAMBURGER */
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:300;flex-direction:column;gap:4px;background:#1a1a1a;border:1px solid rgba(255,255,255,.09);border-radius:9px;cursor:pointer;padding:8px 9px;box-shadow:var(--shadow)}
.hamburger span{display:block;width:18px;height:2px;background:#e8e8e8;border-radius:2px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:150;backdrop-filter:blur(2px)}

/* HERO */
.hero{background:linear-gradient(135deg,#111111 0%,#0d1d1b 55%,#0f2421 100%);border-radius:18px;padding:26px 30px 28px;position:relative;overflow:hidden;margin-bottom:20px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.orb{position:absolute;border-radius:50%;pointer-events:none}
.orb-1{top:-50px;right:-50px;width:240px;height:240px;background:radial-gradient(circle,rgba(0,210,190,.18) 0%,transparent 70%)}
.orb-2{bottom:-30px;left:38%;width:160px;height:160px;background:radial-gradient(circle,rgba(0,210,190,.12) 0%,transparent 70%)}
.hero-inner{position:relative;z-index:1}
.hero-eyebrow{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.16em;margin-bottom:5px}
.hero-title{font-size:30px;font-weight:800;color:#fff;line-height:1.08;letter-spacing:-.4px}
.hero-title span{background:linear-gradient(90deg,#00D2BE,#C0C0C0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:12px;color:rgba(255,255,255,.3);font-weight:500;margin-top:5px}

/* KPI */
.kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-bottom:20px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-top:2px solid rgba(0,210,190,.5);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.kpi-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.kpi-label{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.kpi-val{font-size:21px;font-weight:800;color:var(--text);line-height:1;margin-bottom:5px}
.kpi-delta{font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px;min-height:16px}
.delta-up{color:var(--teal)}.delta-down{color:var(--red)}

/* SECTION / CARD */
.sec-label{font-size:10px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:1.4px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-top:1px solid rgba(0,210,190,.3);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:13px;font-weight:800;color:var(--text)}
.mama-grid{display:grid;grid-template-columns:6fr 2.8fr;gap:var(--gap)}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:800;white-space:nowrap}
.badge-navy{background:rgba(0,210,190,.12);color:#00D2BE}
.badge-green{background:rgba(0,210,190,.12);color:#00D2BE}
.badge-red{background:rgba(237,22,80,.08);color:#ED1650}
.badge-teal{background:rgba(0,210,190,.12);color:#00D2BE}
.badge-gray{background:rgba(255,255,255,.08);color:#bbb}

/* PERIOD TOGGLE */
.period-toggle{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:2px;gap:2px}
.period-btn{border:none;background:transparent;color:var(--muted);font-family:var(--font);font-size:11px;font-weight:700;padding:4px 12px;border-radius:5px;cursor:pointer;transition:all .15s}
.period-btn.active{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(0,155,141,.4)}

/* FILTER DROPDOWN */
.filter-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.filter-group{display:flex;flex-direction:column;gap:5px;position:relative}
.filter-label{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.filter-trigger{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer;min-width:220px;transition:border-color .15s,box-shadow .15s;user-select:none}
.filter-trigger:hover{border-color:var(--accent)}
.filter-trigger.open{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,210,190,.12)}
.filter-trigger-left{display:flex;flex-direction:column;gap:2px}
.filter-trigger-val{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.filter-trigger-amt{font-size:10px;font-weight:700;color:var(--muted)}
.filter-trigger-val.placeholder{color:var(--muted);font-weight:600}
.filter-chevron{width:16px;height:16px;flex-shrink:0;color:var(--muted);transition:transform .2s}
.filter-trigger.open .filter-chevron{transform:rotate(180deg)}
.filter-dropdown{position:absolute;top:calc(100% + 6px);left:0;z-index:100;background:var(--card);border:1.5px solid var(--border);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.5);min-width:100%;max-height:260px;overflow-y:auto;display:none;scrollbar-width:thin;scrollbar-color:#333 transparent}
.filter-dropdown.open{display:block}
.filter-option{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;cursor:pointer;transition:background .1s;border-bottom:1px solid rgba(255,255,255,.05)}
.filter-option:last-child{border-bottom:none}
.filter-option:hover{background:rgba(0,210,190,.07)}
.filter-option.selected{background:rgba(0,210,190,.1)}
.filter-option-name{font-size:12px;font-weight:600;color:var(--text)}
.filter-option-amt{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
.filter-option.selected .filter-option-name{color:#00D2BE;font-weight:700}
.filter-option.selected .filter-option-amt{color:#00D2BE}
.filter-option-check{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.filter-option.selected .filter-option-check{background:#00D2BE;border-color:#00D2BE}
.filter-option.selected .filter-option-check::after{content:'';width:7px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block}
/* Botón limpiar — fuera del dropdown, al lado del filtro */
.btn-clear{display:inline-flex;align-items:center;gap:5px;padding:9px 12px;border:1.5px solid rgba(237,22,80,.25);background:rgba(237,22,80,.06);border-radius:10px;font-family:var(--font);font-size:11px;font-weight:700;color:var(--red);cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-clear:hover{background:rgba(237,22,80,.12);border-color:rgba(237,22,80,.4)}

/* CAT PILLS */
.cat-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cat-btn{border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font);font-size:11px;font-weight:700;padding:4px 11px;border-radius:6px;cursor:pointer;transition:all .15s}
.cat-btn:hover{border-color:var(--accent);color:var(--accent)}
.cat-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 2px 6px rgba(0,155,141,.4)}
.cat-btn.active[data-cat]:not([data-cat=""]){background:var(--cat-c,var(--navy));border-color:var(--cat-c,var(--navy))}
@media(hover:none){.chart-tooltip{pointer-events:none}}

/* TABLE */
.tbl-scroll{overflow-y:auto;overflow-x:auto;max-height:340px;scrollbar-width:thin;scrollbar-color:#333 transparent}
table{width:100%;border-collapse:separate;border-spacing:0}
thead th{padding:9px 12px;font-size:10px;font-weight:800;color:var(--accent);text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:1;letter-spacing:.04em}
thead th:last-child{text-align:right}
tbody td{padding:9px 12px;font-size:12px;color:var(--text);border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tbody td:last-child{text-align:right;font-weight:800}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(0,210,190,.05)}
.tc-th{padding:8px;color:var(--muted);font-weight:700;white-space:nowrap;font-size:11px}
.tc-td{padding:9px 8px;font-size:12px}

/* DIST BAR — componente reutilizable */
.dist-bar{display:flex;height:64px;border-radius:10px;overflow:hidden;gap:2px;align-items:stretch}
.dist-seg{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;padding:0 8px;transition:filter .15s,opacity .2s;overflow:hidden;min-width:max-content}
.dist-seg:hover{filter:brightness(1.1)}
.dist-seg-name{font-size:11px;font-weight:800;white-space:nowrap}
.dist-seg-info{font-size:10px;font-weight:700;opacity:.88;white-space:nowrap;margin-top:1px}

/* LEGEND */
.chart-legend{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.legend-dot{width:12px;height:3px;display:inline-block;border-radius:2px;flex-shrink:0}

/* MISC */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px;gap:12px}
.spinner{width:28px;height:28px;border:2.5px solid rgba(255,255,255,.12);border-top-color:#00D2BE;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.error-box{background:rgba(237,22,80,.06);border:1px solid rgba(237,22,80,.18);border-radius:12px;padding:20px;text-align:center;font-size:13px;color:var(--red);font-weight:600}
.debug-box{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.3);border-radius:10px;padding:12px 16px;font-size:12px;color:#fbbf24;font-weight:600;margin-bottom:14px;line-height:1.7}

/* TOOLTIP */
.chart-tooltip{position:fixed;z-index:9999;pointer-events:none;background:#0d1d1b;border:1px solid rgba(0,210,190,.2);border-radius:10px;padding:10px 14px;min-width:180px;font-family:var(--font);box-shadow:0 8px 32px rgba(0,0,0,.35);display:none}
.ct-header{font-size:11px;font-weight:800;color:#fff;margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.ct-divider{height:1px;background:rgba(255,255,255,.08);margin-bottom:7px}
.ct-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:4px}
.ct-row:last-child{margin-bottom:0}
.ct-label{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.5)}
.ct-dot{width:6px;height:6px;border-radius:2px;flex-shrink:0}
.ct-val{font-size:12px;font-weight:800;color:#fff}

/* RESUMEN WIDGETS */
.widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-bottom:20px}
.widget-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap);margin-bottom:20px}
.widget-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);margin-bottom:20px}
.widget{background:var(--card);border:1px solid var(--border);border-top:1px solid rgba(0,210,190,.3);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.widget-title{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}
.widget-val{font-size:22px;font-weight:800;color:var(--text);line-height:1.1}
.widget-sub{font-size:11px;font-weight:600;color:var(--muted);margin-top:4px}
.widget-accent{color:var(--accent)}
.widget-green{color:var(--green)}
.widget-red{color:var(--red)}
.widget-teal{color:var(--teal)}
.dist-ahorro-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.dist-ahorro-row:last-child{border-bottom:none}
.dist-ahorro-name{font-weight:700;color:var(--text);flex:1}
.dist-ahorro-bank{font-size:11px;color:var(--muted);font-weight:600;margin-right:12px}
.dist-ahorro-pct{font-size:11px;font-weight:800;color:var(--muted);min-width:36px;text-align:right;margin-right:10px}
.dist-ahorro-monto{font-weight:800;color:var(--text)}
.prog-bar-wrap{margin-top:8px}
.prog-bar-track{height:6px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;margin-top:4px}
.prog-bar-fill{height:100%;border-radius:6px;transition:width .4s}
.prog-label{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--muted);margin-top:4px}
.millas-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:12px}
.tc-resumen-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.tc-resumen-row:last-child{border-bottom:none}
.tc-resumen-label{font-weight:600;color:var(--muted)}
.tc-resumen-val{font-weight:800;color:var(--text)}
/* RESPONSIVE GRIDS — usados en HTML dinámico */
.r-grid-1-2{display:grid;grid-template-columns:1fr 2fr;gap:var(--gap);margin-bottom:20px;align-items:stretch}
.r-grid-liq{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);margin-bottom:20px}
.r-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap);margin-bottom:20px}

@media(max-width:900px){
  .widget-grid,.widget-grid-4{grid-template-columns:repeat(2,1fr)}
  .widget-grid-2{grid-template-columns:1fr}
  :root{--sidebar:0px}
  .sidebar{transform:translateX(-224px);width:224px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:flex}
  .overlay.active{display:block}
  .kpi-strip{grid-template-columns:repeat(2,1fr)}
  .mama-grid{grid-template-columns:1fr}
  .filter-row{flex-direction:column}
  .filter-trigger{min-width:100%}
  .r-grid-1-2,.r-grid-liq,.r-grid-2{grid-template-columns:1fr}
}
@media(max-width:560px){
  .content{padding:14px 16px}
  .hero{padding:20px 18px}
  .hero-title{font-size:22px}
  .kpi-strip{grid-template-columns:1fr}
  .widget-grid,.widget-grid-2,.widget-grid-4{grid-template-columns:1fr}
  .dist-bar{height:48px}
  .dist-seg-name{font-size:9px}
  .dist-seg-info{font-size:8px}
}

/* ── MERCEDES AMG PETRONAS F1 IDENTITY ── */
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 0%,#00D2BE 35%,#a0f0e8 50%,#00D2BE 65%,transparent 100%);opacity:.7}
.sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00D2BE,transparent);opacity:.8}
.card-title{font-size:13px;font-weight:800;color:var(--text);letter-spacing:.02em}
thead th{background:rgba(0,210,190,.04)}
</style>
</head>
<body>
<div class="chart-tooltip" id="chartTooltip">
  <div class="ct-header" id="ct-header"></div>
  <div class="ct-divider"></div>
  <div id="ct-rows"></div>
</div>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<button class="hamburger" id="hamburger" onclick="openSidebar()"><span></span><span></span><span></span></button>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <div>
        <div class="sidebar-logo-title">Mi Portal</div>
        <div class="sidebar-logo-sub">Finanzas Personales</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Reportes</div>
      <button class="nav-item active" onclick="setTab('mensual',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Mensual
      </button>
      <button class="nav-item" onclick="setTab('tc',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Tarjeta Crédito
      </button>

const capFirst = s => s ? s[0].toUpperCase()+s.slice(1) : '';
const parseMonto = v => {
  if(v==null) return 0;
  if(typeof v==='number') return v;
  const n=parseFloat(String(v).replace(/[$.\s]/g,'').replace(',','.'));
  return isNaN(n)?0:n;
};
function parseMesCell(cell){
  if(!cell) return '';
  const{v,f=''}=cell;
  if(!v&&v!==0) return '';
  const sv=String(v);
  if(sv.startsWith('Date(')){
    const p=sv.replace('Date(','').replace(')','').split(',').map(Number);
    const m=MESES[p[1]]; return m?`${m}-${p[0]}`:'';}
  if(f&&/[a-záéíóúüñ]+-\d{4}/i.test(f)) return f.toLowerCase();
  if(/[a-záéíóúüñ]+-\d{4}/i.test(sv)) return sv.toLowerCase();
  return sv;
}
function parseMesMama(cell){
  if(!cell) return '';
  const base=parseMesCell(cell); if(base) return base;
  const sv=String(cell.v||'');
  const iso=sv.match(/^(\d{4})-(\d{1,2})-\d{1,2}$/);
  if(iso){const m=MESES[parseInt(iso[2],10)-1];return m?`${m}-${iso[1]}`:'';}
  return '';
}
const monthKey = m => { const[mes,año]=String(m).split('-'); return parseInt(año||0)*12+Math.max(0,MESES.indexOf(mes?.toLowerCase())); };
function parseFechaNum(str){
  const d=parseDateRaw(str); return d?d.getTime():0;
}
// fmtM: short=true → 200K / 2,05M | short=false → CLP completo $1.234.567
function fmtM(n, short=false){
  const abs=Math.abs(n);
  if(short){
    if(abs>=1e6) return `$${(abs/1e6).toFixed(2).replace('.',',')}M`;
    if(abs>=1e3) return `$${Math.round(abs/1e3).toLocaleString('es-CL')}K`;
  }
  return `$${Math.round(abs).toLocaleString('es-CL')}`;
}
function fmtNum(n){ return Math.round(Math.abs(n)).toLocaleString('es-CL'); }
function deltaKpi(a,b,inv=false){
  if(!b) return '';
  const d=a-b; if(Math.abs(d)<1) return '';
  const good=inv?d<0:d>0;
  return `<span class="${good?'delta-up':'delta-down'}">${d>0?'↑':'↓'} $${Math.round(Math.abs(d)).toLocaleString('es-CL')}</span>`;
}
function fmtFecha(str, short=false){
  const d=parseDateRaw(str); if(!d) return str||'—';
  return short?fmtMesCorto(`${MESES[d.getMonth()]}-${d.getFullYear()}`):d.toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'});
}
const fmtMesLabel = mes => { if(!mes) return '—'; const[m,y]=mes.split('-'); return `${capFirst(m)} ${y}`; };
function fmtMesCorto(mes){
  if(!mes) return '—';
  const[m,y]=mes.split('-');
  const map={enero:'ene',febrero:'feb',marzo:'mar',abril:'abr',mayo:'may',junio:'jun',julio:'jul',agosto:'ago',septiembre:'sep',octubre:'oct',noviembre:'nov',diciembre:'dic'};
  return `${map[m]||m} ${y}`;
}
function getTypeColor(tipo, pool){
  if(!pool._i) pool._i=0;
  if(!pool[tipo]) pool[tipo]=COLOR_MAP[tipo]||COLOR_POOL[pool._i++%COLOR_POOL.length];
  return pool[tipo];
}
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function parseDateRaw(str){
  if(!str) return null;
  const sv=String(str).trim();
  if(sv.startsWith('Date(')){
    const p=sv.replace('Date(','').replace(')','').split(',').map(Number);
    return new Date(p[0],p[1],p[2]);
  }
  const d=new Date(sv);
  return isNaN(d)?null:d;
}

function makeBarLabelPlugin(id){

async function fetchSheet(sheet){
  const r=await fetch(`${BASE}&sheet=${encodeURIComponent(sheet)}`);
  if(!r.ok) throw new Error(`HTTP ${r.status} al cargar "${sheet}"`);
  const txt=await r.text();
  return JSON.parse(txt.replace(/^[^{]+/,'').replace(/[^}]+$/,'')).table.rows||[];
}
async function loadData(){

    Object.keys(TIPO_COLOR_POOL).forEach(k=>delete TIPO_COLOR_POOL[k]);

      fetchSheet('mensual'),fetchSheet('Tarjeta Credito'),fetchSheet('Creditos'),
      fetchSheet('Ahorro Mama'),fetchSheet('Mama'),fetchSheet('Otros'),fetchSheet('Pendientes')
    ]);
    rawData=rowsMensual.map(r=>({
      detalle:String(r.c[0]?.v||''),tipo:String(r.c[1]?.v||'').toLowerCase().trim(),
      mes:parseMesCell(r.c[2]),monto:parseMonto(r.c[3]?.v)
    })).filter(r=>r.mes&&r.monto);

    tcData=rowsTC.map(r=>{
      const total=parseMonto(r.c[2]?.v),cuotas=Number(r.c[3]?.v)||0;
      const rawValor=parseMonto(r.c[6]?.v);
      return{movimiento:String(r.c[0]?.v||''),fecha:String(r.c[1]?.v||''),total,cuotas,
        mes:parseMesCell(r.c[5]),valorCuota:rawValor>0?rawValor:(total>0?total/cuotas:0),
        estado:String(r.c[7]?.v||'').toLowerCase().trim()};
    }).filter(r=>r.movimiento&&r.mes);

    credData=rowsCred.map(r=>({
      detalle:String(r.c[0]?.v||''),fecha:String(r.c[1]?.v||''),cuotas:Number(r.c[2]?.v)||0,
      mes:parseMesCell(r.c[3]),cuotaNum:Number(r.c[4]?.v)||0,
      valorCuota:parseMonto(r.c[5]?.v),estado:String(r.c[6]?.v||'').toLowerCase().trim()
    })).filter(r=>r.detalle&&r.mes);

    mamaData=rowsMama.map(r=>({
      mes:parseMesMama(r.c[0]),tipo:String(r.c[1]?.v||'').toLowerCase().trim(),
      detalle:String(r.c[2]?.v||'').trim(),monto:parseMonto(r.c[3]?.v)
    })).filter(r=>r.mes&&r.detalle);

    mamaTransData=rowsNewMama.map(r=>({
      fecha:String(r.c[0]?.v||''),mes:parseMesMama(r.c[0]),
      tipo:String(r.c[1]?.v||'').toLowerCase().trim(),
      detalle:String(r.c[2]?.v||'').trim(),monto:parseMonto(r.c[3]?.v)
    })).filter(r=>r.mes&&r.detalle);

    pendientesData=rowsPend.map(r=>({
      responsable:String(r.c[0]?.v||'').trim(),detalle:String(r.c[1]?.v||'').trim(),
      fecha:String(r.c[2]?.v||''),total:parseMonto(r.c[3]?.v),cuotas:Number(r.c[4]?.v)||0,
      cuotaNum:Number(r.c[5]?.v)||0,mes:parseMesCell(r.c[6]),monto:parseMonto(r.c[7]?.v),
      estado:String(r.c[8]?.v||'').toLowerCase().trim()
    })).filter(r=>r.responsable&&r.mes);

    // Hoja Otros: formato Tipo|Métrica|Valor (cols A,B,C)
    if(rowsOtros.length){
      const od={};
      const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
      rowsOtros.forEach(row=>{
        const cells=row.c||[];
        const tipo=norm(String(cells[0]?.v||'').trim());
        const metrica=norm(String(cells[1]?.v||'').trim());
        const valorRaw=cells[2]?.v!=null?cells[2].v:null;
        if(!tipo||!metrica||valorRaw==null) return;
        od[tipo+'|'+metrica]=valorRaw;
      });
      od['_get']=(t,m)=>{ const k=norm(t)+'|'+norm(m); return od[k]!=null?od[k]:null; };
      otrosData=od;
    }

    months=[...new Set(rawData.map(r=>r.mes))].sort((a,b)=>monthKey(a)-monthKey(b));
    selMonth=months[months.length-1];
    document.getElementById('month-select').innerHTML=months.map(m=>`<option value="${m}"${m===selMonth?' selected':''}>${fmtMesLabel(m)}</option>`).join('');
    const now=new Date();
    document.getElementById('sidebar-ts').textContent=now.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'})+' · '+now.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',hour12:false});
    renderPage();
  }catch(e){
    document.getElementById('page-content').innerHTML=`<div class="error-box">Error al cargar datos.<br><small style="opacity:.7">${e.message}</small></div>`;
  }
}

// ── DATA HELPERS ──
function sumsFor(mes){
  const m=months.includes(mes)?mes:months[months.length-1];
  const rows=rawData.filter(r=>r.mes===m);
  const sum=types=>rows.filter(r=>types.includes(r.tipo)).reduce((a,r)=>a+r.monto,0);
  const gasto=rows.filter(r=>r.tipo!=='ingreso'&&r.tipo!=='tarjeta credito').reduce((a,r)=>a+r.monto,0);
  return{ing:sum(['ingreso']),gasto,tc:sum(['tarjeta credito'])};
}
function getCatAmounts(mes){
  const m=months.includes(mes)?mes:months[months.length-1];
  const rows=rawData.filter(r=>r.mes===m&&r.tipo!=='ingreso'&&r.tipo!=='tarjeta credito');
  const bkt=Object.fromEntries(CAT_DEF.map(c=>[c.key,0]));
  rows.forEach(r=>{const cat=CAT_DEF.find(c=>c.key!=='otros'&&c.match(r));bkt[cat?cat.key:'otros']+=r.monto;});
  return bkt;
}
// Construir segmentos de distribución dinámica (por tipo del mes)
function buildDistSegs(mes){
  const m=months.includes(mes)?mes:months[months.length-1];
  const rows=rawData.filter(r=>r.mes===m&&r.tipo!=='ingreso'&&r.tipo!=='tarjeta credito');
  const tipoMap={};
  rows.forEach(r=>{
    const t=r.tipo;
    if(!tipoMap[t]) tipoMap[t]={label:capFirst(t),key:t,color:getTypeColor(t,TIPO_COLOR_POOL),amt:0};
    tipoMap[t].amt+=r.monto;
  });
  return Object.values(tipoMap).filter(s=>s.amt>0).sort((a,b)=>b.amt-a.amt);
}

  const gastos=slice.map(m=>sumsFor(m).gasto);
  const tcs=slice.map(m=>sumsFor(m).tc);
  const dlt=(arr,i,inv=false)=>{if(i===0)return'';const d=arr[i]-arr[i-1];if(d===0)return'';const good=inv?d<0:d>0;return ` <span style="color:${good?'#10b981':'#ED1650'};font-size:10px">${d>0?'↑ +':'↓ '}${fmtM(Math.abs(d),true)}</span>`;};
  const tooltipFn=makeExternalTooltip(i=>labelsFmt[i],i=>[

    {color:'#f43f5e',label:`Gasto${dlt(gastos,i,true)}`,val:fmtM(gastos[i])},
    {color:'#f59e0b',label:`Tarjeta Crédito${dlt(tcs,i,true)}`,val:fmtM(tcs[i])},
  ]);

      // Ingreso: área rellena semitransparente al fondo

      // Gasto: línea protagonista, más gruesa
      {...lineDataset('Gasto',gastos,'#f43f5e'),borderWidth:3,pointRadius:4,pointHoverRadius:7},

  return tipos.map(tipo=>({key:tipo,label:capFirst(tipo),color:getTypeColor(tipo,TIPO_COLOR_POOL),match:r=>r.tipo===tipo}));
}
function renderDistEvo(){
  const slice=evoRange===0?months:months.slice(-evoRange);
  const labels=slice.map(m=>{const[mes,año]=m.split('-');return[mes.slice(0,3).toUpperCase(),año];});

  const allCats=getTiposReales();

  const pctData=catsToShow.map(cat=>({...cat,
    pcts:slice.map(m=>{const ing=sumsFor(m).ing;if(!ing)return 0;const amt=rawData.filter(r=>r.mes===m&&cat.match(r)).reduce((a,r)=>a+r.monto,0);return Math.round(amt/ing*1000)/10;}),
    amts:slice.map(m=>rawData.filter(r=>r.mes===m&&cat.match(r)).reduce((a,r)=>a+r.monto,0))
  })).filter(cat=>cat.amts.some(v=>v>0))
   .sort((a,b)=>b.amts.reduce((x,v)=>x+v,0)-a.amts.reduce((x,v)=>x+v,0));

  const yScale=distCatFilter

    :{stacked:true,grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{family:SF,size:10},color:'#9CA3AF',callback:v=>`${v}%`},min:0,max:100};

  const legendEl=document.getElementById('dist-legend');

function renderDetalle(prevMes){
  const allRows=rawData.filter(r=>r.mes===selMonth).sort((a,b)=>{const t=a.tipo.localeCompare(b.tipo,'es');return t!==0?t:a.detalle.localeCompare(b.detalle,'es');});
  const tipos=[...new Set(allRows.map(r=>r.tipo))].sort();
  const rows=detCatFiltro?allRows.filter(r=>r.tipo===detCatFiltro):allRows;
  const prevRows=prevMes?rawData.filter(r=>r.mes===prevMes):[];
  document.getElementById('tbody-detalle').innerHTML=rows.map(row=>{
    const prv=prevRows.find(p=>p.detalle===row.detalle);
    let badge='<span style="color:#9CA3AF;font-size:11px;font-weight:700">—</span>';
    if(prv?.monto>0){
      const d=row.monto-prv.monto;
      if(Math.abs(d)<1) badge=`<span class="badge badge-gray" style="font-size:10px;padding:2px 7px">≈ igual</span>`;
      else{const good=row.tipo==='ingreso'?d>0:d<0;badge=`<span class="badge ${good?'badge-green':'badge-red'}" style="font-size:10px;padding:2px 7px">${d>0?'↑':'↓'} $${Math.round(Math.abs(d)).toLocaleString('es-CL')}</span>`;}
    }
    const tipoColor=getTypeColor(row.tipo,TIPO_COLOR_POOL);
    return`<tr><td style="font-size:10px;font-weight:800;white-space:nowrap"><span style="display:inline-flex;align-items:center;gap:4px;color:${tipoColor}"><span style="width:6px;height:6px;border-radius:2px;background:${tipoColor};flex-shrink:0;display:inline-block"></span>${esc(capFirst(row.tipo))}</span></td><td style="font-size:12px">${esc(row.detalle)}</td><td style="text-align:center">${badge}</td><td>${fmtM(row.monto)}</td></tr>`;
  }).join('')||`<tr><td colspan="4" style="color:#9CA3AF;font-size:12px;padding:20px 0">Sin registros</td></tr>`;
}

function renderDist(){
  const segs=buildDistSegs(selMonth).sort((a,b)=>b.amt-a.amt);
  const ing=sumsFor(selMonth).ing;
  const totalGasto=segs.reduce((a,s)=>a+s.amt,0);
  const disponible=ing-totalGasto;
  const dispColor=disponible>=0?'#10b981':'#f43f5e';
  const allSegs=[...segs];
  if(Math.abs(disponible)>0) allSegs.push({label:disponible>=0?'Disponible':'Déficit',key:'',color:dispColor,amt:Math.abs(disponible)});
  // Aplica opacidad si hay filtro activo
  const segsF=allSegs.map(s=>({...s,opacity:detCatFiltro&&s.key!==detCatFiltro?0.3:1}));
  const total=segsF.reduce((s,x)=>s+x.amt,0);
  const wrap=document.getElementById('dist-bar-wrap');
  if(wrap) wrap.innerHTML=UI.distBar(segsF,total,'setDistFiltro');
}

// ── PÁGINA: TARJETA CRÉDITO ──
function renderTC(){
  hideTooltip();
  const pending=tcData.filter(r=>ESTADO_PENDIENTE.has(r.estado));
  function fechaToMesKey(f){
    if(!f) return '';
    let d=f.startsWith('Date(')?new Date(...f.replace('Date(','').replace(')','').split(',').map(Number)):new Date(f);
    return isNaN(d)?'':`${MESES[d.getMonth()]}-${d.getFullYear()}`;
  }
  // Construir movsMap
  const movsMap={};
  tcData.forEach(r=>{
    const k=r.movimiento+'|'+r.fecha;
    if(!movsMap[k]) movsMap[k]={movimiento:r.movimiento,fecha:r.fecha,total:r.total,cuotas:r.cuotas,valorCuota:r.valorCuota,pendientesCount:0,pendientesMonto:0,mesFin:'',mesCompra:fechaToMesKey(r.fecha)};
    const m=movsMap[k];
    if(ESTADO_PENDIENTE.has(r.estado)){m.pendientesCount++;m.pendientesMonto+=r.valorCuota;if(!m.mesFin||monthKey(r.mes)>monthKey(m.mesFin))m.mesFin=r.mes;}
  });
  Object.values(movsMap).forEach(m=>{m.pagadas=Math.max(0,m.cuotas-m.pendientesCount);});
  const todosMovsPend=Object.values(movsMap).filter(m=>m.pendientesCount>0)
    .sort((a,b)=>{const d=parseFechaNum(a.fecha)-parseFechaNum(b.fecha);return d!==0?d:a.movimiento.localeCompare(b.movimiento,'es');});
  const deudaTotal=todosMovsPend.reduce((a,m)=>a+m.pendientesMonto,0);
  const mesesCompra=[...new Set(todosMovsPend.map(m=>m.mesCompra).filter(Boolean))].sort((a,b)=>monthKey(a)-monthKey(b));
  const movNombres=[...new Set(todosMovsPend.map(m=>m.movimiento))].sort((a,b)=>a.localeCompare(b,'es'));

  // Filtrar
  let movsFiltrados=todosMovsPend;
  if(tcFiltroMes) movsFiltrados=movsFiltrados.filter(m=>m.mesCompra===tcFiltroMes);
  if(tcFiltroMov) movsFiltrados=movsFiltrados.filter(m=>m.movimiento===tcFiltroMov);
  const deudaFiltrada=movsFiltrados.reduce((a,m)=>a+m.pendientesMonto,0);
  const filteredKeys=new Set(movsFiltrados.map(m=>m.movimiento+'|'+m.fecha));

  // Proyección
  const proyMap={};
  tcData.filter(r=>ESTADO_PENDIENTE.has(r.estado)&&filteredKeys.has(r.movimiento+'|'+r.fecha))
    .forEach(r=>{proyMap[r.mes]=(proyMap[r.mes]||0)+r.valorCuota;});
  const proyMeses=Object.entries(proyMap).sort((a,b)=>monthKey(a[0])-monthKey(b[0]));

  // Debug
  const estadosUnicos=[...new Set(tcData.map(r=>r.estado||'(vacío)'))];
  const debugBox=tcData.length===0
    ?`<div class="debug-box">⚠ No se cargaron filas de <code>Tarjeta Credito</code>.</div>`
    :pending.length===0?`<div class="debug-box">⚠ ${tcData.length} filas cargadas pero ninguna pendiente.<br>Estados: ${estadosUnicos.map(e=>`<code>${e}</code>`).join(' · ')}</div>`:'';

  // Tooltip CLP completo
  const tooltipFn=makeExternalTooltip(i=>fmtMesLabel(proyMeses[i][0]),i=>[{color:'#00b89e',label:'Cuotas',val:fmtM(proyMeses[i][1])}]);

  // Filtros + botón limpiar separado
  const opsMeses=mesesCompra.map(m=>({value:m,label:fmtMesLabel(m),amt:fmtM(todosMovsPend.filter(mv=>mv.mesCompra===m).reduce((a,mv)=>a+mv.pendientesMonto,0))}));
  const opsMov=movNombres.map(n=>({value:n,label:n,amt:fmtM(todosMovsPend.filter(mv=>mv.movimiento===n).reduce((a,mv)=>a+mv.pendientesMonto,0))}));
  const hasFiltro=tcFiltroMes||tcFiltroMov;

  const filtrosHTML=`
    <div class="filter-row">
      <div class="filter-group">
        <div class="filter-label">Mes de compra</div>
        ${buildDropdown('dd-mes',opsMeses,tcFiltroMes,'Todos los meses','setTcMes')}
      </div>
      <div class="filter-group">
        <div class="filter-label">Movimiento</div>
        ${buildDropdown('dd-mov',opsMov,tcFiltroMov,'Todos los movimientos','setTcMov')}
      </div>
      ${hasFiltro?btnClear('clearTcFiltros'):''}
      ${hasFiltro?`<div style="display:flex;flex-direction:column;gap:5px">
        <div class="filter-label">Pendiente filtrado</div>
        <div style="padding:9px 14px;background:rgba(237,22,80,.07);border:1.5px solid rgba(237,22,80,.2);border-radius:10px;font-size:13px;font-weight:800;color:#ED1650">${fmtM(deudaFiltrada)}</div>
      </div>`:''}
    </div>`;

  // Tabla movimientos
  const tbodyRows=movsFiltrados.map((m,i)=>{
    const pagadoMonto=m.total-m.pendientesMonto;
    const isUlt=m.pendientesCount===1;
    const bg=i%2===0?'transparent':'rgba(0,0,0,.012)';
    return`<tr style="border-bottom:1px solid var(--border);background:${bg}">
      <td class="tc-td" style="font-weight:600;color:var(--text);max-width:220px">${esc(m.movimiento)}${isUlt?UI.pillUltima():''}</td>
      <td class="tc-td" style="text-align:center;color:var(--muted);white-space:nowrap">${fmtFecha(m.fecha)}</td>
      <td class="tc-td" style="text-align:right;color:var(--muted)">${fmtM(m.total)}</td>
      <td class="tc-td" style="text-align:right;color:#00D2BE">${fmtM(pagadoMonto)}</td>
      <td class="tc-td" style="text-align:right;color:#ED1650;font-weight:700">${fmtM(m.pendientesMonto)}</td>
      <td class="tc-td" style="text-align:right;color:var(--muted)">${fmtM(m.valorCuota)}</td>
      <td class="tc-td" style="text-align:center;min-width:80px">${UI.cuotasProg(m.pagadas,m.cuotas,isUlt)}</td>
      <td class="tc-td" style="text-align:center;color:${isUlt?'#00D2BE':'var(--muted)'};font-weight:${isUlt?700:400};white-space:nowrap">${fmtMesCorto(m.mesFin)}</td>
    </tr>`;
  }).join('');

  document.getElementById('page-content').innerHTML=`
${UI.hero('Tarjeta Crédito',fmtM(deudaTotal),'pendiente')}
${debugBox}
${UI.card('Proyección Mensual',`<div style="font-size:11px;color:var(--muted);font-weight:600">${proyMeses.length} meses</div>`,`<div style="position:relative;height:260px"><canvas id="tc-chart"></canvas></div>`,'margin-bottom:var(--gap)')}
${UI.card('Movimientos Pendientes',`<div style="font-size:11px;color:var(--muted)">${movsFiltrados.length} movimientos</div>`,`${filtrosHTML}
<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:12px">
  <thead><tr style="border-bottom:2px solid var(--border)">
    <th class="tc-th" style="text-align:left">Movimiento</th><th class="tc-th" style="text-align:center">Fecha</th>
    <th class="tc-th" style="text-align:right">$ Total</th><th class="tc-th" style="text-align:right">$ Pagado</th>
    <th class="tc-th" style="text-align:right">$ Pendiente</th><th class="tc-th" style="text-align:right">$ Cuota</th>
    <th class="tc-th" style="text-align:center">Cuotas</th><th class="tc-th" style="text-align:center">Mes Fin</th>
  </tr></thead>
  <tbody>${tbodyRows}</tbody>
  <tfoot><tr style="border-top:2px solid var(--border);background:rgba(0,0,0,.015)">
    <td colspan="4" style="padding:9px;font-weight:700;color:var(--text)">Total Pendiente</td>
    <td style="padding:9px 8px;text-align:right;font-weight:800;color:#ED1650;font-size:13px">${fmtM(deudaFiltrada)}</td>
    <td style="padding:9px 8px;text-align:right;font-weight:800;color:var(--muted);font-size:13px">${fmtM(movsFiltrados.reduce((a,m)=>a+m.valorCuota,0))}</td>
    <td colspan="2"></td>
  </tr></tfoot>
</table></div>`)}`;

  requestAnimationFrame(()=>{
    const canvas=document.getElementById('tc-chart');
    if(!canvas) return;
    destroyChart('tc');
    const ctx=canvas.getContext('2d');
    const grad=ctx.createLinearGradient(0,0,0,260);

function renderCreditos(){
  hideTooltip();
  function fechaTs(str){
    if(!str) return 0;
    if(str.startsWith('Date(')){const p=str.replace('Date(','').replace(')','').split(',').map(Number);return new Date(p[0],p[1],p[2]).getTime();}
    return new Date(str).getTime()||0;
  }
  const creditosMap={};
  credData.forEach(r=>{
    if(!creditosMap[r.detalle]) creditosMap[r.detalle]={detalle:r.detalle,fecha:r.fecha,cuotas:r.cuotas,valorCuota:r.valorCuota,pagadas:0,pendientes:0,mesFin:'',mesFinPagado:''};
    const c=creditosMap[r.detalle];
    if(r.estado==='pagado'){c.pagadas++;if(!c.mesFinPagado||monthKey(r.mes)>monthKey(c.mesFinPagado))c.mesFinPagado=r.mes;}
    else{c.pendientes++;if(!c.mesFin||monthKey(r.mes)>monthKey(c.mesFin))c.mesFin=r.mes;}
    if(r.valorCuota>0) c.valorCuota=r.valorCuota;

  const todos=Object.values(creditosMap).filter(c=>c.cuotas>0).sort((a,b)=>fechaTs(a.fecha)-fechaTs(b.fecha));

function calcAhorroMamaSaldos(){
  const meses=[...new Set(mamaData.map(r=>r.mes))].sort((a,b)=>monthKey(a)-monthKey(b));
  let acum=0;
  return meses.map(mes=>{
    const rows=mamaData.filter(r=>r.mes===mes);
    const ingresos=rows.filter(r=>r.tipo==='ingreso').reduce((a,r)=>a+r.monto,0);
    const gastos=rows.filter(r=>r.tipo!=='ingreso').reduce((a,r)=>a+r.monto,0);
    acum+=ingresos-gastos;
    return{mes,ingresos,gastos,neto:ingresos-gastos,saldo:acum};
  });
}

}

function calcMamaTransSaldos(){

    if(!mesMap[r.mes]) mesMap[r.mes]={mes:r.mes,ingresos:0,gastos:0,rows:[]};
    mesMap[r.mes].rows.push(r);
    if(r.tipo==='ingreso') mesMap[r.mes].ingresos+=r.monto;
    else mesMap[r.mes].gastos+=r.monto;
  });
  const meses=Object.keys(mesMap).sort((a,b)=>monthKey(a)-monthKey(b));
  let acum=0;
  return meses.map(mes=>{
    const d=mesMap[mes];
    acum+=d.ingresos-d.gastos;
    return{mes,ingresos:d.ingresos,gastos:d.gastos,neto:d.ingresos-d.gastos,saldo:acum,rows:d.rows};
  });
}

function renderNewMamaChart(saldoPorMes){
  const slice=newMamaEvoRange===0?saldoPorMes:saldoPorMes.slice(-newMamaEvoRange);
  const canvas=document.getElementById('new-mama-chart');
  if(!canvas) return;
  destroyChart('newMama');
  const labels=slice.map(s=>{const[m,y]=s.mes.split('-');return[m.slice(0,3).toUpperCase(),y];});
  const labelsFmt=slice.map(s=>fmtMesLabel(s.mes));
  const tooltipFn=makeExternalTooltip(i=>labelsFmt[i],i=>{
    const s=slice[i],fmtS=v=>v<0?`-${fmtM(Math.abs(v))}`:fmtM(v);
    return[{color:'#00D2BE',label:'Acumulado',val:fmtS(s.saldo)},{color:'#059669',label:'Ingresos',val:fmtM(s.ingresos)},{color:'#ED1650',label:'Gastos',val:fmtM(s.gastos)},{color:'#6b6a8a',label:'Neto mes',val:fmtS(s.neto)}];
  });
  charts.newMama=new Chart(canvas,{type:'bar',plugins:[MAMA_BAR_LABELS],
    data:{labels,datasets:[
      {label:'Ingresos',data:slice.map(s=>s.ingresos),backgroundColor:'rgba(0,210,190,.6)',borderColor:'rgba(0,210,190,.85)',borderWidth:1,borderRadius:{topLeft:4,topRight:4,bottomLeft:0,bottomRight:0},stack:'stack',order:2},
      {label:'Gastos',data:slice.map(s=>-s.gastos),backgroundColor:'rgba(237,22,80,.5)',borderColor:'rgba(237,22,80,.75)',borderWidth:1,borderRadius:{topLeft:0,topRight:0,bottomLeft:4,bottomRight:4},stack:'stack',order:2},
      {label:'Acumulado',data:slice.map(s=>s.saldo),type:'line',borderColor:'#00D2BE',borderWidth:2.5,pointRadius:3.5,pointHoverRadius:6,pointBackgroundColor:'#00D2BE',pointBorderColor:'#fff',pointBorderWidth:2,fill:false,tension:.3,order:1,yAxisID:'ySaldo'}
    ]},
    options:{responsive:true,maintainAspectRatio:false,events:['mousemove','mouseout','click'],interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:{enabled:false,external:tooltipFn}},
      scales:{
        x:{grid:{display:false},ticks:{font:{family:SF,size:10},color:'#9CA3AF',maxRotation:0}},
        y:{stacked:true,grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{family:SF,size:10},color:'#9CA3AF',callback:v=>fmtM(v,true)}},

      }}});
}

function setPendFiltro(resp){pendDistFiltro=pendDistFiltro===resp?'':resp;renderPendientes();}

function renderPendientes(){
  hideTooltip();
  if(!pendientesData.length){document.getElementById('page-content').innerHTML=`<div class="error-box">No se encontraron datos en la pestaña <strong>Pendientes</strong>.</div>`;return;}

  // Construir ítems agrupados
  const itemsMap={};
  pendientesData.forEach(r=>{
    const k=r.responsable+'|'+r.detalle+'|'+r.fecha;
    if(!itemsMap[k]) itemsMap[k]={responsable:r.responsable,detalle:r.detalle,fecha:r.fecha,total:r.total,cuotas:r.cuotas,valorCuota:r.monto,pendientesCount:0,montoPendiente:0,mesFin:''};
    const it=itemsMap[k];
    if(ESTADO_PENDIENTE.has(r.estado)){it.pendientesCount++;it.montoPendiente+=r.monto;if(!it.mesFin||monthKey(r.mes)>monthKey(it.mesFin))it.mesFin=r.mes;}
    if(r.monto>0) it.valorCuota=r.monto;
  });
  Object.values(itemsMap).forEach(it=>{it.pagadas=Math.max(0,it.cuotas-it.pendientesCount);});

  const todosItems=Object.values(itemsMap).filter(i=>i.cuotas>0).sort((a,b)=>{
    const rc=a.responsable.localeCompare(b.responsable,'es');if(rc!==0)return rc;
    const fd=parseFechaNum(a.fecha)-parseFechaNum(b.fecha);if(fd!==0)return fd;
    return a.detalle.localeCompare(b.detalle,'es');
  });
  const activos=todosItems.filter(i=>i.pendientesCount>0);
  const respUnicos=[...new Set(pendientesData.map(r=>r.responsable))].sort();
  const respColorMap=Object.fromEntries(respUnicos.map((r,i)=>[r,RESP_COLORS[i%RESP_COLORS.length]]));

  // Segmentos distribución
  const distSegs=respUnicos.map(r=>({label:r,color:respColorMap[r],amt:activos.filter(i=>i.responsable===r).reduce((a,i)=>a+i.montoPendiente,0),opacity:!pendDistFiltro||pendDistFiltro===r?1:.3})).filter(d=>d.amt>0).sort((a,b)=>b.amt-a.amt);
  const totalDist=distSegs.reduce((a,d)=>a+d.amt,0);

  // Filtrar
  const filteredItems=pendDistFiltro?activos.filter(i=>i.responsable===pendDistFiltro):activos;
  const filteredKeys=new Set(filteredItems.map(i=>i.responsable+'|'+i.detalle+'|'+i.fecha));
  const totalPend=filteredItems.reduce((a,i)=>a+i.montoPendiente,0);

  // Proyección
  const proyMap={};
  pendientesData.filter(r=>ESTADO_PENDIENTE.has(r.estado)&&filteredKeys.has(r.responsable+'|'+r.detalle+'|'+r.fecha))
    .forEach(r=>{proyMap[r.mes]=(proyMap[r.mes]||0)+r.monto;});
  const proy=Object.entries(proyMap).sort((a,b)=>monthKey(a[0])-monthKey(b[0]));

  // Tabla
  const tableRows=filteredItems.map((it,i)=>{
    const pagadoMonto=it.total>0?it.total-it.montoPendiente:it.pagadas*it.valorCuota;
    const isUlt=it.pendientesCount===1;
    const bg=i%2===0?'transparent':'rgba(0,0,0,.012)';
    const color=respColorMap[it.responsable]||'#00D2BE';
    return`<tr style="border-bottom:1px solid var(--border);background:${bg}">
      <td class="tc-td" style="font-weight:700;white-space:nowrap"><span style="display:inline-block;width:6px;height:6px;border-radius:2px;background:${color};margin-right:5px;vertical-align:middle"></span><span style="color:${color}">${esc(it.responsable)}</span></td>
      <td class="tc-td" style="text-align:center;color:var(--muted);white-space:nowrap">${fmtFecha(it.fecha)}</td>
      <td class="tc-td" style="max-width:260px;font-weight:600">${esc(it.detalle)}${isUlt?UI.pillUltima():''}</td>
      <td class="tc-td" style="text-align:right;color:var(--muted)">${it.total>0?fmtM(it.total):'—'}</td>
      <td class="tc-td" style="text-align:right;color:#00D2BE">${fmtM(pagadoMonto)}</td>
      <td class="tc-td" style="text-align:right;color:#ED1650;font-weight:700">${fmtM(it.montoPendiente)}</td>
      <td class="tc-td" style="text-align:right;color:var(--muted)">${fmtM(it.valorCuota)}</td>
      <td class="tc-td" style="text-align:center;min-width:80px">${it.cuotas>0?UI.cuotasProg(it.pagadas,it.cuotas,isUlt):'—'}</td>
      <td class="tc-td" style="text-align:center;color:${isUlt?'#00D2BE':'var(--muted)'};white-space:nowrap">${it.mesFin?fmtMesCorto(it.mesFin):'—'}</td>
    </tr>`;
  }).join('');

  const proyColor='#00D2BE';

  document.getElementById('page-content').innerHTML=`
${UI.hero('Pendientes',fmtM(totalPend),'pendiente')}
${UI.sectionLabel('Distribución por responsable')}
<div class="card" style="margin-bottom:var(--gap)">
  ${UI.distBar(distSegs,totalDist,'setPendFiltro')}
  ${pendDistFiltro?`<div style="margin-top:8px"><button class="btn-clear" onclick="setPendFiltro('')">✕ ${esc(pendDistFiltro)}</button></div>`:''}
</div>
${UI.sectionLabel('Detalle de compromisos')}
<div class="card" style="margin-bottom:var(--gap)">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <div style="font-size:13px;font-weight:800;color:var(--text)">Compromisos activos</div>
    <div style="font-size:11px;color:var(--muted)">${filteredItems.length} ítems${pendDistFiltro?' · '+pendDistFiltro:''}</div>
  </div>
  <div style="overflow-x:auto">
  <table style="border-collapse:collapse;font-size:12px;width:100%">
    <thead><tr style="border-bottom:2px solid var(--border)">
      <th class="tc-th" style="text-align:left;position:sticky;top:0;background:var(--card);z-index:1">Responsable</th>
      <th class="tc-th" style="text-align:center;position:sticky;top:0;background:var(--card);z-index:1">Fecha</th>
      <th class="tc-th" style="text-align:left;position:sticky;top:0;background:var(--card);z-index:1">Detalle</th>
      <th class="tc-th" style="text-align:right;position:sticky;top:0;background:var(--card);z-index:1">$ Total</th>
      <th class="tc-th" style="text-align:right;position:sticky;top:0;background:var(--card);z-index:1">$ Pagado</th>
      <th class="tc-th" style="text-align:right;position:sticky;top:0;background:var(--card);z-index:1">$ Pendiente</th>
      <th class="tc-th" style="text-align:right;position:sticky;top:0;background:var(--card);z-index:1">$ Cuota</th>
      <th class="tc-th" style="text-align:center;position:sticky;top:0;background:var(--card);z-index:1"># Cuotas</th>
      <th class="tc-th" style="text-align:center;position:sticky;top:0;background:var(--card);z-index:1">Mes Fin</th>
    </tr></thead>
    <tbody>${tableRows}</tbody>
    <tfoot><tr style="border-top:2px solid var(--border);background:rgba(0,0,0,.015)">
      <td colspan="4" style="padding:9px;font-weight:700;color:var(--text)">Total</td>
      <td style="padding:9px 8px;text-align:right;font-weight:800;color:#059669">${fmtM(filteredItems.reduce((a,i)=>a+(i.total>0?i.total-i.montoPendiente:i.pagadas*i.valorCuota),0))}</td>
      <td style="padding:9px 8px;text-align:right;font-weight:800;color:#ED1650;font-size:13px">${fmtM(totalPend)}</td>
      <td style="padding:9px 8px;text-align:right;font-weight:800;color:var(--muted)">${fmtM(filteredItems.reduce((a,i)=>a+i.valorCuota,0))}</td>
      <td colspan="2"></td>
    </tr></tfoot>
  </table></div>
</div>
${UI.sectionLabel('Proyección de pagos')}
${UI.card('',`<div style="font-size:11px;color:var(--muted)">${proy.length} meses</div>`,`<div style="position:relative;height:240px"><canvas id="pend-proy"></canvas></div>`,'margin-bottom:var(--gap)')}`;

  requestAnimationFrame(()=>{
    const canvas=document.getElementById('pend-proy');
    if(!canvas||!proy.length) return;
    destroyChart('pendProy');
    const ttProy=makeExternalTooltip(i=>fmtMesLabel(proy[i][0]),i=>[{color:proyColor,label:'Cuotas',val:fmtM(proy[i][1])}]);
    charts.pendProy=new Chart(canvas,{type:'bar',plugins:[makeBarLabelPlugin('blPend')],
      data:{labels:proy.map(([mes])=>{const[m,y]=mes.split('-');return[m.slice(0,3).toUpperCase(),y];}),
        datasets:[{data:proy.map(([,v])=>v),backgroundColor:proyColor+'bb',hoverBackgroundColor:proyColor,borderWidth:0,borderRadius:7,borderSkipped:false}]},
      options:{...stdBarOptions(ttProy),layout:{padding:{top:22}}}});
  });
}

function renderVarios(){
  hideTooltip();
  const od=otrosData;
  const g=(t,m,fb=null)=>{ const v=od['_get']?od['_get'](t,m):null; return v!=null?v:fb; };

  const now=new Date();
  const hoy=now.toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'});

  // ── DISPONIBLE ──
  const totalDisp=parseMonto(g('santander','monto',0));
  let finRaw=g('santander','fecha fin',null);
  let finDate=null;
  if(finRaw!=null){
    const sv=String(finRaw).trim();
    if(typeof finRaw==='number'){
      finDate=new Date(Date.UTC(1899,11,30)+finRaw*86400000);
    } else if(sv.startsWith('Date(')){
      const p=sv.replace('Date(','').replace(')','').split(',').map(Number);
      finDate=new Date(p[0],p[1],p[2]);
    } else {
      const mmap={ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,oct:9,nov:10,dic:11,
        enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,octubre:9,noviembre:10,diciembre:11};
      const m=sv.match(/(\d{1,2})[-\/\s]([a-záéíóú]+)/i);
      if(m){
        const dia=parseInt(m[1]),mesK=m[2].toLowerCase().slice(0,3),mesN=mmap[mesK]??mmap[m[2].toLowerCase()]??-1;
        if(mesN>=0){finDate=new Date(now.getFullYear(),mesN,dia);if(finDate<now)finDate.setFullYear(now.getFullYear()+1);}
      } else finDate=new Date(sv);
    }
    if(finDate&&isNaN(finDate))finDate=null;
  }
  const hoyStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let diasRest=null,diario=0,diarioManana=0,finLabel='—';
  if(finDate){
    // días desde HOY hasta finDate: hoy=8jun, fin=29jun → 21 días
    diasRest=Math.max(1,Math.round((finDate-hoyStart)/86400000));
    diario=totalDisp>0&&diasRest>0?totalDisp/diasRest:0;
    // mañana: misma plata, un día menos de plazo
    diarioManana=totalDisp>0&&diasRest>1?totalDisp/(diasRest-1):diario;
    finLabel=finDate.toLocaleDateString('es-CL',{day:'numeric',month:'long'});
  }

  // ── IPC ──
  const ipcRaw=g('ipc','valor ipc',null);
  let ipcPct=0,ipcLabel='—';
  if(ipcRaw!=null){
    const n=typeof ipcRaw==='number'?ipcRaw:parseFloat(String(ipcRaw).replace('%','').replace(',','.').trim());
    if(!isNaN(n)){ipcPct=n<1?n*100:n;ipcLabel=ipcPct.toFixed(1)+'%';}
  }
  const baseOld=parseMonto(g('ipc','base old',0));
  // Porcentaje: puede venir como 0.8527 o 85.27 — normalizar a decimal
  const pctRaw=g('ipc','porcentaje',null);
  let pctDec=1;
  if(pctRaw!=null){
    const pn=typeof pctRaw==='number'?pctRaw:parseFloat(String(pctRaw).replace('%','').replace(',','.'));
    if(!isNaN(pn)) pctDec=pn>1?pn/100:pn;
  }
  const liquidoOld=Math.round(baseOld*pctDec);
  const liquidoNew=Math.round(baseOld*(1+ipcPct/100)*pctDec);
  const aumento=liquidoNew-liquidoOld;

  // ── LATAM PASS ──
  const millasAct=parseMonto(g('latam','millas',0));
  const GOLD_META=parseMonto(g('latam','gold',18000));
  const SILVER_META=parseMonto(g('latam','silver',35000));

  // Promedio semanal: millas / días transcurridos del año × 7
  const ini=new Date(now.getFullYear(),0,1); // 01-ene del año actual
  const diasAnio=Math.max(1,Math.round((hoyStart-ini)/86400000)+1);
  const promSemanal=millasAct>0?(millasAct/diasAnio)*7:0;

  // Proyección: cuántas semanas hasta llegar a la meta
  const semanasHastaMeta=(meta)=>promSemanal>0?((meta-millasAct)/promSemanal):null;
  const addSemanas=(semanas)=>{
    if(semanas===null)return null;
    const d=new Date(now);
    d.setDate(d.getDate()+Math.ceil(semanas)*7);
    return d;
  };
  const fmtFechaCorta=d=>d?d.toLocaleDateString('es-CL',{month:'long',year:'numeric'}):'—';

  const esSilver=millasAct>=GOLD_META;
  const metaActual=esSilver?SILVER_META:GOLD_META;
  const nivelLabel=esSilver?'SILVER':'GOLD';
  const nivelColor=esSilver?'#C0C0C0':'#00D2BE';
  const nivelBg=esSilver?'linear-gradient(90deg,#C0C0C0,#a8a8a8)':'linear-gradient(90deg,#00D2BE,#009b8d)';
  const pctTotal=Math.min(millasAct/SILVER_META*100,100);
  const restantes=Math.max(0,metaActual-millasAct);
  const fechaMetaGold=millasAct<GOLD_META?addSemanas(semanasHastaMeta(GOLD_META)):null;
  const fechaMetaSilver=millasAct<SILVER_META?addSemanas(semanasHastaMeta(SILVER_META)):null;

  const deltaDiario=diarioManana-diario;

  // ── PAGO TC ──
  const tcTotalRaw=g('tc','total',null);
  const tcAvanceRaw=g('tc','copec',null);
  const tcAvance=tcAvanceRaw!=null?parseMonto(tcAvanceRaw):0;
  let tcObjetivo=tcTotalRaw!=null?parseMonto(tcTotalRaw):0;
  if(!tcObjetivo){
    const proyTCMap={};
    tcData.filter(r=>ESTADO_PENDIENTE.has(r.estado)).forEach(r=>{proyTCMap[r.mes]=(proyTCMap[r.mes]||0)+r.valorCuota;});
    const primMes=Object.entries(proyTCMap).sort((a,b)=>monthKey(a[0])-monthKey(b[0]))[0];
    if(primMes) tcObjetivo=primMes[1];
  }
  const pctTC=tcObjetivo>0?Math.min(Math.round(tcAvance/tcObjetivo*100),100):0;

  document.getElementById('page-content').innerHTML=`
${UI.hero('Varios','Varios','datos')}

${UI.sectionLabel('Liquidez · Cuenta Corriente')}
<div class="r-grid-liq">
  <div class="card">
    <div class="widget-title">Disponible</div>
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px">
      <div style="font-size:24px;font-weight:800;color:#00D2BE;line-height:1.1">${fmtM(totalDisp)}</div>
      ${finDate?`<div style="font-size:11px;font-weight:600;color:var(--muted)">${finLabel} · ${diasRest} días</div>`:''}
    </div>
    ${finDate?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div>
        <div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">Disponible hoy</div>
        <div style="font-size:18px;font-weight:800;color:var(--accent)">${fmtM(diario)}</div>
      </div>
      <div style="border-left:1px solid var(--border);padding-left:10px">
        <div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">Disponible mañana</div>
        <div style="font-size:18px;font-weight:800;color:#00D2BE">${fmtM(diarioManana)}</div>
      </div>
    </div>
    ${deltaDiario!==0?`<div style="margin-top:8px;font-size:13px;font-weight:800;color:${deltaDiario>0?'#00D2BE':'#ED1650'}">${deltaDiario>0?'↑ +':'↓ '}${fmtM(Math.abs(deltaDiario))} por día</div>`:''}`:''}
  </div>
  <div class="card">
    <div class="widget-title">Variación IPC</div>
    <div style="font-size:24px;font-weight:800;color:#00D2BE;line-height:1.1;margin-bottom:10px">${ipcLabel}</div>
    <div style="padding-top:10px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div>
        <div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px">Líquido Actual</div>
        <div style="font-size:15px;font-weight:800;color:var(--text)">${liquidoOld?fmtM(liquidoOld):'—'}</div>
      </div>
      <div style="border-left:1px solid var(--border);padding-left:8px">
        <div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px">Líquido Nuevo</div>
        <div style="font-size:15px;font-weight:800;color:var(--text)">${liquidoNew?fmtM(liquidoNew):'—'}</div>
      </div>
    </div>
    ${aumento?`<div style="margin-top:8px;font-size:13px;font-weight:800;color:${aumento>0?'#00D2BE':'#ED1650'}">${aumento>0?'↑ +':'↓ '}${fmtM(Math.abs(aumento))} de aumento</div>`:''}
  </div>
  ${millasAct>0?`<div class="card">
  <!-- Header: millas + badges -->
  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px">
    <div>
      <div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px">Millas acumuladas</div>
      <div style="font-size:28px;font-weight:800;color:#00D2BE;line-height:1">${fmtNum(millasAct)}</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">
      <span style="background:${nivelColor};color:#fff;font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px">${nivelLabel}</span>
      ${esSilver?`<span style="background:rgba(0,210,190,.12);color:#00D2BE;font-size:10px;font-weight:800;padding:3px 10px;border-radius:20px">GOLD ✓</span>`:''}
    </div>
  </div>

  <!-- Barra dual 0→35k -->
  <div style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;font-size:9px;font-weight:800;color:var(--muted);margin-bottom:5px">
      <span>0</span><span style="color:#d97706">GOLD 18.000</span><span style="color:#6b7280">SILVER 35.000</span>
    </div>
    <div style="position:relative;height:16px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden">
      <div style="position:absolute;left:0;top:0;height:100%;width:${pctTotal.toFixed(1)}%;background:${nivelBg};border-radius:8px;transition:width .5s;display:flex;align-items:center;justify-content:flex-end;padding-right:6px">
        ${pctTotal>12?`<span style="font-size:9px;font-weight:800;color:#fff;white-space:nowrap">${Math.min(Math.round(millasAct/metaActual*100),100)}%</span>`:''}
      </div>
      <div style="position:absolute;left:${(GOLD_META/SILVER_META*100).toFixed(1)}%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.8)"></div>
      ${pctTotal<=12?`<span style="position:absolute;left:${pctTotal+1}%;top:50%;transform:translateY(-50%);font-size:9px;font-weight:800;color:${nivelColor};white-space:nowrap">${Math.min(Math.round(millasAct/metaActual*100),100)}%</span>`:''}
    </div>
  </div>

  <!-- Grid 2 col: ritmo + pendiente -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--border);padding-top:14px">
    <!-- Ritmo -->
    <div style="padding-right:16px">
      <div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px">Ritmo del año</div>
      <div style="display:flex;align-items:baseline;gap:5px">
        <div style="font-size:20px;font-weight:800;color:var(--text)">${fmtNum(Math.round(promSemanal))}</div>
        <div style="font-size:10px;font-weight:600;color:var(--muted)">millas/sem</div>
      </div>
    </div>
    <!-- Pendiente -->
    <div style="padding-left:16px;border-left:1px solid var(--border)">
      <div style="font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px">Pendiente</div>
      <div style="display:flex;align-items:baseline;gap:5px">
        <div style="font-size:20px;font-weight:800;color:${nivelColor}">${fmtNum(restantes)}</div>
        <div style="font-size:10px;font-weight:600;color:var(--muted)">${promSemanal>0?Math.ceil(restantes/promSemanal)+' sem':'—'}</div>
      </div>
    </div>
  </div>
</div>`:`<div class="card" style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-weight:600">Sin datos LATAM Pass</div>`}
  <div class="card">
    <div class="widget-title">Pago Tarjeta Crédito</div>
    <div style="font-size:24px;font-weight:800;color:#00D2BE;line-height:1.1;margin-bottom:10px">${tcObjetivo?fmtM(tcObjetivo):'—'}</div>
    ${tcObjetivo?`
    <div style="display:flex;justify-content:flex-end;margin-bottom:6px">
      <span style="font-size:16px;font-weight:800;color:${pctTC>=100?'#00D2BE':'#ED1650'}">${pctTC}%</span>
    </div>
    <div style="height:18px;background:rgba(0,210,190,.1);border-radius:9px;overflow:hidden;position:relative">
      <div style="height:100%;width:${pctTC}%;background:linear-gradient(90deg,#00D2BE,#009b8d);border-radius:9px;position:relative">
        ${pctTC>=20?`<span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:800;color:#fff;white-space:nowrap">${fmtM(tcAvance,true)}</span>`:''}
      </div>
      ${pctTC<20?`<span style="position:absolute;left:${pctTC+2}%;top:50%;transform:translateY(-50%);font-size:10px;font-weight:800;color:#ED1650;white-space:nowrap">${fmtM(tcAvance,true)}</span>`:''}
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:10px;font-weight:600;color:var(--muted)">
      <span>$0</span><span>${fmtM(tcObjetivo,true)}</span>
    </div>
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:flex;align-items:center;gap:6px">
      ${tcAvance>=tcObjetivo
        ?`<span style="font-size:11px;font-weight:700;color:#00D2BE">↑ A favor</span><span style="font-size:15px;font-weight:800;color:#00D2BE">${fmtM(tcAvance-tcObjetivo)}</span>`
        :`<span style="font-size:11px;font-weight:700;color:#ED1650">↓ Falta</span><span style="font-size:15px;font-weight:800;color:#ED1650">${fmtM(tcObjetivo-tcAvance)}</span>`
      }
    </div>`:`<div style="font-size:12px;color:var(--muted);font-weight:600">Sin datos</div>`}
  </div>
</div>`;
}
// ── NAV ──
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('active');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('active');}
const TAB_TITLES={mensual:'Mensual',tc:'Tarjeta Crédito',creditos:'Créditos',pendientes:'Pendientes',varios:'Varios',ahorroMama:'Ahorro Mamá',mama:'Mamá'};
function setTab(tab,btn){
  document.querySelectorAll('.nav-item').forEach(b=>{b.classList.remove('active');b.dataset.tab='';});
  btn.classList.add('active');btn.dataset.tab=tab;
  document.title=`Mi Portal · ${TAB_TITLES[tab]||tab}`;
  closeSidebar();
  const pages={varios:renderVarios,tc:renderTC,mensual:renderPage,creditos:renderCreditos,ahorroMama:renderAhorroMama,mama:renderMama,pendientes:renderPendientes};
  if(pages[tab]) pages[tab]();
  else{hideTooltip();document.getElementById('page-content').innerHTML=`<div class="loading-state"><div class="loading-text">Próximamente…</div></div>`;}
}

loadData();
</script>
