<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Portal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── TOKENS ── */
:root{
  --bg:#f0eff8;--card:#fff;--border:#e2e0f0;--text:#0F004F;--muted:#6b6a8a;
  --accent:#634dd2;--navy:#1B0088;--green:#059669;--red:#ED1650;--teal:#00b89e;
  --shadow:0 1px 4px rgba(15,0,79,.06),0 4px 16px rgba(15,0,79,.04);
  --shadow-md:0 4px 20px rgba(74,44,168,.12);
  --radius:14px;--gap:16px;--sidebar:220px;--font:'Sofia Sans',sans-serif;
}
html,body{height:100%;font-family:var(--font)}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:#c4c0e0;border-radius:999px}

/* ── LAYOUT ── */
.app{display:flex;flex:1;min-height:100vh}
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-width:0}
.content{padding:24px 28px;flex:1}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar);background:#0F004F;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200;transition:transform .25s;border-right:1px solid rgba(255,255,255,.06)}
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#00e5c8,#a855f7);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark svg{width:16px;height:16px;stroke:#fff}
.sidebar-logo-title{font-size:15px;font-weight:800;color:#fff;letter-spacing:-.2px;line-height:1.1}
.sidebar-logo-sub{font-size:10px;font-weight:600;color:rgba(255,255,255,.3);margin-top:1px}
.sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav-section{font-size:9px;font-weight:800;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:.14em;padding:10px 8px 4px;margin-top:4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:13px;font-weight:700;color:rgba(255,255,255,.5);cursor:pointer;border:none;background:transparent;font-family:var(--font);text-align:left;width:100%;transition:all .15s;position:relative}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.8)}
.nav-item.active{background:linear-gradient(135deg,rgba(0,184,158,.2),rgba(0,184,158,.08));color:#00e5c8}
.nav-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;background:#00e5c8;border-radius:2px}
.nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active .nav-icon{opacity:1}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:10px;font-weight:600;color:rgba(255,255,255,.2);line-height:1.6}
.sidebar-footer span{display:block;color:rgba(255,255,255,.4);font-weight:700;font-size:11px}

/* ── HAMBURGER / OVERLAY ── */
.hamburger{display:none;position:fixed;top:12px;left:12px;z-index:300;flex-direction:column;gap:4px;background:#fff;border:1px solid var(--border);border-radius:9px;cursor:pointer;padding:8px 9px;box-shadow:var(--shadow)}
.hamburger span{display:block;width:18px;height:2px;background:var(--text);border-radius:2px}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,0,79,.45);z-index:150;backdrop-filter:blur(2px)}

/* ── HERO ── */
.hero{background:linear-gradient(135deg,#0F004F 0%,#1a0080 50%,#2d1a6e 100%);border-radius:18px;padding:26px 30px 28px;position:relative;overflow:hidden;margin-bottom:20px;box-shadow:0 12px 40px rgba(15,0,79,.18)}
.orb{position:absolute;border-radius:50%;pointer-events:none}
.orb-1{top:-50px;right:-50px;width:240px;height:240px;background:radial-gradient(circle,rgba(168,85,247,.25) 0%,transparent 70%)}
.orb-2{bottom:-30px;left:38%;width:160px;height:160px;background:radial-gradient(circle,rgba(0,229,200,.1) 0%,transparent 70%)}
.hero-inner{position:relative;z-index:1}
.hero-eyebrow{font-size:10px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.16em;margin-bottom:5px}
.hero-title{font-size:30px;font-weight:800;color:#fff;line-height:1.08;letter-spacing:-.4px}
.hero-title span{background:linear-gradient(90deg,#00e5c8,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:12px;color:rgba(255,255,255,.3);font-weight:500;margin-top:5px}

/* ── KPI ── */
.kpi-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-bottom:20px}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
.kpi-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.kpi-label{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}
.kpi-val{font-size:21px;font-weight:800;color:var(--text);line-height:1;margin-bottom:5px}
.kpi-delta{font-size:12px;font-weight:700;display:flex;align-items:center;gap:3px;min-height:16px}
.delta-up{color:var(--green)}.delta-down{color:var(--red)}

/* ── CARDS ── */
.sec-label{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:13px;font-weight:800;color:var(--text)}
.mama-grid{display:grid;grid-template-columns:6fr 2.8fr;gap:var(--gap)}

/* ── STAT CELLS (reemplaza inline styles repetidos) ── */
.stat-label{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px}
.stat-label--sm{font-size:8px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1px}
.stat-val{font-size:15px;font-weight:800;color:var(--text)}
.stat-val--lg{font-size:20px;font-weight:800;color:var(--text)}
.stat-val--xl{font-size:24px;font-weight:800;line-height:1.1}
.stat-sub{font-size:10px;font-weight:600;color:var(--muted)}
.stat-divider{border-left:1px solid var(--border);padding-left:8px}
.stat-mini{background:rgba(99,77,210,.04);border-radius:6px;padding:5px 8px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:800;white-space:nowrap}
.badge-navy{background:rgba(27,0,136,.08);color:#1B0088}
.badge-green{background:rgba(5,150,105,.1);color:#065f46}
.badge-red{background:rgba(237,22,80,.08);color:#ED1650}
.badge-teal{background:rgba(0,184,158,.1);color:#007a72}
.badge-gray{background:rgba(156,163,175,.1);color:#6b7280}

/* ── PERIOD TOGGLE ── */
.period-toggle{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:2px;gap:2px}
.period-btn{border:none;background:transparent;color:var(--muted);font-family:var(--font);font-size:11px;font-weight:700;padding:4px 12px;border-radius:5px;cursor:pointer;transition:all .15s}
.period-btn.active{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(27,0,136,.25)}

/* ── FILTER DROPDOWN ── */
.filter-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.filter-group{display:flex;flex-direction:column;gap:5px;position:relative}
.filter-label{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.filter-trigger{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:9px 14px;cursor:pointer;min-width:220px;transition:border-color .15s,box-shadow .15s;user-select:none}
.filter-trigger:hover{border-color:var(--accent)}
.filter-trigger.open{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,77,210,.1)}
.filter-trigger-left{display:flex;flex-direction:column;gap:2px}
.filter-trigger-val{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.filter-trigger-val.placeholder{color:var(--muted);font-weight:600}
.filter-trigger-amt{font-size:10px;font-weight:700;color:var(--muted)}
.filter-chevron{width:16px;height:16px;flex-shrink:0;color:var(--muted);transition:transform .2s}
.filter-trigger.open .filter-chevron{transform:rotate(180deg)}
.filter-dropdown{position:absolute;top:calc(100% + 6px);left:0;z-index:100;background:var(--card);border:1.5px solid var(--border);border-radius:12px;box-shadow:0 8px 32px rgba(15,0,79,.12);min-width:100%;max-height:260px;overflow-y:auto;display:none;scrollbar-width:thin;scrollbar-color:#c4c0e0 transparent}
.filter-dropdown.open{display:block}
.filter-option{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;cursor:pointer;transition:background .1s;border-bottom:1px solid rgba(0,0,0,.04)}
.filter-option:last-child{border-bottom:none}
.filter-option:hover{background:rgba(99,77,210,.04)}
.filter-option.selected{background:rgba(99,77,210,.06)}
.filter-option-name{font-size:12px;font-weight:600;color:var(--text)}
.filter-option-amt{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
.filter-option.selected .filter-option-name{color:var(--accent);font-weight:700}
.filter-option.selected .filter-option-amt{color:var(--accent)}
.filter-option-check{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.filter-option.selected .filter-option-check{background:var(--accent);border-color:var(--accent)}
.filter-option.selected .filter-option-check::after{content:'';width:7px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px);display:block}
.btn-clear{display:inline-flex;align-items:center;gap:5px;padding:9px 12px;border:1.5px solid rgba(237,22,80,.25);background:rgba(237,22,80,.06);border-radius:10px;font-family:var(--font);font-size:11px;font-weight:700;color:var(--red);cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-clear:hover{background:rgba(237,22,80,.12);border-color:rgba(237,22,80,.4)}

/* ── CAT PILLS ── */
.cat-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cat-btn{border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font);font-size:11px;font-weight:700;padding:4px 11px;border-radius:6px;cursor:pointer;transition:all .15s}
.cat-btn:hover{border-color:var(--accent);color:var(--accent)}
.cat-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 2px 6px rgba(27,0,136,.25)}
.cat-btn.active[data-cat]:not([data-cat=""]){background:var(--cat-c,var(--navy));border-color:var(--cat-c,var(--navy))}
@media(hover:none){.chart-tooltip{display:none!important}}

/* ── TABLES ── */
.tbl-scroll{overflow-y:auto;max-height:340px;scrollbar-width:thin;scrollbar-color:#c4c0e0 transparent}
table{width:100%;border-collapse:separate;border-spacing:0}
thead th{padding:9px 12px;font-size:10px;font-weight:800;color:var(--accent);text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:1;letter-spacing:.04em}
thead th:last-child{text-align:right}
tbody td{padding:9px 12px;font-size:12px;color:var(--text);border-bottom:1px solid rgba(0,0,0,.035);vertical-align:middle}
tbody td:last-child{text-align:right;font-weight:800}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(99,77,210,.02)}
/* Tabla TC / Pendientes — padding ajustado */
.tc-th{padding:8px;color:var(--muted);font-weight:700;white-space:nowrap;font-size:11px}
.tc-td{padding:9px 8px;font-size:12px}

/* ── DIST BAR ── */
.dist-bar{display:flex;height:64px;border-radius:10px;overflow:hidden;gap:2px;align-items:stretch}
.dist-seg{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;padding:0 8px;transition:filter .15s,opacity .2s;overflow:hidden;min-width:max-content}
.dist-seg:hover{filter:brightness(1.1)}
.dist-seg-name{font-size:9px;font-weight:800;white-space:nowrap}
.dist-seg-info{font-size:9px;font-weight:700;opacity:.88;white-space:nowrap;margin-top:1px}

/* ── CHART LEGEND ── */
.chart-legend{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.legend-dot{width:12px;height:3px;display:inline-block;border-radius:2px;flex-shrink:0}

/* ── MISC STATES ── */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px;gap:12px}
.spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.error-box{background:rgba(237,22,80,.06);border:1px solid rgba(237,22,80,.18);border-radius:12px;padding:20px;text-align:center;font-size:13px;color:var(--red);font-weight:600}
.debug-box{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.25);border-radius:10px;padding:12px 16px;font-size:12px;color:#92400e;font-weight:600;margin-bottom:14px;line-height:1.7}

/* ── TOOLTIP ── */
.chart-tooltip{position:fixed;z-index:9999;pointer-events:none;background:#150a40;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;min-width:180px;font-family:var(--font);box-shadow:0 8px 32px rgba(0,0,0,.35);display:none}
.ct-header{font-size:11px;font-weight:800;color:#fff;margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.ct-divider{height:1px;background:rgba(255,255,255,.08);margin-bottom:7px}
.ct-row{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:4px}
.ct-row:last-child{margin-bottom:0}
.ct-label{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.5)}
.ct-dot{width:6px;height:6px;border-radius:2px;flex-shrink:0}
.ct-val{font-size:12px;font-weight:800;color:#fff}

/* ── WIDGETS ── */
.widget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-bottom:20px}
.widget-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap);margin-bottom:20px}
.widget-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);margin-bottom:20px}
/* .widget hereda de .card; estos modificadores son adicionales */
.widget{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.widget-title{font-size:9px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px}
.widget-val{font-size:22px;font-weight:800;color:var(--text);line-height:1.1}
.widget-sub{font-size:11px;font-weight:600;color:var(--muted);margin-top:4px}
.widget-accent{color:var(--accent)}
.widget-green{color:var(--green)}
.widget-red{color:var(--red)}
.widget-teal{color:var(--teal)}

/* ── PROGRESO CUOTAS ── */
.prog-bar-wrap{margin-top:8px}
.prog-bar-track{height:6px;background:rgba(27,0,136,.07);border-radius:6px;overflow:hidden;margin-top:4px}
.prog-bar-fill{height:100%;border-radius:6px;transition:width .4s}
.prog-label{display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:var(--muted);margin-top:4px}

/* ── AHORRO / TC RESUMEN ── */
.dist-ahorro-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.dist-ahorro-row:last-child{border-bottom:none}
.dist-ahorro-name{font-weight:700;color:var(--text);flex:1}
.dist-ahorro-bank{font-size:11px;color:var(--muted);font-weight:600;margin-right:12px}
.dist-ahorro-pct{font-size:11px;font-weight:800;color:var(--muted);min-width:36px;text-align:right;margin-right:10px}
.dist-ahorro-monto{font-weight:800;color:var(--text)}
.millas-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;font-size:12px}
.tc-resumen-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px}
.tc-resumen-row:last-child{border-bottom:none}
.tc-resumen-label{font-weight:600;color:var(--muted)}
.tc-resumen-val{font-weight:800;color:var(--text)}

/* ── RESPONSIVE ── */
@media(max-width:900px){
  .widget-grid,.widget-grid-4{grid-template-columns:repeat(2,1fr)}
  .widget-grid-2{grid-template-columns:1fr}
  :root{--sidebar:0px}
  .sidebar{transform:translateX(-224px);width:224px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:flex}
  .overlay.active{display:block}
  .kpi-strip{grid-template-columns:repeat(2,1fr)}
  .mama-grid{grid-template-columns:1fr}
  .filter-row{flex-direction:column}
  .filter-trigger{min-width:100%}
}
@media(max-width:560px){
  .content{padding:14px 16px}
  .hero{padding:20px 18px}
  .hero-title{font-size:26px}
  .kpi-strip{grid-template-columns:1fr}
  .widget-grid,.widget-grid-2,.widget-grid-4{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="chart-tooltip" id="chartTooltip">
  <div class="ct-header" id="ct-header"></div>
  <div class="ct-divider"></div>
  <div id="ct-rows"></div>
</div>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<button class="hamburger" id="hamburger" onclick="openSidebar()"><span></span><span></span><span></span></button>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <div>
        <div class="sidebar-logo-title">Mi Portal</div>
        <div class="sidebar-logo-sub">Finanzas Personales</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Reportes</div>
      <button class="nav-item active" onclick="setTab('mensual',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Mensual
      </button>
      <button class="nav-item" onclick="setTab('tc',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        Tarjeta Crédito
      </button>
      <button class="nav-item" onclick="setTab('creditos',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        Créditos
      </button>
      <button class="nav-item" onclick="setTab('pendientes',this)">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Pendientes

const capFirst = s => s ? s[0].toUpperCase()+s.slice(1) : '';
const parseMonto = v => {
  if(v==null) return 0;
  if(typeof v==='number') return v;
  const n=parseFloat(String(v).replace(/[$.\s]/g,'').replace(',','.'));
  return isNaN(n)?0:n;
};

function parseMesCell(cell){
  if(!cell) return '';
  const{v,f=''}=cell;
  if(!v&&v!==0) return '';
  const sv=String(v);
  if(sv.startsWith('Date(')){
    const p=sv.replace('Date(','').replace(')','').split(',').map(Number);
    const m=MESES[p[1]]; return m?`${m}-${p[0]}`:'';}
  if(f&&/[a-záéíóúüñ]+-\d{4}/i.test(f)) return f.toLowerCase();
  if(/[a-záéíóúüñ]+-\d{4}/i.test(sv)) return sv.toLowerCase();
  return sv;
}

function parseMesMama(cell){
  if(!cell) return '';
  const base=parseMesCell(cell); if(base) return base;
  const sv=String(cell.v||'');
  const iso=sv.match(/^(\d{4})-(\d{1,2})-\d{1,2}$/);
  if(iso){const m=MESES[parseInt(iso[2],10)-1];return m?`${m}-${iso[1]}`:'';}
  return '';
}

const monthKey = m => {
  const[mes,año]=String(m).split('-');
  return parseInt(año||0)*12+Math.max(0,MESES.indexOf(mes?.toLowerCase()));
};

// parseFechaNum: convierte string de fecha gviz a timestamp ms
function parseFechaNum(str){
  if(!str) return 0;
  if(str.startsWith('Date(')){
    const p=str.replace('Date(','').replace(')','').split(',').map(Number);
    return new Date(p[0],p[1],p[2]).getTime();
  }
  return new Date(str).getTime()||0;
}

// fmtM: short=true → 200K / 2,05M | short=false → CLP completo
function fmtM(n, short=false){
  const abs=Math.abs(n);
  if(short){
    if(abs>=1e6) return `$${(abs/1e6).toFixed(2).replace('.',',')}M`;
    if(abs>=1e3) return `$${Math.round(abs/1e3).toLocaleString('es-CL')}K`;
  }
  return `$${Math.round(abs).toLocaleString('es-CL')}`;
}
function fmtNum(n){ return Math.round(Math.abs(n)).toLocaleString('es-CL'); }

function deltaKpi(a,b,inv=false){
  if(!b) return '';
  const d=a-b; if(Math.abs(d)<1) return '';
  const good=inv?d<0:d>0;
  return `<span class="${good?'delta-up':'delta-down'}">${d>0?'↑':'↓'} $${Math.round(Math.abs(d)).toLocaleString('es-CL')}</span>`;
}

function fmtFecha(str){
  if(!str) return '—';
  if(str.startsWith('Date(')){
    const p=str.replace('Date(','').replace(')','').split(',').map(Number);
    return new Date(p[0],p[1],p[2]).toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'});
  }
  const d=new Date(str);
  return isNaN(d)?str:d.toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'});
}

const fmtMesLabel = mes => {
  if(!mes) return '—';
  const[m,y]=mes.split('-');
  return `${capFirst(m)} ${y}`;
};

function fmtMesCorto(mes){
  if(!mes) return '—';
  const[m,y]=mes.split('-');
  const map={enero:'ene',febrero:'feb',marzo:'mar',abril:'abr',mayo:'may',junio:'jun',
    julio:'jul',agosto:'ago',septiembre:'sep',octubre:'oct',noviembre:'nov',diciembre:'dic'};
  return `${map[m]||m} ${y}`;
}

// fmtFechaCredito: convierte fecha gviz a mes corto (ej: "jun 2024")
function fmtFechaCredito(str){
  if(!str) return '—';
  if(str.startsWith('Date(')){
    const p=str.replace('Date(','').replace(')','').split(',').map(Number);
    return fmtMesCorto(`${MESES[p[1]]}-${p[0]}`);
  }
  const d=new Date(str);
  return !isNaN(d)?fmtMesCorto(`${MESES[d.getMonth()]}-${d.getFullYear()}`):str;
}

// fechaMesToMesKey: convierte fecha a "mes-año" para filtros TC
function fechaMesToMesKey(f){
  if(!f) return '';
  const d=f.startsWith('Date(')
    ?new Date(...f.replace('Date(','').replace(')','').split(',').map(Number))
    :new Date(f);
  return isNaN(d)?'':`${MESES[d.getMonth()]}-${d.getFullYear()}`;
}

function getTypeColor(tipo, pool){

}

// makeBarLabelPlugin: etiquetas encima de barras (reutilizable)
// mode: 'top' = encima (default), 'inside' = dentro, 'horizontal' = horizontal izquierda
function makeBarLabelPlugin(id, mode='top'){
  return {id, afterDatasetsDraw(chart){
    const{ctx}=chart; ctx.save();
    if(mode==='inside'){
      // Barras stacked Mamá: etiquetas dentro de cada segmento
      const{scales:{y}}=chart;
      chart.data.datasets.forEach((ds,di)=>{
        if(ds.type==='line') return;
        const meta=chart.getDatasetMeta(di);
        ds.data.forEach((val,i)=>{
          if(!val) return;
          const bar=meta.data[i];
          const barH=Math.abs(y.getPixelForValue(0)-bar.y);
          if(barH<18) return;
          ctx.font=`700 9px ${SF}`;
          ctx.fillStyle='rgba(255,255,255,.9)';
          ctx.textAlign='center'; ctx.textBaseline='middle';
          const midY=val>0?(bar.y+(y.getPixelForValue(0)-bar.y)/2):(bar.y-(bar.y-y.getPixelForValue(0))/2);
          ctx.fillText(fmtM(Math.abs(val),true), bar.x, midY);
        });
      });
    } else if(mode==='horizontal'){
      // Barras horizontales Pendientes/Dist: texto a la izquierda del extremo
      chart.getDatasetMeta(0).data.forEach((bar,i)=>{
        const barW=bar.width; if(barW<36) return;
        const val=chart.data.datasets[0].data[i]; if(!val) return;
        ctx.font=`700 10px ${SF}`;
        ctx.fillStyle='rgba(255,255,255,.95)';
        ctx.textAlign='right'; ctx.textBaseline='middle';
        ctx.fillText(fmtM(val,true), bar.x-6, bar.y);
      });
    } else {
      // Barras verticales: texto encima (default)
      chart.data.datasets[0].data.forEach((val,i)=>{
        if(!val) return;
        const bar=chart.getDatasetMeta(0).data[i];
        ctx.font=`700 10px ${SF}`;
        ctx.fillStyle='rgba(0,0,0,.55)';
        ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillText(fmtM(val,true), bar.x, bar.y-3);
      });
    }
    ctx.restore();
  }};
}

function buildDropdown(id,options,currentVal,placeholder,onSelect){
  const selected=options.find(o=>o.value===currentVal);
  const triggerContent=selected
    ?`<div class="filter-trigger-left"><div class="filter-trigger-val">${selected.label}</div><div class="filter-trigger-amt">${selected.amt}</div></div>`

  const chevron=`<svg class="filter-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;
  const opts=options.map(o=>`
    <div class="filter-option${o.value===currentVal?' selected':''}" data-fn="${onSelect}" data-val="${o.value.replace(/"/g,'&quot;').replace(/'/g,'&#39;')}" onclick="event.stopPropagation();closeAllDropdowns();ddSelect(this)">

      <div style="display:flex;align-items:center;gap:8px"><div class="filter-option-amt">${o.amt}</div><div class="filter-option-check"></div></div>
    </div>`).join('');
  return `<div class="filter-trigger" onclick="event.stopPropagation();toggleDropdown('${id}')">${triggerContent}${chevron}</div>
    <div class="filter-dropdown" id="${id}">${opts}</div>`;
}
function ddSelect(el){

function btnClear(onSelect){

// ── DATA FETCH ──
async function fetchSheet(sheet){
  const r=await fetch(`${BASE}&sheet=${encodeURIComponent(sheet)}`);
  if(!r.ok) throw new Error(`HTTP ${r.status} al cargar "${sheet}"`);
  const txt=await r.text();
  return JSON.parse(txt.replace(/^[^{]+/,'').replace(/[^}]+$/,'')).table.rows||[];
}

async function loadData(){
  try{
    const[rowsMensual,rowsTC,rowsCred,rowsMama,rowsOtros,rowsPend]=await Promise.all([
      fetchSheet('mensual'),fetchSheet('Tarjeta Credito'),fetchSheet('Creditos'),
      fetchSheet('Mama'),fetchSheet('Otros'),fetchSheet('Pendientes')
    ]);
    rawData=rowsMensual.map(r=>({
      detalle:String(r.c[0]?.v||''),tipo:String(r.c[1]?.v||'').toLowerCase().trim(),
      mes:parseMesCell(r.c[2]),monto:parseMonto(r.c[3]?.v)
    })).filter(r=>r.mes&&r.monto);

    tcData=rowsTC.map(r=>{
      const total=parseMonto(r.c[2]?.v),cuotas=Number(r.c[3]?.v)||0;
      const rawValor=parseMonto(r.c[6]?.v);
      return{movimiento:String(r.c[0]?.v||''),fecha:String(r.c[1]?.v||''),total,cuotas,
        mes:parseMesCell(r.c[5]),valorCuota:rawValor>0?rawValor:(total>0?total/cuotas:0),
        estado:String(r.c[7]?.v||'').toLowerCase().trim()};
    }).filter(r=>r.movimiento&&r.mes);

    credData=rowsCred.map(r=>({
      detalle:String(r.c[0]?.v||''),fecha:String(r.c[1]?.v||''),cuotas:Number(r.c[2]?.v)||0,
      mes:parseMesCell(r.c[3]),cuotaNum:Number(r.c[4]?.v)||0,
      valorCuota:parseMonto(r.c[5]?.v),estado:String(r.c[6]?.v||'').toLowerCase().trim()
    })).filter(r=>r.detalle&&r.mes);

    mamaData=rowsMama.map(r=>({
      mes:parseMesMama(r.c[0]),tipo:String(r.c[1]?.v||'').toLowerCase().trim(),
      detalle:String(r.c[2]?.v||'').trim(),monto:parseMonto(r.c[3]?.v)
    })).filter(r=>r.mes&&r.detalle);

    pendientesData=rowsPend.map(r=>({
      responsable:String(r.c[0]?.v||'').trim(),detalle:String(r.c[1]?.v||'').trim(),
      fecha:String(r.c[2]?.v||''),total:parseMonto(r.c[3]?.v),cuotas:Number(r.c[4]?.v)||0,
      cuotaNum:Number(r.c[5]?.v)||0,mes:parseMesCell(r.c[6]),monto:parseMonto(r.c[7]?.v),
      estado:String(r.c[8]?.v||'').toLowerCase().trim()
    })).filter(r=>r.responsable&&r.mes);

    if(rowsOtros.length){
      const od={};
      rowsOtros.forEach(row=>{
        const cells=row.c||[];
        const tipo=String(cells[0]?.v||'').trim().toLowerCase();
        const metrica=String(cells[1]?.v||'').trim().toLowerCase();
        const valorRaw=cells[2]?.v!=null?cells[2].v:null;
        if(!tipo||!metrica||valorRaw==null) return;
        od[tipo+'|'+metrica]=valorRaw;
      });
      od['_get']=(t,m)=>{const k=t.toLowerCase()+'|'+m.toLowerCase();return od[k]!=null?od[k]:null;};
      otrosData=od;
    }

    months=[...new Set(rawData.map(r=>r.mes))].sort((a,b)=>monthKey(a)-monthKey(b));
    selMonth=months[months.length-1];
    document.getElementById('month-select').innerHTML=months.map(m=>`<option value="${m}"${m===selMonth?' selected':''}>${fmtMesLabel(m)}</option>`).join('');
    const now=new Date();
    document.getElementById('sidebar-ts').textContent=
      now.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'})+' · '+
      now.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
    renderPage();
  }catch(e){
    document.getElementById('page-content').innerHTML=`<div class="error-box">Error al cargar datos.<br><small style="opacity:.7">${e.message}</small></div>`;
  }
}

// ── DATA HELPERS ──
function sumsFor(mes){
  const m=months.includes(mes)?mes:months[months.length-1];
  const rows=rawData.filter(r=>r.mes===m);
  const sum=types=>rows.filter(r=>types.includes(r.tipo)).reduce((a,r)=>a+r.monto,0);
  const gasto=rows.filter(r=>r.tipo!=='ingreso'&&r.tipo!=='tarjeta credito').reduce((a,r)=>a+r.monto,0);
  return{ing:sum(['ingreso']),gasto,tc:sum(['tarjeta credito'])};
}

function getCatAmounts(mes){
  const m=months.includes(mes)?mes:months[months.length-1];
  const rows=rawData.filter(r=>r.mes===m&&r.tipo!=='ingreso'&&r.tipo!=='tarjeta credito');
  const bkt=Object.fromEntries(CAT_DEF.map(c=>[c.key,0]));
  rows.forEach(r=>{const cat=CAT_DEF.find(c=>c.key!=='otros'&&c.match(r));bkt[cat?cat.key:'otros']+=r.monto;});
  return bkt;
}

function buildDistSegs(mes){
  const m=months.includes(mes)?mes:months[months.length-1];
  const rows=rawData.filter(r=>r.mes===m&&r.tipo!=='ingreso'&&r.tipo!=='tarjeta credito');
  const pool={};
  const tipoMap={};
  rows.forEach(r=>{
    const t=r.tipo;
    if(!tipoMap[t]) tipoMap[t]={label:capFirst(t),color:getTypeColor(t,pool),amt:0};
    tipoMap[t].amt+=r.monto;
  });
  return Object.values(tipoMap).filter(s=>s.amt>0).sort((a,b)=>b.amt-a.amt);
}

    .sort((a,b)=>{const t=a.tipo.localeCompare(b.tipo,'es');return t!==0?t:a.detalle.localeCompare(b.detalle,'es');});

  }).join('')||`<tr><td colspan="4" style="color:#9CA3AF;font-size:12px;padding:20px 0">Sin registros</td></tr>`;
}

function renderDist(){
  const segs=buildDistSegs(selMonth);
  const ing=sumsFor(selMonth).ing;
  const totalGasto=segs.reduce((a,s)=>a+s.amt,0);
  const disponible=ing-totalGasto;
  const dispColor=disponible>=0?'#16a34a':'#ED1650';
  const allSegs=[...segs,{label:disponible>=0?'Disponible':'Déficit',color:dispColor,amt:Math.abs(disponible),esDisp:true}]
    .sort((a,b)=>b.amt-a.amt);
  requestAnimationFrame(()=>{
    const canvas=document.getElementById('dist-bar-chart');
    if(!canvas) return;
    if(charts.distBar){charts.distBar.destroy();delete charts.distBar;}
    const distBarLabels={id:'distBarLabels',afterDatasetsDraw(chart){
      const{ctx}=chart; ctx.save();
      chart.getDatasetMeta(0).data.forEach((bar,i)=>{
        const _tot=allSegs.reduce((s,x)=>s+x.amt,0);
        const _pct=_tot>0?Math.round(allSegs[i].amt/_tot*100):0;
        const label=`${fmtM(allSegs[i].amt,true)} · ${_pct}%`;
        ctx.font=`700 10px ${SF}`;
        const tw=ctx.measureText(label).width;
        if(bar.width>tw+14){
          ctx.fillStyle='rgba(255,255,255,.95)';ctx.textAlign='right';ctx.textBaseline='middle';
          ctx.fillText(label,bar.x-6,bar.y);
        } else {
          ctx.fillStyle=allSegs[i].color;ctx.textAlign='left';ctx.textBaseline='middle';
          ctx.fillText(label,bar.x+6,bar.y);
        }
      });
      ctx.restore();
    }};
    const hasFiltDist=!!detalleFiltroTipo;
    charts.distBar=new Chart(canvas,{type:'bar',plugins:[distBarLabels],
      data:{labels:allSegs.map(s=>s.label),datasets:[{data:allSegs.map(s=>s.amt),
        backgroundColor:allSegs.map(s=>{
          if(!hasFiltDist) return s.color+'dd';
          return s.label.toLowerCase()===detalleFiltroTipo?s.color+'ee':s.color+'22';
        }),
        hoverBackgroundColor:allSegs.map(s=>s.esDisp?s.color+'dd':s.color),
        borderWidth:0,borderRadius:5,borderSkipped:false,
        barThickness:20}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,animation:{duration:300},
        plugins:{legend:{display:false},tooltip:{enabled:false}},
        layout:{padding:{right:50}},
        onClick:(e,els)=>{
          if(!els.length) return;
          const seg=allSegs[els[0].index];
          if(seg.esDisp) return;
          setDetalleFiltro(seg.label.toLowerCase());
        },
        scales:{x:{display:false},y:{grid:{display:false},border:{display:false},
          ticks:{font:{family:SF,size:11,weight:'700'},color:'#0F004F',padding:4}}}}});
    const wrap=document.getElementById('dist-bar-chart-wrap');
    if(wrap) wrap.style.height=Math.max(100,allSegs.length*34)+'px';
  });
}

function renderTC(){
  hideTooltip();
  const pending=tcData.filter(r=>ESTADO_PENDIENTE.has(r.estado));

  // Construir movsMap
  const movsMap={};
  tcData.forEach(r=>{
    const k=r.movimiento+'|'+r.fecha;
    if(!movsMap[k]) movsMap[k]={movimiento:r.movimiento,fecha:r.fecha,total:r.total,cuotas:r.cuotas,
      valorCuota:r.valorCuota,pendientesCount:0,pendientesMonto:0,mesFin:'',
      mesCompra:fechaMesToMesKey(r.fecha)};
    const m=movsMap[k];
    if(ESTADO_PENDIENTE.has(r.estado)){
      m.pendientesCount++;m.pendientesMonto+=r.valorCuota;
      if(!m.mesFin||monthKey(r.mes)>monthKey(m.mesFin))m.mesFin=r.mes;
    }
  });
  Object.values(movsMap).forEach(m=>{m.pagadas=Math.max(0,m.cuotas-m.pendientesCount);});
  const todosMovsPend=Object.values(movsMap).filter(m=>m.pendientesCount>0)
    .sort((a,b)=>{const d=parseFechaNum(a.fecha)-parseFechaNum(b.fecha);return d!==0?d:a.movimiento.localeCompare(b.movimiento,'es');});
  const deudaTotal=todosMovsPend.reduce((a,m)=>a+m.pendientesMonto,0);
  const mesesCompra=[...new Set(todosMovsPend.map(m=>m.mesCompra).filter(Boolean))].sort((a,b)=>monthKey(a)-monthKey(b));
  const movNombres=[...new Set(todosMovsPend.map(m=>m.movimiento))].sort((a,b)=>a.localeCompare(b,'es'));

  // Filtrar
  let movsFiltrados=todosMovsPend;
  if(tcFiltroMes) movsFiltrados=movsFiltrados.filter(m=>m.mesCompra===tcFiltroMes);
  if(tcFiltroMov) movsFiltrados=movsFiltrados.filter(m=>m.movimiento===tcFiltroMov);
  const deudaFiltrada=movsFiltrados.reduce((a,m)=>a+m.pendientesMonto,0);
  const filteredKeys=new Set(movsFiltrados.map(m=>m.movimiento+'|'+m.fecha));

  // Proyección
  const proyMap={};
  tcData.filter(r=>ESTADO_PENDIENTE.has(r.estado)&&filteredKeys.has(r.movimiento+'|'+r.fecha))
    .forEach(r=>{proyMap[r.mes]=(proyMap[r.mes]||0)+r.valorCuota;});
  const proyMeses=Object.entries(proyMap).sort((a,b)=>monthKey(a[0])-monthKey(b[0]));

  // Debug
  const estadosUnicos=[...new Set(tcData.map(r=>r.estado||'(vacío)'))];
  const debugBox=tcData.length===0
    ?`<div class="debug-box">⚠ No se cargaron filas de <code>Tarjeta Credito</code>.</div>`
    :pending.length===0?`<div class="debug-box">⚠ ${tcData.length} filas cargadas pero ninguna pendiente.<br>Estados: ${estadosUnicos.map(e=>`<code>${e}</code>`).join(' · ')}</div>`:'';

  const tooltipFn=makeExternalTooltip(i=>fmtMesLabel(proyMeses[i][0]),i=>[{color:'#059669',label:'Cuotas',val:fmtM(proyMeses[i][1])}]);
  const opsMeses=mesesCompra.map(m=>({value:m,label:fmtMesLabel(m),amt:fmtM(todosMovsPend.filter(mv=>mv.mesCompra===m).reduce((a,mv)=>a+mv.pendientesMonto,0))}));
  const opsMov=movNombres.map(n=>({value:n,label:n,amt:fmtM(todosMovsPend.filter(mv=>mv.movimiento===n).reduce((a,mv)=>a+mv.pendientesMonto,0))}));
  const hasFiltro=tcFiltroMes||tcFiltroMov;

  const filtrosHTML=`
    <div class="filter-row">
      <div class="filter-group">
        <div class="filter-label">Mes de compra</div>
        ${buildDropdown('dd-mes',opsMeses,tcFiltroMes,'Todos los meses','setTcMes')}
      </div>
      <div class="filter-group">
        <div class="filter-label">Movimiento</div>
        ${buildDropdown('dd-mov',opsMov,tcFiltroMov,'Todos los movimientos','setTcMov')}

function calcMamaSaldos(){
  const meses=[...new Set(mamaData.map(r=>r.mes))].sort((a,b)=>monthKey(a)-monthKey(b));
  let acum=0;
  return meses.map(mes=>{
    const rows=mamaData.filter(r=>r.mes===mes);
    const ingresos=rows.filter(r=>r.tipo==='ingreso').reduce((a,r)=>a+r.monto,0);
    const gastos=rows.filter(r=>r.tipo!=='ingreso').reduce((a,r)=>a+r.monto,0);
    acum+=ingresos-gastos;
    return{mes,ingresos,gastos,neto:ingresos-gastos,saldo:acum};
  });
}

function setPendFiltro(resp){pendDistFiltro=pendDistFiltro===resp?'':resp;renderPendientes();}

function renderPendientes(){
  hideTooltip();
  if(!pendientesData.length){document.getElementById('page-content').innerHTML=`<div class="error-box">No se encontraron datos en la pestaña <strong>Pendientes</strong>.</div>`;return;}

  const itemsMap={};
  pendientesData.forEach(r=>{
    const k=r.responsable+'|'+r.detalle+'|'+r.fecha;
    if(!itemsMap[k]) itemsMap[k]={responsable:r.responsable,detalle:r.detalle,fecha:r.fecha,
      total:r.total,cuotas:r.cuotas,valorCuota:r.monto,pendientesCount:0,montoPendiente:0,mesFin:''};
    const it=itemsMap[k];
    if(ESTADO_PENDIENTE.has(r.estado)){
      it.pendientesCount++;it.montoPendiente+=r.monto;
      if(!it.mesFin||monthKey(r.mes)>monthKey(it.mesFin))it.mesFin=r.mes;
    }
    if(r.monto>0) it.valorCuota=r.monto;
  });
  Object.values(itemsMap).forEach(it=>{it.pagadas=Math.max(0,it.cuotas-it.pendientesCount);});

  const todosItems=Object.values(itemsMap).filter(i=>i.cuotas>0).sort((a,b)=>{
    const rc=a.responsable.localeCompare(b.responsable,'es');if(rc!==0)return rc;
    const fd=parseFechaNum(a.fecha)-parseFechaNum(b.fecha);if(fd!==0)return fd;
    return a.detalle.localeCompare(b.detalle,'es');
  });
  const activos=todosItems.filter(i=>i.pendientesCount>0);
  const respUnicos=[...new Set(pendientesData.map(r=>r.responsable))].sort();
  const respColorMap=Object.fromEntries(respUnicos.map((r,i)=>[r,RESP_COLORS[i%RESP_COLORS.length]]));

  const distSegs=respUnicos.map(r=>({label:r,color:respColorMap[r],
    amt:activos.filter(i=>i.responsable===r).reduce((a,i)=>a+i.montoPendiente,0),
    opacity:!pendDistFiltro||pendDistFiltro===r?1:.3
  })).filter(d=>d.amt>0).sort((a,b)=>b.amt-a.amt);

  const filteredItems=pendDistFiltro?activos.filter(i=>i.responsable===pendDistFiltro):activos;
  const filteredKeys=new Set(filteredItems.map(i=>i.responsable+'|'+i.detalle+'|'+i.fecha));

  const now=new Date();

  // ── DISPONIBLE ──
  const totalDisp=parseMonto(g('santander','monto',0));
  let finRaw=g('santander','fecha fin',null);
  let finDate=null;
  if(finRaw!=null){
    const sv=String(finRaw).trim();
    if(typeof finRaw==='number'){
      finDate=new Date(Date.UTC(1899,11,30)+finRaw*86400000);
    } else if(sv.startsWith('Date(')){
      const p=sv.replace('Date(','').replace(')','').split(',').map(Number);
      finDate=new Date(p[0],p[1],p[2]);
    } else {
      const mmap={ene:0,feb:1,mar:2,abr:3,may:4,jun:5,jul:6,ago:7,sep:8,oct:9,nov:10,dic:11,
        enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,octubre:9,noviembre:10,diciembre:11};
      const m=sv.match(/(\d{1,2})[-\/\s]([a-záéíóú]+)/i);
      if(m){
        const dia=parseInt(m[1]),mesK=m[2].toLowerCase().slice(0,3),mesN=mmap[mesK]??mmap[m[2].toLowerCase()]??-1;
        if(mesN>=0){finDate=new Date(now.getFullYear(),mesN,dia);if(finDate<now)finDate.setFullYear(now.getFullYear()+1);}
      } else finDate=new Date(sv);
    }
    if(finDate&&isNaN(finDate))finDate=null;
  }
  const hoyStart=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let diasRest=null,diario=0,diarioManana=0,finLabel='—';
  if(finDate){
    diasRest=Math.max(1,Math.round((finDate-hoyStart)/86400000));
    diario=totalDisp>0&&diasRest>0?totalDisp/diasRest:0;
    diarioManana=totalDisp>0&&diasRest>1?totalDisp/(diasRest-1):diario;
    finLabel=finDate.toLocaleDateString('es-CL',{day:'numeric',month:'long'});
  }

  // ── IPC ──
  const ipcRaw=g('ipc','valor ipc',null);
  let ipcPct=0,ipcLabel='—';
  if(ipcRaw!=null){
    const n=typeof ipcRaw==='number'?ipcRaw:parseFloat(String(ipcRaw).replace('%','').replace(',','.').trim());
    if(!isNaN(n)){ipcPct=n<1?n*100:n;ipcLabel=ipcPct.toFixed(1)+'%';}
  }
  const baseOld=parseMonto(g('ipc','base old',0));
  const pctRaw=g('ipc','porcentaje',null);
  let pctDec=1;

    const pn=typeof pctRaw==='number'?pctRaw:parseFloat(String(pctRaw).replace('%','').replace(',','.'));
    if(!isNaN(pn)) pctDec=pn>1?pn/100:pn;
  }
  const liquidoOld=Math.round(baseOld*pctDec);
  const liquidoNew=Math.round(baseOld*(1+ipcPct/100)*pctDec);
  const aumento=liquidoNew-liquidoOld;

      <div style="padding:0 14px;border-left:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:5px;margin-bottom:4px">
          <span style="background:${GOLD_SOFT};color:${GOLD_COLOR};font-size:9px;font-weight:800;padding:1px 7px;border-radius:10px">GOLD</span>
          <span class="stat-sub">${fmtNum(GOLD_META)}</span>
        </div>
        ${millasAct>=GOLD_META
          ?`<div style="font-size:15px;font-weight:800;color:#059669">✓ Alcanzado</div>`
          :`<div style="font-size:15px;font-weight:800;color:${GOLD_COLOR}">${fmtFechaCorta(fechaMetaGold)}</div>`
        }
      </div>
      <!-- SILVER — solo si ya alcanzó GOLD -->
      ${esSilver?`
      <div style="padding-left:14px;border-left:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:5px;margin-bottom:4px">
          <span style="background:${SILVER_SOFT};color:${SILVER_COLOR};font-size:9px;font-weight:800;padding:1px 7px;border-radius:10px">SILVER</span>
          <span class="stat-sub">${fmtNum(SILVER_META)}</span>
        </div>
        ${millasAct>=SILVER_META
          ?`<div style="font-size:15px;font-weight:800;color:#059669">✓ Alcanzado</div>`
          :`<div style="font-size:15px;font-weight:800;color:${SILVER_COLOR}">${fmtFechaCorta(fechaMetaSilver)}</div>`
        }
      </div>`:''}
    </div>
  </div>
`:''}
</div>`;
}

// ── NAV ──
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('active');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('active');}
function setTab(tab,btn){
  document.querySelectorAll('.nav-item').forEach(b=>{b.classList.remove('active');b.dataset.tab='';});
  btn.classList.add('active');btn.dataset.tab=tab;
  closeSidebar();
  const pages={varios:renderVarios,tc:renderTC,mensual:renderPage,creditos:renderCreditos,mama:renderMama,pendientes:renderPendientes};
  if(pages[tab]) pages[tab]();
  else{hideTooltip();document.getElementById('page-content').innerHTML=`<div class="loading-state"><div class="loading-text">Próximamente…</div></div>`;}
}

loadData();
</script>
</body>
</html>
